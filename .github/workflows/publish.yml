name: Validate and build Quarto book

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.qmd"
      - "_quarto.yml"
      - "styles.scss"
      - "R/**"
      - "data/small/**"
      - "scripts/**"
      - "tutorial.yaml"
      - "env/renv.lock"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - name: Restore locked R environment
        run: |
          Rscript -e 'install.packages("renv", repos = "https://cloud.r-project.org")'
          Rscript -e 'renv::restore(lockfile = "env/renv.lock", library = .libPaths()[1], prompt = FALSE)'

      - name: Validate manifest and series contract
        run: |
          python -m pip install pyyaml
          python scripts/validate_series.py \
            --project-root . \
            --manifest tutorial.yaml \
            --output scaffold_validation.json

      - name: Render
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
