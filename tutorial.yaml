    acceptance_checks:
      - 77 篇编号连续且文件路径唯一
      - _quarto.yml 顺序与 tutorial.yaml 完全一致
      - 第 01–44 篇包含九段结构、确定性合同、真实输入和三格式图形导出
      - 第 06 篇使用 eval false 并从预生成表格与图形渲染
      - 第 07 篇使用 eval true，并明确区分 16S classifier 对象与 shotgun 证据
      - 第 08 篇使用 eval true，并区分 FASTQ Q、mapped identity 与 assembly outcome
      - 第 09 篇使用 eval false，并区分 Windows control plane 与原生 Linux execution evidence
      - 第 10 篇使用 eval false，并区分本地 task-body smoke、容器 runtime 与 SLURM control plane
      - 第 11 篇使用 eval false，并区分软件入口、内置安装测试、数据库下载与数据库依赖型验证
      - 第 12 篇使用 eval false，并区分包加载、Hub discovery、真实取回、对象语义与离线复用
      - 第 13 篇使用 eval false，并区分 raw diagnosis、paired filtering、clean diagnosis、read ledger 与 MultiQC aggregation
      - 第 14 篇使用 eval false，并区分 paired host removal、microbial retention、complexity sensitivity 与 duplicate evidence boundary
      - 第 15 篇使用 eval false，并区分 marker hits、coverage、estimated reads、unclassified denominator 与 species/SGB evidence
      - 第 16 篇使用 eval false，并区分 paired fragments、direct/clade counts、unclassified、Bracken redistribution 与 within-rank denominator
      - 第 17 篇使用 eval false，并区分 truth/reference boundary、confidence、minimum hit groups、human-lineage ancestor calls 与空 Bracken outcome
      - 第 18 篇使用 eval false，并区分 native feature/unit、reference-aware denominator、one-to-one common domain、sensitivity branch 与资源边界
      - 第 19 篇使用 eval false，并区分 read fate、gene-family RPK/strata、pathway abundance reconstruction、pathway coverage 与 special rows
      - 第 20 篇使用 eval false，并区分 CPM/relative abundance、community/levelwise、special-row policy、taxon contribution、coverage、prevalence 与 pseudocount
      - 第 21 篇使用 eval true，并区分 observed/estimated counts、RPK/CoPM/relative abundance、coverage、genome equivalents、zero 与 strata semantics
      - 第 22 篇使用 eval true，并区分 species/gene/MAG feature universe、closure、prevalence、zero、recruitment、重复采样与描述性 PCoA
      - 第 23 篇使用 eval true，并区分 spring-level inference、PCoA/CAP、marginal PERMANOVA、PERMDISP、pairwise estimability 与预登记敏感性分支
      - 第 24 篇使用 eval true，并区分 abundance/prevalence、可估性、FDR family、相对丰度主分析与 reconstructed pseudo-count 敏感性边界
      - 第 25 篇使用 eval true，并区分 rank-specific closure、subject-habitat 单位、prevalence/non-zero abundance、point/stable core 与 threshold sensitivity
      - 第 26 篇使用 eval true，并区分 package snapshot/paper collection、resource release、study-qualified sample key、profile lineage、unit 与 biological units
      - 第 27 篇使用 eval true，并区分训练折预处理、内层调参、外层误差、subject-level OOF 聚合、校准、held-out importance 与 leakage null audit
      - 第 28 篇使用 eval true，并区分五队列 association meta-analysis、三队列方向验证、single-study transfer、真正 N−1 LODO、队列层异质性与层级 bootstrap
      - 第 29 篇使用 eval true，并区分 compositional transform、环境残差化、StARS edge selection、分层 bootstrap、Zi-Pi、degree-preserving null 与删除敏感性
      - 第 30 篇使用 eval false，并区分 assembler、single/co strategy、read budget、contiguity、read recruitment、资源与 reference-aware correctness
      - 第 31 篇使用 eval false，并区分 HMW/basecalling、历史 R9/HiFi error model、四分支 contiguity、read-back、junction、methylation provenance、资源与 reference-aware correctness
      - 第 32 篇使用 eval false，并区分 short-read-first hybrid、long-read-first polishing、逐 reference recovery、consensus error、丰度分层与资源合同
      - 第 33 篇使用 eval false，并区分 FASTA validity、contiguity、reference consistency、per-genome recovery、诊断正控与 task-specific usability
      - 第 34 篇使用 eval false，并区分 ORF call、protein clustering、cascaded membership、truth recovery、catalog support、阈值与软件敏感性
      - 第 35 篇使用 eval false，并区分 raw mapping、assigned reads、read/fragment unit、CPM/RPKM/TPM、annotation missingness 与一对多功能守恒
      - 第 36 篇使用 eval false，并区分 seed ortholog、字段级 missingness、四态功能暗物质、gene/read weighting、GO evidence policy 与多标签 fractional allocation
      - 第 37 篇使用 eval false，并区分 dbCAN 三工具证据、family/class、substrate prediction、CGC 正控与 fractional allocation
      - 第 38 篇使用 eval false，并区分 CARD Perfect/Strict/Loose、protein/contig model、正控、read weighting 与耐药表型边界
      - 第 39 篇使用 eval false，并区分 VFDB core/full、identity/coverage、阈值/数据库敏感性、VFC category 与致病表型边界
      - 第 40 篇使用 eval false，并区分 antiSMASH/GECCO、region overlap、fragmentation recovery、MIBiG similarity 与表达/化合物边界
      - 第 41 篇使用 eval false，并区分 primary-read mapping fate、完整坐标、breadth、JGI/Samtools 深度与跨样本一致性
      - 第 42 篇使用 eval false，并区分 single/multisample depth、五个分箱分支、独立 QC、truth-blind 选择与 post-hoc truth benchmark
      - 第 43 篇使用 eval false，并区分 source partitions、DAS Tool/Binette candidates、独立 QC、contig non-overlap 与 truth-blind final set
      - 第 44 篇使用 eval false，并区分 CheckM2、GUNC、CheckM1、marker-domain mode、完整 MIMAG、assembly graph 与独立 taxonomy 边界
    common_failures:
      - 新旧大纲编号混用
      - 样板标题与 manifest 不一致
      - 正式文章仍标记 draft true
    outputs:
      - results/scaffold_validation.json
    method_basis:
      type: project-experience
      summary: 静态契约检查是执行 QA 前的最低门槛。
    references:
      - title: Best practices for analysing microbiomes
        type: method-paper
        url: https://doi.org/10.1038/s41579-018-0029-9
    assertions:
      - id: scaffold-validation-passed
        type: text_match
        path: results/scaffold_validation.json
        pattern: '"status": "passed"'
