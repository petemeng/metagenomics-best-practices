      - figures/15-sgb-marker-support.png
      - figures/15-sgb-marker-support.tiff
      - figures/15-detection-quantification-sensitivity.pdf
      - figures/15-detection-quantification-sensitivity.png
      - figures/15-detection-quantification-sensitivity.tiff
    acceptance_checks:
      - 实际入口报告 MetaPhlAn 4.2.5 与 Bowtie2 2.5.5，且 env/biobakery-linux-64.lock 中包含同一精确 package build
      - source manifest 固定 PRJEB52977、SAMEA14435832、ERR9765746、完整 ENA MD5/字节数、前 100,000 个原始 pairs 与 fastp 保留的 99,991 个 clean pairs
      - clean R1/R2 的 compressed/uncompressed SHA-256、record 数、总 bases、normalized paired-ID hash 与第 13 篇固化账本完全一致
      - 数据库固定 mpa_vJan26_CHOCOPhlAnSGB_202605 而非 latest；官方 tar 恰为 6,014,095,360 bytes 且 MD5 为 7162b0c3493663dce9abef08ccc06aea
      - data/small/15-database-manifest.tsv 可由 db/download_db.sh audit 直接验收，并分别以 marker_metadata 与 bowtie2_index 作为受控下载 ID
      - 解包后的 Bowtie2 index、PKL 与辅助文件逐个记录字节数和 SHA-256，并在 --offline 模式通过完整性检查
      - vJan26 PKL 恰含 72,000 个 SGB taxonomy entries（27,891 known、44,109 unknown）与 13,907,686 个 marker records，不沿用 2023 论文旧 catalog 计数
      - 主映射命令显式传入 --db_dir、--index、--offline、--mapout、--nproc 和同一 clean R1/R2；MetaPhlAn 映射时将 mates 当作独立 reads，输入配对守恒由上游账本验收
      - 主 profile 使用 rel_ab_w_read_stats，明确区分 199,982 条输入 reads 与 --read_min_len 70 后实际进入 profiling 的 199,929 条 reads（R1 22 条、R2 31 条过短），并保留 estimated read count、marker-derived coverage 与每个分类层级的 relative abundance
      - 默认 profile 保留 UNCLASSIFIED 且同一 rank 总和为 100%；--skip_unclassified_estimation profile 仅在已报告 clades 内重归一，两者不混合合并
      - species 与 SGB 输出均至少含 1 个阳性 clade；known SGB 与 unknown SGB 依数据库 species label 是否为 *_SGB* 分类，不把 uSGB 强行命名为已知物种
      - marker support 对每个检出 SGB 核对数据库 marker 总数、非零 marker 数、support fraction、coverage 和 abundance，并保留默认 perc_nonzero=0.33 边界
      - vJan26 mapout 中不属于 PKL 有效 SGB marker dictionary 的 VDB viral markers 与 metadata-excluded SGB-formatted markers 分别记账，均不混入 SGB breadth；不在本篇把 VDB raw hits 升级成病毒检出结论，除此之外不得有无法解释的 marker name
      - 0%、0.01%、0.1% 与 1% post-profile 阈值只生成检出数/丰度保留敏感性表，不改写原始 profile 或宣称通用检出限
      - 20,000 与 50,000-pair 随机下采样分支固定 subsampling seed 20260721；99,991-pair 分支使用全部 clean pairs、没有随机抽样，三者单独比较检出数、丰度与 marker support，不将该 prefix 结果外推为完整 ENA run 性能
      - FASTQ、6 GB 数据库 tar、解包索引与 mapout 保留在 ignored scratch/database 目录；Git 仅固化可发布 profile、聚合小表、路径归一化日志和 checksum manifest
      - 常规 QA 只读取 checksum-locked frozen evidence，不访问 ENA 或 MetaPhlAn 数据库服务器，也不需要本地 6 GB 数据库 tar
      - 三张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 使用 -x latest 或只写 MetaPhlAn4，不记录精确数据库 release/checksum
      - 把 MetaPhlAn 3/cMD3 profile 冒充本篇 MetaPhlAn 4.2.5 实际输出
      - 把 99,991 pairs 写成 99,991 reads，忽略 read_min_len 排除的 53 条 reads，或从 mapout 重算时遗失 total-read 分母
      - 把 UNCLASSIFIED 当作一个物种，或在已报告 clades 内重归一后还声称数值是全 metagenome 比例
      - 把 uSGB 解释为全新生物学物种，忽略它是数据库和命名发布下的 genome-bin 类群
      - 只看 relative abundance，不审计 marker support、coverage、read depth 和低丰度阈值敏感性
      - 为了「去假阳性」在 MetaPhlAn 前后任意删除低丰度 taxa，但没有对照 blank、mock、深度或 marker 证据
      - 把 species/SGB 检出误写成 strain transmission；菌株问题应保留给 StrainPhlAn 或第 50–53 篇
