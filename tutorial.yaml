        key: human_input_pairs
        comparator: "=="
        value: 20000
      - id: host-removal-mock-input-pairs
        type: metric_threshold
        path: results/14-host-removal-complexity-duplicates/validation-summary.json
        key: mock_input_pairs
        comparator: "=="
        value: 20000
      - id: host-removal-human-removal
        type: metric_threshold
        path: results/14-host-removal-complexity-duplicates/validation-summary.json
        key: human_removed_fraction
        comparator: ">="
        value: 0.99
      - id: host-removal-microbial-retention
        type: metric_threshold
        path: results/14-host-removal-complexity-duplicates/validation-summary.json
        key: mock_retained_fraction
        comparator: ">="
        value: 0.99
      - id: host-removal-paired-policy
        type: text_match
