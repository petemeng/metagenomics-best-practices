    - 第 30 篇固定 PRJEB52977 的 ERR9765746/ERR9765747、每个 run 精确 2,000,000 个同步 pairs、seed 20260730、fastp 后 1,999,853/1,999,888 pairs，以及六套 ≥1 kb 确定性 gzip contigs
    - 第 30 篇固定 MEGAHIT 1.2.9、metaSPAdes/SPAdes 4.3.0、Bowtie2 2.5.5、16 threads、64 GiB 声明上限和统一 500/1,000/10,000 bp 报告阈值；常规 QA 只审计 66 个冻结 payloads 并重画四张图
    - 第 31 篇固定 PRJEB52977/SAMEA14435832 的完整 ERR9765780 与 ERR9765783、seed 20260731、四套 ≥1 kb 确定性 gzip contigs、四次 platform-matched minimap2 -c read-back 和 5 kb + 5 kb circular-junction targets
    - 第 31 篇固定 Flye 2.9.6、hifiasm-meta 0.3.5-r81、metaMDBG 1.4、minimap2 2.31、32 threads 与统一 0/1 kb/10 kb/100 kb/1 Mb 报告阈值；常规 QA 审计 68 个冻结 payloads 并重画四张图
    - 第 32 篇固定 PRJEB52977/SAMEA14435832 的 ERR9765746/ERR9765780/ERR9765783、精确 10,000,000 对短读抽样、seed 20260732、七套 ≥1 kb assemblies 与 71-genome truth
    - 第 32 篇固定 SPAdes 4.3.0、BWA 0.7.19、Polypolish 0.6.1、MetaQUAST 5.3.0 与 bundled minimap2 2.28-r1209；常规 QA 审计 checksum-locked 证据并重画四张图
    - 第 33 篇固定第 30–32 篇 15 套非重复 biological assemblies、MOCK1 71 genomes、MOCK2/union 87 genomes、统一 ≥1 kb threshold 与 seed namespace 20260733
    - 第 33 篇固定 QUAST/MetaQUAST 5.3.0、min-alignment 500、min-identity 97、fragmented/split-scaffolds 合同；常规 QA 审计 45 个冻结 payloads、1,271 行逐基因组结果并重画四张图
    - 第 34 篇固定第 30 篇六套 >=1 kb assemblies、87 个 exact MOCK2 genomes、Prodigal 2.6.3、MMseqs2 9.d36de、CD-HIT 4.8.1、seed namespace 20260734 与两阶段 expanded membership；常规 QA 审计 44 个 checksum payloads 并重画四张图
    - 第 35 篇固定第 30 篇 MOCK1/MOCK2 clean reads、第 34 篇 93,782-gene catalog、Bowtie2 2.5.5、SAMtools 1.23.1、HTSeq 2.1.2、seqtk 1.5、DIAMOND 2.2.4、UniRef90 v201901b、HUMAnN 3.9 reaction mapping 与 seed namespace 20260735
    - 第 36 篇固定第 34 篇 93,782-protein catalog、第 35 篇 2,784,234/2,777,443 条 assigned-read ledger、eggNOG-mapper 2.1.15、eggNOG 5.0.2、DIAMOND 2.0.15、non-electronic 主 GO policy、all-evidence sensitivity 与 seed namespace 20260736
    - 第 37 篇固定同一 catalog/read ledger、dbCAN 5.2.9、database db_v5-2-9_5-5-2026、两工具主门槛、B. thetaiotaomicron VPI-5482 正控与 seed namespace 20260737
    - 第 38 篇固定同一 catalog/read ledger、RGI 6.0.8、CARD 4.0.1、DIAMOND 2.2.4、Perfect/Strict 主集合、Loose sensitivity、双阳性对照与 seed namespace 20260738
    - 第 39 篇固定同一 catalog/read ledger、ABRicate 1.4.0、BLAST+ 2.17.0、VFDB core/full 2026-07-24、90/80 主门槛、80/80 sensitivity 与 seed namespace 20260739
    - 第 40 篇固定 antiSMASH 8.0.4、GECCO 0.10.3、Prodigal 2.6.3、PFAM 35.0、MIBiG 4.0、MITE 1.3、25% reciprocal overlap、20 kb fragments 与 seed namespace 20260740
    - 第 41 篇固定第 30 篇 co-assembly 与两套 clean reads、Bowtie2 2.5.5、SAMtools 1.23.1、MetaBAT2 jgi_summarize_bam_contig_depths 2.18、完整 18,354-contig 坐标和 seed namespace 20260741
    - 第 42 篇固定第 41 篇深度矩阵与 10,203-contig 可分箱坐标、MetaBAT2/SemiBin2/VAMB/TaxVAMB/MaxBin2 五分支、同一 CheckM2/GUNC 门控、truth-only-posthoc 合同与 seed namespace 20260742
    - 第 43 篇固定第 42 篇 171 个 source bins、DAS Tool 与 Binette 的五分区输入、候选 bin 独立 CheckM2/GUNC 重检、非重叠选择合同与 seed namespace 20260743
    - 第 44 篇固定第 43 篇 23 个 selected MAG、CheckM2 1.1.0 + Zenodo database v3、GUNC 1.1.0 + ProGenomes2.1、CheckM 1.2.5 + reference data 2015-01-16、release-matched domain hierarchy、Barrnap/tRNAscan-SE marker 审计、FASTG exact-sequence SHA-256 node mapping 与 seed namespace 20260744
    - 已验证下游文章固定 R 4.4.1、Quarto 1.9.38 和 env/renv.lock
    - 所有随机过程显式固定 seed
  provenance:
    - QA 报告记录下载校验、工具版本、命令、日志、输出和断言
    - 每篇记录研究、accession、profile 工具、数据库 release、单位与归一化
    - 上游重型章节额外记录峰值内存、CPU/wall time、参数和关键文件 checksum
