      - figures/31-circular-resource-audit.tiff
    acceptance_checks:
      - 两个完整 ENA archives 必须分别核对 bytes、MD5、SHA-256、696944/524805 reads 与 3125920499/5400038744 bases
      - 四个 assembly branches 必须在 0、1 kb、10 kb、100 kb 与 1 Mb 五个共同门槛重算，并由四套确定性 gzip contigs 复核
      - ONT 必须使用历史 R9 对应的 Flye nano-raw；HiFi 必须完成 Flye、hifiasm-meta 与 metaMDBG 三分支
      - 四次 read-back 必须先使用同一 ≥1 kb contig 门槛，reference bytes/SHA-256 必须匹配冻结 assembly，再使用平台匹配的 minimap2 -c preset；每条 accepted PAF 必须含 CIGAR/NM，精确 identity 由 matching bases/alignment blocks 计算，并保持 query-union aligned bases 不超过原始 base denominator
      - 软件 circular candidates 必须与 contig inventory 一一连接；junction 支持阈值必须固定且不得改写成完整基因组
      - assembly、mapping 与所有存在 eligible candidate 的 junction steps 必须有成功资源记录
      - 四张图必须使用英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF
      - 验证 failed 必须为 0；结果不得写成平台单因素、普适赢家或 reference-aware correctness
    common_failures:
      - 把历史 R9 reads 交给当前 R10 high-quality preset，或把旧 R9 identity 写成当前 ONT 性能
      - 按相同 read 数声称平台公平，却没有控制 total bases、read length、library process 与 error model
      - 只比较 N50/最大 contig，未检查 read-back alarms、graph、junction 与资源
