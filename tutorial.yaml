  - id: validate-nonredundant-gene-catalog
    title: 验证第 34 篇 Prodigal、MMseqs2/CD-HIT 与 exact-truth 基因目录合同
    goal: >
      从第 30 篇六套 checksum-identified short-read assemblies 建立 individual、
      co-assembly 与 cascaded mix 蛋白目录，并用 87 个 exact genomes 的 callable
      ORFs 分开审计 truth recovery、catalog support、阈值和软件敏感性。
    rationale: >
      非冗余目录的 feature universe 由 caller、sequence level、identity、coverage
      方向、greedy representative 与聚类顺序共同定义。只有保留两阶段 membership、
      FASTA checksum 和 denominator-aware truth audit，才能防止把目录大小误写成
      gene richness，或把近似 cluster 数误当成可替换 feature IDs。
    inputs:
      - env/gene-catalog.yml
      - env/gene-catalog-linux-64.lock
      - data/small/30-short-read-assembly-frozen
      - data/small/34-nonredundant-gene-catalog-frozen
      - chapters/34-nonredundant-gene-catalog.qmd
      - scripts/download_article34_gene_catalog_sources.sh
      - scripts/prepare_article34_gene_catalog_inputs.py
      - scripts/run_article34_gene_catalog.py
      - scripts/summarize_article34_gene_catalog.py
      - scripts/freeze_article34_gene_catalog.py
      - scripts/validate_article34_gene_catalog.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/34-nonredundant-gene-catalog" \
        "${RUN_ROOT}/figures" \
        "${RUN_ROOT}/.cache/article34-matplotlib"
      MPLCONFIGDIR="${RUN_ROOT}/.cache/article34-matplotlib" \
      PYTHONNOUSERSITE=1 \
      PYTHONPATH= \
      python3 "${MANIFEST_DIR}/scripts/validate_article34_gene_catalog.py" \
        --project-root "${MANIFEST_DIR}" \
        --frozen-dir "${MANIFEST_DIR}/data/small/34-nonredundant-gene-catalog-frozen" \
        --output-dir "${RUN_ROOT}/results/34-nonredundant-gene-catalog" \
        --figure-dir "${RUN_ROOT}/figures" \
        --chapter "${MANIFEST_DIR}/chapters/34-nonredundant-gene-catalog.qmd"
    expected_outputs:
      - results/34-nonredundant-gene-catalog/checksum-audit.tsv
      - results/34-nonredundant-gene-catalog/source-audit.tsv
      - results/34-nonredundant-gene-catalog/catalog-audit.tsv
      - results/34-nonredundant-gene-catalog/truth-audit.tsv
      - results/34-nonredundant-gene-catalog/chapter-audit.tsv
      - results/34-nonredundant-gene-catalog/image-audit.tsv
      - results/34-nonredundant-gene-catalog/validation-checks.tsv
      - results/34-nonredundant-gene-catalog/validation-summary.json
      - results/34-nonredundant-gene-catalog/validation.log
      - figures/34-gene-catalog-workflow.pdf
      - figures/34-gene-catalog-workflow.png
      - figures/34-gene-catalog-workflow.tiff
      - figures/34-gene-length-distributions.pdf
      - figures/34-gene-length-distributions.png
      - figures/34-gene-length-distributions.tiff
      - figures/34-strategy-truth-audit.pdf
      - figures/34-strategy-truth-audit.png
      - figures/34-strategy-truth-audit.tiff
      - figures/34-threshold-method-sensitivity.pdf
      - figures/34-threshold-method-sensitivity.png
      - figures/34-threshold-method-sensitivity.tiff
    acceptance_checks:
      - 六套输入 assemblies 必须逐个匹配第 30 篇 frozen bundle 的 compressed SHA-256，并合计 96,275 contigs 与 398,103,372 bp
      - MOCK1 71 genomes 必须是 MOCK2 87 genomes 的严格子集；87 个 references 必须合计 292,802,018 bp
      - Prodigal 2.6.3 必须使用 -p meta，六套 assemblies 必须产生 441,407 ORFs，87 个 exact genomes 必须产生 270,679 callable ORFs
      - primary MMseqs2 必须固定 9.d36de、95% amino-acid identity、95% target/member coverage、coverage mode 1、cluster mode 2 与 alignment mode 3
      - Mix 必须先聚类 individual pool，再将其 representatives 与 co genes 聚类；expanded membership 必须覆盖 216,191 个 MEGAHIT raw ORFs
      - MEGAHIT primary mix 必须包含 93,782 个 paired FAA/FNA representatives，metadata 与 membership cluster-size ledger 必须守恒
      - 270,679 truth ORFs 必须按同一规则压缩为 260,868 clusters；recovery 使用 truth/target coverage，support 使用 catalog/query coverage
      - 90/80、99/95 与 CD-HIT local 95/95 必须在同一 expanded raw universe 比较，不得仅凭相近 cluster 数声称 feature IDs 等价
      - 193 个 recorded steps 必须全部 exit 0，并保留 wall time、peak RSS、命令和 selected logs
      - 四张图必须只含英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF
      - 验证 failed 必须为 0；不得把 catalog size 写成 gene richness、声明 mix 普适最优或把自然样本无 exact hit 直接定义为 false positive
    common_failures:
      - 只写 95% identity，不写 member coverage、coverage direction、alignment mode 与工具版本
      - 把 greedy input representative 误称为 consensus sequence
      - 把 raw individual 与 co proteins 一次聚类，冒充论文的 cascaded mix strategy
      - 丢弃第一阶段 membership，导致 mix 无法展开到原始 ORF universe
      - 只发布 FAA，不发布 paired FNA、coordinates/metadata、membership 与 checksums
      - 把 Prodigal partial=00 当成功能正确、无 frameshift 或 assembly correctness
      - 把 technical mock 的 recovery/support 外推成自然群落 precision 或策略因果排名
    outputs:
      - results/34-nonredundant-gene-catalog/checksum-audit.tsv
      - results/34-nonredundant-gene-catalog/source-audit.tsv
      - results/34-nonredundant-gene-catalog/catalog-audit.tsv
      - results/34-nonredundant-gene-catalog/truth-audit.tsv
      - results/34-nonredundant-gene-catalog/chapter-audit.tsv
      - results/34-nonredundant-gene-catalog/image-audit.tsv
      - results/34-nonredundant-gene-catalog/validation-checks.tsv
      - results/34-nonredundant-gene-catalog/validation-summary.json
      - results/34-nonredundant-gene-catalog/validation.log
      - figures/34-gene-catalog-workflow.pdf
      - figures/34-gene-catalog-workflow.png
      - figures/34-gene-catalog-workflow.tiff
      - figures/34-gene-length-distributions.pdf
      - figures/34-gene-length-distributions.png
      - figures/34-gene-length-distributions.tiff
      - figures/34-strategy-truth-audit.pdf
      - figures/34-strategy-truth-audit.png
      - figures/34-strategy-truth-audit.tiff
      - figures/34-threshold-method-sensitivity.pdf
      - figures/34-threshold-method-sensitivity.png
      - figures/34-threshold-method-sensitivity.tiff
    method_basis:
      type: external-benchmark
      summary: >
        忠实保留 Delgado 与 Andersson 的 Prodigal 2.6.3、MMseqs2 9.d36de
        两阶段 mix 目录定义，并在 Meslier 等 PRJEB52977 exact mock genomes 上
        增加双向 coverage truth audit、阈值与 CD-HIT 敏感性。
    references:
      - title: Evaluating metagenomic assembly approaches for biome-specific gene catalogues
        type: method-benchmark
        url: https://doi.org/10.1186/s40168-022-01259-2
      - title: Benchmarking second and third-generation sequencing platforms for microbial metagenomics
        type: data-resource
        url: https://doi.org/10.1038/s41597-022-01762-z
      - title: MMseqs2 enables sensitive protein sequence searching for the analysis of massive data sets
        type: method-paper
        url: https://doi.org/10.1038/nbt.3988
    assertions:
      - id: gene-catalog-validation-status
        type: text_match
        path: results/34-nonredundant-gene-catalog/validation-summary.json
        pattern: '"status": "passed"'
      - id: gene-catalog-assembly-genes
        type: metric_threshold
        path: results/34-nonredundant-gene-catalog/validation-summary.json
