    acceptance_checks:
      - 包快照必须为 22,588 个样本、93 个 studies、141 个 metadata fields；论文 22,710/94 的差额必须单列为 HeQ_2017 的 122 个样本
      - 资源目录必须含 732 个标题和 6 种 assay；去除日期后为 558 个 study-assay pairs，其中 174 个有两个 release
      - 必须识别 177 个跨 study 重复的 sample_id，并以 study_name::sample_id 作为全局键
      - 三个真实研究必须由 319 个可追溯 stool profiles 确定性选出 261 个 study-subject units，组别计数为 10/95/156
      - curatedMetagenomicData::mergeData 必须真实合并成 923 species × 261 samples 的 percent 表，并保留 3 个源对象的 feature 和列和审计
      - counts=TRUE 必须标为由 relative abundance 与 number_reads 重建的 pseudo-count，不得称为 observed taxon reads
      - 谱系卡必须为 5 行并含 13 个字段；MetaPhlAn3/CHOCOPhlAn 201901、HUMAnN3 和 MetaPhlAn4/vJan26 不得静默混并
