      - figures/22-sensitivity-recruitment.png
      - figures/22-sensitivity-recruitment.tiff
    acceptance_checks:
      - 所有 frozen input checksum 必须先通过；常规 QA 不读取 ExperimentHub、Figshare、原始 RDA、FASTQ、BAM、MAG FASTA 或网络
      - species 与 gene-family 必须保留相同 24 个 sample IDs 和 15 个 subject IDs；重复采样只在图中连接或在账本中标记，不当作独立生物重复做显著性检验
      - MAG 分支必须保留 500 个样本、56 个 hot springs 与 780 个 MAG feature IDs，并确认其数据谱系与 AsnicarF_2017 不同
      - species 输入保留 MetaPhlAn3 percentage scale 的原始 column sum，再在每个样本内 closure 后计算 diversity；不得把按 read depth 反推的伪 counts 当原始观测
      - gene-family 先去除 stratified rows 与 UNMAPPED/UNGROUPED，再按 sample prevalence 筛选；主分析固定 prevalence >=20%，同时报告 10% 与 50% 敏感性
      - MAG relative abundance 必须按提供方定义理解为 recovered-MAG catalog 内 coverage closure；平均约 13% read recruitment 必须单列，不能把闭合后的 100% 写成全群落覆盖
      - Hill q=0/1/2 分别输出 observed richness、exp(Shannon) 与 inverse Simpson；q=0 必须标为 detection/filter dependent，三个 feature spaces 的绝对值不得直接排名优劣
      - Bray-Curtis 使用非负 closed abundance，binary Jaccard 使用明确 presence/absence；Aitchison 只用于预过滤后的 species/gene-family 表并报告 pseudocount sensitivity
      - PCoA 只作描述性坐标；记录 raw negative eigenvalues 与 correction，不运行 PERMANOVA、betadisper、CAP、ANOSIM、MRPP 或组间 p-value
      - pairwise distance 向量的相关性只作 geometry sensitivity，不把非独立 sample pairs 当作独立重复计算显著性
      - MAG richness 与 recruitment 的关联只报告描述性 Spearman rho，不外推为生态因果或完整群落丰富度
      - 四张图全部使用英文可见文字，并同时导出 PDF、PNG 和 350 dpi LZW TIFF
    common_failures:
      - 把 percentage、RPK/CoPM-derived composition 或 MAG coverage proportion 当 raw counts 后直接 rarefy
      - 在 gene-family 表中同时保留 community 与 taxon-stratified rows，造成重复计量
      - 用跨全队列 prevalence filter 抹掉 hot-spring-specific MAG 后，把过滤造成的 richness 降低写成生物学差异
      - 把 q=0/q=1/q=2、Bray/Jaccard/Aitchison 当作可互换指标，只挑最显著或最好看的结果
      - 忽略 AsnicarF_2017 的重复 subject，或把 500 个温泉样本与 24 个人体 profiles 放进同一个组间检验
      - 把 MAG catalog 内闭合的 relative abundance 解释成 recovered MAGs 覆盖了全部 reads
      - 在第 22 篇提前做 PERMANOVA/CAP，却没有 permutation block、dispersion 与多重检验合同
    outputs:
      - results/22-alpha-beta-diversity/validation-summary.json
      - results/22-alpha-beta-diversity/data-lineage.tsv
