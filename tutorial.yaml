  - id: validate-humann3-functional-profiling
    title: 验证第 19 篇 HUMAnN3 gene family、pathway abundance 与 pathway coverage 合同
    goal: >
      复用 Meslier 71-strain MOCK1 经 fastp 保留的 99,991 个同步 read pairs，按
      HUMAnN 对 paired-end 输入的官方约定把 R1/R2 reads 串接为一个 FASTQ。使用
      HUMAnN 3.9 明确兼容的 MetaPhlAn 4 vJun23 profile 建立 ChocoPhlAn
      v201901_v31 样本特异 nucleotide index，再以 UniRef90 annotated v201901b
      完成 translated search，固化 gene-family RPK、pathway abundance、pathway
      coverage、CPM/relative-abundance 派生表以及 stratified/unstratified 证据；
      同时从 native gene-family RPK 真实执行 uniref90_rxn regroup 分支。
    rationale: >
      HUMAnN 的三个主要结果不是同一种数值：gene family 默认是 RPK，pathway
      abundance 是由 reaction abundance 和 pathway structure 推断的完整 pathway
      copy-like quantity，pathway coverage 则是 0–1 的 reaction-evidence score。
      gene-family community total 可由 strata 相加，而 pathway abundance 会分别在
      community 与各 taxon 内重新求解，通常不满足同一加和恒等式。只有同时锁定
      prescreen release、两套功能数据库、特殊行和每种单位，才能避免把
      UNMAPPED、UNGROUPED、UNINTEGRATED、coverage 与 abundance 混成一张不可
      解释的表；一对多 regroup 还必须作为独立 feature space 审计。
    inputs:
      - env/biobakery.yml
      - env/biobakery-linux-64.lock
      - env/relink-biobakery-entrypoints.sh
