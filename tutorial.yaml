  - id: validate-alpha-beta-diversity
    title: 验证第 22 篇 species、MAG 与 gene-family Alpha/Beta 多样性合同
    goal: >
      从两条明确分离的真实数据谱系计算 Hill q=0/1/2 与 beta distances：人体
      AsnicarF_2017 分支使用同一 24 个纵向 profiles 的 MetaPhlAn3 species 和
      HUMAnN3 gene-family 表，环境 MAG 分支使用 500 个美国西部温泉样本对 780 个
      MAG 的竞争性 read-recruitment abundance matrix。所有结果保留 feature universe、
      denominator、prevalence、zero、catalog recruitment 和 repeated-subject 边界。
    rationale: >
      Alpha/Beta 不是与输入表无关的按钮。species richness、MAG richness 和 gene-family
      richness 的 feature universe、检出机制及上限不同；Bray-Curtis、binary Jaccard 与
      Aitchison 又回答 abundance、presence/absence 和 log-ratio 几何中的不同问题。
      本篇只建立描述性度量与敏感性账本，把 PERMANOVA、CAP 和 dispersion inference
      留给第 23 篇。
    inputs:
      - env/renv.lock
      - data/small/12-cmd-asnicarf-2017-relative-abundance.rds
      - data/small/12-cmd-resource-manifest.tsv
      - data/small/22-diversity-inputs/species-relative-abundance.tsv.gz
