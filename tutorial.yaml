    acceptance_checks:
      - 三套输入都追溯到同一 ERR9765746 clean R1/R2、99,991 个同步 pairs 与相同压缩 FASTQ SHA-256；不把不同样本或不同 depth 混入主比较
      - MetaPhlAn 固定 4.2.5 / mpa_vJan26_CHOCOPhlAnSGB_202605；Kraken2 固定 2.17.1、Bracken package 3.1p1 与 2026-06-26 Standard 数据库；mOTUs 固定 4.1.0 / database 4.1，taxonomy 文件实际声明 GTDB R226
      - mOTUs database 固定 Zenodo record 20322482、5,552,983,255 bytes 与 MD5 471ea128f0c0839f5c4629b949ea5f8a，解包后逐文件记录 SHA-256、版本文件与 installed bytes
      - mOTUs 映射只运行一次，固定 75 bp 最短比对和 8 threads；同一 MGC table 分别计算 g=1、3、6，主分析使用默认 g=3 与 INSERT_SCALED
      - 原生输出审计分别保留 MetaPhlAn species/SGB relative abundance、Kraken paired-fragment 与 Bracken estimated-read denominator、mOTUs marker-gene insert scale及其 unassigned row，不把它们当成同一 read-classification rate
      - truth crosswalk 从 71 assemblies/69 current NCBI species 出发，逐工具标出 represented、split、merged、ambiguous 与 absent；名称模糊匹配不能单独构成 reference-present 证据
      - reference-aware recovery 使用各工具自己的可检出 truth denominator；三工具横向丰度只在共同 one-to-one species 域内闭合后比较，并同时报告 common-domain 覆盖的 truth species 数与 expected mass
      - native/default 结果与 harmonized evaluation 明确分表：harmonized 只改变映射、聚合、比较域和预先声明的 abundance threshold，不伪装成三个算法共享相同参数
      - 检出比较同时报告 recovered truth features、non-truth feature count 与 non-truth native mass；定量比较至少报告 Spearman rho 和 total-variation distance，不用单一相关系数宣布胜负
      - MetaPhlAn 的 estimated mapped reads、Kraken classified fragments 与 mOTUs aligned marker reads只按各自语义展示；任何 unclassified/unassigned 图均显式标注分母不可互换
      - 资源账本使用同一服务器上的一次性实跑，分别列 wall time、maximum RSS、threads 与 installed database bytes；缓存状态与 capped/full database 差异作为局限保留
      - FASTQ、MetaPhlAn/Kraken/mOTUs 大数据库、BAM 和 per-read mapping 均留在 ignored 工作区；Git 只固化小型 profile、crosswalk、聚合表、归一化日志和 checksum manifest
      - 常规 QA 不读取 FASTQ、大型数据库或网络，只读取 checksum-locked frozen evidence
      - 四张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 直接按 species name outer join 三个结果，忽略 NCBI 与 GTDB 更名、SGB/mOTU split/merge 及 unresolved labels
      - 用各工具全部数据库物种数作为同一个 recall 分母，或把数据库缺参考误算成分类器漏检
      - 把 MetaPhlAn relative abundance、Bracken read redistribution 与 mOTUs INSERT_SCALED 数值逐行直接相减
      - 把 marker-aligned reads、paired classified fragments 和 estimated mapped reads画成同一“分类率”柱状图
      - 只报告相关系数而不报告漏检、non-truth burden、共同评估域大小和 composition distance
      - 一边使用 Kraken 默认 confidence 0，一边在结论里引用 confidence 0.10，却不把 native/default 与 control-aware 分支标清
      - mOTUs g=1/3/6 重复映射三次，或没有记录 deterministic multimapper、最短比对长度和 counting mode
      - 把一个非人体工业 mock 的排名写成所有人体、环境、病毒或低生物量样本的通用工具优劣
