  - id: validate-platform-environment
    title: 验证第 09 篇 WSL2/Linux 与 conda/mamba 执行层合同
    goal: >
      在固定的 Linux x86_64 命名环境中审计 kernel、文件系统、conda/mamba
      policy、四个 direct package pins 和同一 MOCK1 的真实数据证据，同时把
      Windows WSL2 control plane 明确保留为当前原生 Linux 主机未执行。
    rationale: >
      Windows 安装说明、Linux 命令可用、环境版本正确和真实输入身份正确是四种
      不同证据。只有逐层验收并保存 NOT RUN 边界，才能避免把原生 Linux 运行
      误写成 Windows/WSL2 实测，或把 env directory 存在误当作流程可复现。
    inputs:
      - env/platform-smoke.yml
      - data/small/09-environment-contract.tsv
      - data/small/09-data-NOTICE.txt
      - data/small/08-ena-fastq-sources.tsv
      - data/small/08-prefix-source-summary.json
      - data/small/08-read-prefix-metrics.tsv
      - scripts/validate_article09_environment.py
    command: |
      set -eu
      mkdir -p "${RUN_ROOT}/results/09-wsl2-conda" "${RUN_ROOT}/figures"
      conda run -n metagenome-platform-smoke-2026.07 python \
        "${MANIFEST_DIR}/scripts/validate_article09_environment.py" \
        --project-root "${MANIFEST_DIR}" \
        --output-dir "${RUN_ROOT}/results/09-wsl2-conda" \
        --figure-dir "${RUN_ROOT}/figures"
    expected_outputs:
      - results/09-wsl2-conda/environment-audit.tsv
      - results/09-wsl2-conda/package-audit.tsv
      - results/09-wsl2-conda/data-smoke.tsv
      - results/09-wsl2-conda/environment-summary.json
      - results/09-wsl2-conda/environment-validation.log
      - results/09-wsl2-conda/explicit-linux-64.txt
      - figures/09-wsl2-layer-map.pdf
      - figures/09-wsl2-layer-map.png
      - figures/09-wsl2-layer-map.tiff
      - figures/09-environment-validation.pdf
      - figures/09-environment-validation.png
      - figures/09-environment-validation.tiff
    acceptance_checks:
      - 环境 YAML SHA-256 为 8f758b6ffdcf1561ece7d187ff34bc3f5a174fd8c6da66a101b206fcc869d20c
      - 原生 Linux host 明确报告 windows_control_plane_validated false 与 linux_execution_plane_validated true
      - conda/mamba 可调用，host channels 仅 conda-forge，channel priority strict，solver libmamba
      - Python 3.12.13、SeqKit 2.10.0、pigz 2.8、Matplotlib 3.10.5 的 package metadata 与命令入口一致
      - 生成 Linux-64 explicit spec；公开日志不包含 project/home path、proxy value 或完整 .condarc
      - PRJEB52977/SAMEA14435832 三个固化输入 hash、4 个 FASTQ sources 与 15,000 行 metrics 全部通过
      - 21 个环境检查 PASS、1 个 Windows control NOT RUN、0 个 FAIL；17 个数据检查 PASS
      - 两张英文图均生成 PDF、PNG 和 350 dpi LZW TIFF
    common_failures:
      - 在 PowerShell 与 Ubuntu Bash 之间混用命令
      - 在 WSL2 中把 I/O-heavy 项目放在 /mnt/c
      - 向 base 环境安装全部分析工具或混入 defaults channel
      - 只检查 env directory/which，不运行实际 entrypoint 与真实数据冒烟
      - 把 native-linux evidence 写成 Windows/WSL2 已执行
      - 公开完整 .condarc、proxy、token、username 或 host-specific path
      - 环境 YAML 更新后没有同步 hash、explicit spec、正文和 QA
    outputs:
      - results/09-wsl2-conda/environment-audit.tsv
      - results/09-wsl2-conda/package-audit.tsv
