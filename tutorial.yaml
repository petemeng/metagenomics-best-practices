  - id: prepare-network-data
    title: 固化第 29 篇 spring-level MAG 网络输入与分析合同
    goal: >
      从第 23 篇 checksum-locked 温泉输入冻结 56 个 spring-level 分析单位、
      780 个 MAG 的闭合相对丰度表与环境元数据，并预声明 prevalence/mean-abundance
      筛选、CLR 零值处理、协变量残差化、StARS、bootstrap、Zi-Pi、零模型和删除实验。
    rationale: >
      网络边对分析单位、稀疏筛选、零值替换和环境混杂极其敏感。先冻结数据谱系与
      全部分支，才能避免看到网络后再改阈值，也能阻止把 500 次样本采集误当成
      500 个独立生态系统。
    inputs:
      - data/small/23-ordination-permanova/spring-mag-relative-abundance.tsv.gz
      - data/small/23-ordination-permanova/spring-metadata.tsv
      - scripts/prepare_article29_network_data.R
    command: |
      set -eu
      mkdir -p "${RUN_ROOT}/data/small/29-network"
      R_LIBS_USER="${MANIFEST_DIR}/.r-lib:${HOME}/R/library" \
      Rscript "${MANIFEST_DIR}/scripts/prepare_article29_network_data.R" \
        --source-dir "${MANIFEST_DIR}/data/small/23-ordination-permanova" \
        --output-dir "${RUN_ROOT}/data/small/29-network" \
        --notice "${RUN_ROOT}/data/small/29-data-NOTICE.txt"
    expected_outputs:
      - data/small/29-network/analysis-contract.tsv
      - data/small/29-network/feature-filter-audit.tsv
      - data/small/29-network/file-checksums.sha256
      - data/small/29-network/resource-manifest.tsv
      - data/small/29-network/spring-mag-relative-abundance.tsv.gz
      - data/small/29-network/spring-metadata.tsv
      - data/small/29-data-NOTICE.txt
    acceptance_checks:
      - 必须保留 56 个独立 spring-level 单位、780 个 MAG、6 个 BroadRegion，且每个 spring composition 闭合为 1
      - relaxed、primary、strict 三个预声明筛选必须分别保留 183、93、63 个 MAG
      - 主分支必须固定 pseudocount 1e-6、BroadRegion + standardized temperature + pH 残差化、30 点 lambda 路径、StARS 0.05 与 seed 20260729
      - checksum manifest 必须完整覆盖 5 个 Git 内 payloads；来源表必须与第 23 篇 SHA-256 完全一致
    common_failures:
      - 把同一温泉内的 500 次采样当作独立重复
      - 看见网络后再调整 prevalence、abundance、StARS 或候选节点阈值
      - 仅复制一张边表，丢失元数据、筛选账本和来源 checksum
    outputs:
      - data/small/29-network/analysis-contract.tsv
      - data/small/29-network/feature-filter-audit.tsv
      - data/small/29-network/file-checksums.sha256
      - data/small/29-network/resource-manifest.tsv
      - data/small/29-network/spring-mag-relative-abundance.tsv.gz
      - data/small/29-network/spring-metadata.tsv
      - data/small/29-data-NOTICE.txt
    method_basis:
      type: external-benchmark
      summary: >
        数据沿用 Korchagina 等公开的美国西部温泉 780-MAG catalog；分析单位沿用
        第 23 篇的 spring-level 等权聚合，网络方法以 compositional graphical model
        和稳定性选择为基础。
    references:
      - title: Metagenome-assembled genomes from geothermal springs in the US Great Basin
        type: data-resource
        url: https://doi.org/10.6084/m9.figshare.30284068.v2
      - title: Sparse and Compositionally Robust Inference of Microbial Ecological Networks
        type: method-paper
        url: https://doi.org/10.1371/journal.pcbi.1004226
    assertions:
