    title: 固化第 26 篇 curatedMetagenomicData 资源目录、样本目录与数据谱系卡
    goal: >
      从 curatedMetagenomicData 3.12.0 的包内资源目录与 sampleMetadata 出发，
      锁定 HMP_2012、ZellerG_2014、AsnicarF_2017 的具体 release，建立跨 study
      唯一样本键、确定性 study-subject 代表样本、真实 mergeData 合并谱、
      counts=TRUE 边界和 dataset × assay × release 数据谱系卡。
