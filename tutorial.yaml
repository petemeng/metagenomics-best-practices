    acceptance_checks:
      - 第 13、15、16、19、20 与 21 篇输入 checksum manifests 必须先通过；常规 QA 不读取 FASTQ、数据库或网络
      - data dictionary 每行必须给出 source table、column、measurement object、feature space、native unit、length correction、denominator、closure target、zero meaning 和 allowed downstream use
      - Kraken direct/clade assignments、Bracken estimated paired fragments 与 fraction_total_reads 必须分开；new_est_reads 应逐行等于 kraken_assigned_reads + added_reads
      - MetaPhlAn relative_abundance 只在一个声明 taxonomic rank 内闭合；estimated_number_of_reads_from_the_clade 是 marker/genome-size model estimate，不得冒充 read-level assignment，负 UNCLASSIFIED correction 必须保留
      - HUMAnN native RPK 只做 feature-length correction；CoPM 明确展开为 copies per million，是 RPK 的 TSS analog，与 relative abundance 仅差 1e6 比例，不解释为 raw counts、absolute copies 或 reads
      - pathway coverage 必须保持 0–1，既不闭合也不做 CPM/CoPM；同名 pathway 的 abundance zero 与 coverage zero 分四种观测状态审计，zero 只写成 pipeline-level non-detection
      - gene-family strata 必须保持 community/additive 语义；pathway strata 与 community abundance 继续按非加和 reconstruction 报告，不得用强制求和掩盖差异
      - MicrobeCensus source 固定 Git tag v1.1.1 / commit dfc42d356bfd7943633cde6c0fbfc0b116f29ae2，同时保留程序内部 1.1.0 version string；兼容 shim 只处理 Python 3 subprocess bytes
      - MicrobeCensus 主/敏感性分支读取同一 199,982 个 clean reads，nreads 设为 100,000,000 以避免顺序截断，read length 固定 150/100 bp，禁用额外 quality、unknown-base 与 duplicate filters
      - 两个 MicrobeCensus 分支的 total_bases 必须等于 29,809,773；genome equivalents 必须逐分支精确等于 total_bases/average_genome_size
      - RPKG 只从同一 MOCK1 HUMAnN native RPK 除以 primary genome equivalents 得到；不得从 CoPM 或 relative abundance 反推 raw counts
      - genome equivalents 表示本次测序捕获的 microbial genome coverage，不等同 cells、organisms、biomass、copies per gram 或绝对浓度；低于工具建议 2M reads 的精度边界必须显式保留
      - curatedMetagenomicData 分支必须保留 11,173 rows、24 profiles 与 15 subjects；不做疾病、母婴或其他生物组间显著性检验
      - 四张图全部使用英文可见文字，并同时导出 PDF、PNG 和 350 dpi LZW TIFF
    common_failures:
      - 看到整数列就送入 count model，而未区分 observed fragments、redistributed estimates 与 model-derived read equivalents
      - 把 MetaPhlAn 各分类等级一起求和，得到约 800% 后误判 closure 失败
      - 把 HUMAnN CPM 展开成 counts per million，或用 feature count 替代 gene-length corrected RPK
      - 把 coverage 的列和当作样本功能总量，或把 coverage zero 写成 pathway 生物学不存在
      - 把 genome equivalents 当细胞数，忽略平均基因组大小估计、微生物分数、read length 与同一输入序列宇宙
      - 用不同 QC/去宿主/抽样版本的 FASTQ 估计 AGS，再拿来除另一个文库的 gene abundance
      - 强制 pathway strata 加回 community abundance，掩盖 HUMAnN pathway reconstruction 的非加和语义
      - 把 24 个 longitudinal profiles 当 24 名独立受试者进行组间检验
