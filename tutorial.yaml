  - id: validate-hybrid-assembly-polishing
    title: 验证第 32 篇七分支混合组装、短读抛光与 truth-aware 评价合同
    goal: >
      对同一 71-strain MOCK1 DNA 的精确一千万 Illumina read pairs、完整历史
      ONT R9 与 PacBio HiFi archives，验收 short-read-only、两个 short-read-first
      hybrid、两个 long-read-only 及两个 Polypolish sensitivity branches，并以
      71 个独立 references 统一评价 recovery、consensus error、丰度分层与资源。
    rationale: >
      hybrid assembly 与 post-assembly polishing 是不同算法方向，N50 或总体
      genome fraction 也不能替代逐 reference 回收和 mismatch/indel 审计。只有
      冻结输入身份、truth membership、七套 contigs、MetaQUAST reports、抛光合同
      与资源记录，才能把结论限制在本 mock、版本和参数范围。
    inputs:
      - env/hybrid-assembly.yml
