      - figures/28-lodo-roc.tiff
      - figures/28-validation-stability.pdf
      - figures/28-validation-stability.png
      - figures/28-validation-stability.tiff
    acceptance_checks:
      - 发现层必须只用 FR/AT/CN/US/DE 五个队列，IT-A/IT-B/JP 只能用于预声明方向验证；不得把显著 taxa 反馈给 LODO feature gate
      - 8 个 outer models 必须各训练 7 个完整队列并只测试第 8 个；41 个 lambda 的选择必须在 leave-one-training-cohort-out 内完成
      - feature prevalence、abundance、cohort support、log transform、标准化与 cohort/class weights 必须只在当前训练集合拟合
      - 每个外测队列必须报告 AUROC/DeLong CI、AUPRC、Brier、sensitivity 和 specificity；AUROC 汇总必须报告 REML、tau-squared 与 I-squared
      - macro AUROC 区间必须来自 2,000 次 cohort/class hierarchical bootstrap，不得把 771 名受试者当成一个无队列结构的简单样本
      - 8×8 单研究迁移矩阵只能作为作者问题的 secondary analysis；主结论以 N−1 LODO 为准
      - 五张重绘图必须使用英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF；论文原图版权边界必须显式保留
      - 验证总数必须为 112、failed 必须为 0；checksum manifest 必须为 6 项，生成图文件必须为 15 个
    common_failures:
      - 把 pooled random subject CV 或单队列训练矩阵称为真正 N−1 外部验证
      - 在 outer test cohort 上共同执行 ComBat、percentile normalization、feature selection 或 cutoff tuning
      - 只报告 pooled AUROC，不显示 IT-A 等失败队列与 I-squared 异质性
      - 把 LASSO coefficient、稳定入模频率或 association effect 写成因果机制
    outputs:
