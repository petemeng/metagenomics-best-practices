      - 全部主指标必须使用 >=1 kb contigs；MetaQUAST 必须固定 min-alignment 500、min-identity 97、fragmented 与 split-scaffolds
      - fragmentation control 必须保持 total bases 与 per-genome recovery，同时把 N50 降至约 50 kb
      - block-rotation control 必须保持 total bases、完整 contig-length multiset、N50 与 L50，同时提高 misassemblies 并降低 NA50
      - 两个诊断正控必须从 biological workflow correlation 和排名中排除，不得解释为新的样本或算法
      - 四次评价必须全部 exit 0 并记录 wall time/peak RSS；日常 QA 不重跑 MetaQUAST、不读取 FASTQ、不需要网络
      - 四张图必须只含英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF
      - 验证 failed 必须为 0；结果不得把 N50 当 correctness，不得声明普适 threshold 或把正控当 biological result
    common_failures:
      - 不统一 min-contig threshold 就横比 N50、total length 和 GC
      - 只看 combined report，未补齐完全未命中的 reference × branch 为显式零 recovery
      - 把近缘 reference 的 structural difference 全部命名为 assembler error
      - 把 >=90% 或 >=99% genome fraction 直接写成完整、闭环或无错基因组
      - 把输入预算、平台和组装器同时变化的 workflow set 写成单因素 benchmark
      - 用加权总分掩盖 recovery、misassembly、mismatch 与 indel 的不同量纲
