    method_basis:
      type: external-benchmark
      summary: >
        复现 Wirbel 2019 的跨队列 association 与 study-to-study transfer 问题，
        并按当前防泄漏规范把 primary validation 升级为 8 轮 N−1 LODO、训练队列
