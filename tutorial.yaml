  - id: validate-ordination-permanova-dispersion
    title: 验证第 23 篇 PCoA/CAP、PERMANOVA 与 multivariate dispersion 合同
    goal: >
      从同一个 checksum-locked 温泉 MAG abundance 数据集出发，将 500 个
      局部取样等权聚合为 56 个 hot-spring 推断单位，以 Bray-Curtis
      PCoA 展示非约束几何，以 partial CAP/dbRDA 展示在 broad region 条件下
      由 temperature regime 与 pH 约束的部分，再以 region-restricted PERMANOVA
      与 PERMDISP 分开审计 centroid location 和 within-group dispersion。
    rationale: >
      该研究为了捕获每个温泉的局部多样性，各 spring 样本数从 1 到 33
      不等，且取样不是随机概率抽样。直接把 500 个样本当独立重复会使样本多的
      spring 获得更大权重，并造成伪重复。先锁定 spring-level 单位、模型顺序、
      marginal 主检验、region 内置换、离散度检验与两两对比的可估性，可以
      防止在观察结果后挑选 distance、formula 或 p-value。
    inputs:
      - env/renv.lock
      - data/small/22-diversity-inputs/mag-relative-abundance.tsv.gz
      - data/small/22-diversity-inputs/hot-spring-sample-metadata.tsv
      - data/small/22-diversity-inputs/mag-recruitment.tsv
      - data/small/22-diversity-inputs/resource-manifest.tsv
      - data/small/22-diversity-inputs/file-checksums.sha256
      - data/small/23-ordination-permanova/spring-mag-relative-abundance.tsv.gz
      - data/small/23-ordination-permanova/spring-mag-recruitment-weighted.tsv.gz
      - data/small/23-ordination-permanova/spring-metadata.tsv
      - data/small/23-ordination-permanova/sample-to-spring-ledger.tsv
      - data/small/23-ordination-permanova/analysis-contract.tsv
      - data/small/23-ordination-permanova/temperature-regime-contract.tsv
      - data/small/23-ordination-permanova/resource-manifest.tsv
      - data/small/23-ordination-permanova/file-checksums.sha256
      - data/small/23-data-NOTICE.txt
      - scripts/prepare_article23_ordination_data.R
      - scripts/validate_article23_ordination_permanova.R
      - figures/23-korchagina-fig1-original.png
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/23-ordination-permanova" \
        "${RUN_ROOT}/figures"
      Rscript \
        "${MANIFEST_DIR}/scripts/validate_article23_ordination_permanova.R" \
        --project-root "${MANIFEST_DIR}" \
        --input-dir "${MANIFEST_DIR}/data/small/23-ordination-permanova" \
        --output-dir "${RUN_ROOT}/results/23-ordination-permanova" \
        --figure-dir "${RUN_ROOT}/figures"
    expected_outputs:
      - results/23-ordination-permanova/validation-summary.json
      - results/23-ordination-permanova/data-lineage.tsv
      - results/23-ordination-permanova/spring-aggregation-audit.tsv
      - results/23-ordination-permanova/design-balance.tsv
      - results/23-ordination-permanova/permutation-space-audit.tsv
      - results/23-ordination-permanova/ordination-scores.tsv
      - results/23-ordination-permanova/permanova-audit.tsv
      - results/23-ordination-permanova/dispersion-audit.tsv
      - results/23-ordination-permanova/pairwise-permanova.tsv
      - results/23-ordination-permanova/sensitivity-audit.tsv
      - results/23-ordination-permanova/interpretation-boundaries.tsv
      - results/23-ordination-permanova/validation-audit.tsv
      - results/23-ordination-permanova/validation.log
      - figures/23-design-permutation-space.pdf
      - figures/23-design-permutation-space.png
      - figures/23-design-permutation-space.tiff
      - figures/23-pcoa-cap.pdf
      - figures/23-pcoa-cap.png
      - figures/23-pcoa-cap.tiff
      - figures/23-permanova-dispersion.pdf
      - figures/23-permanova-dispersion.png
      - figures/23-permanova-dispersion.tiff
      - figures/23-pairwise-sensitivity.pdf
      - figures/23-pairwise-sensitivity.png
      - figures/23-pairwise-sensitivity.tiff
    acceptance_checks:
      - 所有 frozen input checksum 必须先通过；常规 QA 不读取 Figshare、FASTQ、BAM、MAG FASTA 或网络
      - 500 个 sample profiles 必须完整归属于 56 个 hot springs，780 个 MAG IDs 不丢失；spring composition 以 sample-relative abundance 等权求均后逐 spring 重新闭合
      - 推断单位固定为 hot spring；不得把 spring 内局部样本当成独立 biological replicates，也不得让 1–33 个不等样本数默认变成分析权重
      - 温度组由每个 spring 的 median temperature 按 <30、30–50、50–70、70–80、80–100 °C 固定分为 3/16/30/4/3 个 springs，不为获得显著性合并稀疏组
      - 主距离固定 Bray-Curtis；主模型公式顺序固定 BroadRegion + scale(MedianPH) + TemperatureRegime，主推断只读取 TemperatureRegime 的 marginal sums of squares
      - 主置换固定 seed 20260723，使用 9,999 个唯一、非原位、仅在 BroadRegion 内交换的 spring-level permutations，最小 Monte Carlo p 分辨率为 0.0001
      - sequential sums of squares 必须同时记录预登记顺序和 pH/temperature 交换顺序，但不取代 marginal 主检验
      - PCoA 必须报告 raw negative eigenvalue audit 并使用锁定 Lingoes correction 出图；partial CAP/dbRDA 固定 TemperatureRegime + scale(MedianPH) + Condition(BroadRegion) 且报告 adjusted R2
      - PERMDISP 固定 spatial median 与 bias adjustment，使用同一 region-restricted permutation matrix；若 dispersion 有差异，不得把 PERMANOVA 写成纯 centroid shift
      - 十个两两温度对比先根据 region overlap 判定可估性；只检验至少在两个 region 同时出现的六个对比，四个其余对比记为 not estimable
      - pairwise 主检验固定 region-adjusted exact/finite label-allocation permutations；可用非原位分配少于 9,999 时全部穷举，否则抽取 9,999 个唯一分配，六个可估对比统一 Holm 校正并报告 pH 不平衡
      - 敏感性审计至少包含 binary Jaccard、MAG prevalence >=10% springs、recruitment-weighted spring aggregation、pH 纳入/移除、formula order、非限制置换诊断对照与 conductivity complete-case model
      - Aitchison 不应用于该 recovered-MAG catalog 主分析；每个 location/dispersion 检验均报告 pseudo-F、R2/效应量、p 值、置换数与适用边界
      - 四张原创重绘图全部使用英文可见文字，并同时导出 PDF、PNG 和 350 dpi LZW TIFF
    common_failures:
      - 把 500 个局部样本当作 500 个独立生态重复，忽略 spring 内相关和不等取样强度
      - 只画 PCoA 后用眼睛宣称组间分离，或把 CAP 的约束轴误写成全群落主变异轴
      - 在观察结果后改换 distance、切点、formula order、permutation block 或过滤阈值
      - 报告 PERMANOVA p 值却不报 R2、dispersion 和置换结构，或在非限制置换更显著时把它升格为主结论
      - 对没有 region overlap 的极端温度组强行做 pairwise PERMANOVA，将 rank deficiency 或重复 permutation statistics 写成非显著
      - 对十个 pairwise p 值分别不校正，或把置换网格上的 p 值报告为超过其实际精度的小数
      - 将 catalog-closed MAG 组成的温度关联写成完整群落因果，忽略平均约 13% read recruitment 和非随机取样边界
    outputs:
      - results/23-ordination-permanova/validation-summary.json
      - results/23-ordination-permanova/data-lineage.tsv
      - results/23-ordination-permanova/spring-aggregation-audit.tsv
      - results/23-ordination-permanova/design-balance.tsv
      - results/23-ordination-permanova/permutation-space-audit.tsv
      - results/23-ordination-permanova/ordination-scores.tsv
