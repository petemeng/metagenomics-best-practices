  - id: validate-eggnog-functional-annotation
    title: 验证第 36 篇 eggNOG 功能注释、功能暗物质与多标签守恒合同
    goal: >
      对第 34 篇 93,782 条非冗余蛋白执行 checksum-locked eggNOG-mapper
      全量注释，分开 seed ortholog、宽泛家族证据与 KO/GO/EC 等具体标识符，
      再以第 35 篇 assigned-read 账本比较 gene-weight 与 read-weight 缺失比例。
    rationale: >
      同源命中、功能描述、COG、KO、GO、EC 与 PFAM 不是同一层证据；数据库 release、
      GO evidence policy、partial ORF 和一个基因对应多个标签都会改变“已注释比例”。
      只有保留零命中、仅 orthology、宽泛家族和具体标识符四个互斥桶，并对多标签
      采用 fractional allocation，才不会把预测证据误写成完整且实验确认的功能。
    inputs:
      - env/eggnog-annotation.yml
      - env/eggnog-annotation-linux-64.lock
      - data/small/36-eggnog-database-manifest.tsv
      - data/small/34-nonredundant-gene-catalog-frozen
      - data/small/35-gene-abundance-frozen
      - data/small/36-eggnog-functional-annotation-frozen
      - chapters/36-eggnog-functional-annotation.qmd
      - scripts/bootstrap_article36_eggnog_database.sh
      - scripts/prepare_article36_eggnog_inputs.py
      - scripts/run_article36_eggnog_annotation.py
      - scripts/summarize_article36_eggnog_annotation.py
      - scripts/freeze_article36_eggnog_annotation.py
      - scripts/validate_article36_eggnog_annotation.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/36-eggnog-functional-annotation" \
        "${RUN_ROOT}/figures" \
        "${RUN_ROOT}/.cache/article36-matplotlib"
      MPLCONFIGDIR="${RUN_ROOT}/.cache/article36-matplotlib" \
      PYTHONNOUSERSITE=1 \
      PYTHONPATH= \
      python3 "${MANIFEST_DIR}/scripts/validate_article36_eggnog_annotation.py" \
        --project-root "${MANIFEST_DIR}" \
        --frozen-dir "${MANIFEST_DIR}/data/small/36-eggnog-functional-annotation-frozen" \
        --output-dir "${RUN_ROOT}/results/36-eggnog-functional-annotation" \
        --figure-dir "${RUN_ROOT}/figures" \
        --chapter "${MANIFEST_DIR}/chapters/36-eggnog-functional-annotation.qmd"
    expected_outputs:
      - results/36-eggnog-functional-annotation/checksum-audit.tsv
      - results/36-eggnog-functional-annotation/database-audit.tsv
      - results/36-eggnog-functional-annotation/annotation-audit.tsv
      - results/36-eggnog-functional-annotation/chapter-audit.tsv
      - results/36-eggnog-functional-annotation/image-audit.tsv
      - results/36-eggnog-functional-annotation/validation-checks.tsv
      - results/36-eggnog-functional-annotation/validation-summary.json
      - results/36-eggnog-functional-annotation/validation.log
      - figures/36-field-coverage.pdf
      - figures/36-field-coverage.png
      - figures/36-field-coverage.tiff
      - figures/36-functional-dark-matter.pdf
      - figures/36-functional-dark-matter.png
      - figures/36-functional-dark-matter.tiff
      - figures/36-cog-category-profile.pdf
      - figures/36-cog-category-profile.png
      - figures/36-cog-category-profile.tiff
      - figures/36-go-evidence-policy.pdf
      - figures/36-go-evidence-policy.png
      - figures/36-go-evidence-policy.tiff
    acceptance_checks:
      - 输入必须与第 34 篇 93,782 条 primary protein representatives 逐 ID、字节数和 SHA-256 一致
      - MOCK1/MOCK2 read-weight 分母必须复用第 35 篇 2,784,234/2,777,443 条主 assigned reads
      - eggNOG-mapper 必须固定 2.1.15、eggNOG 5.0.2、DIAMOND 2.0.15 与 Linux-64 explicit lock
      - 主分析必须固定 sensitive iterative DIAMOND、E-value 1e-3、automatic tax scope、all target orthologs、non-electronic GO evidence 与 MD5
      - all-evidence GO 只能复用同一 seed-ortholog 表作为敏感性分析，不得替换主结果
      - 四个互斥 annotation states 必须覆盖全部 93,782 genes，gene-weight 与两个 read-weight 账本分别闭合到 100%
      - COG、KO 与 GO 多标签汇总必须按 1/m fractional allocation 守恒，并另外保留 genes-with-term overlap
      - 不得把无 seed ortholog 解释成基因不存在，不得把 predicted annotation 写成实验确认功能，不得用统一 identity/coverage 门槛系统性惩罚 partial ORFs
      - 四张图必须只含英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF
      - 验证 failed 必须为 0，数据库 manifest、原始 annotations、seed orthologs、命令、资源日志与全部冻结文件必须 checksum-covered
    common_failures:
      - 只报“eggNOG annotated”一个比例，却不声明字段、分母和 GO evidence policy
      - 删除无命中基因后再计算功能构成，导致功能暗物质从分母中消失
      - 将同一个基因完整复制到多个 COG、KO 或 GO term，造成总量凭空膨胀
      - 对 partial ORF 套用要求完整蛋白覆盖的统一门槛，并把低注释率误解为新功能
      - 把 automatic tax scope、数据库 release 或主/敏感性分支留给软件默认值而不记录
    outputs:
      - results/36-eggnog-functional-annotation/checksum-audit.tsv
      - results/36-eggnog-functional-annotation/database-audit.tsv
      - results/36-eggnog-functional-annotation/annotation-audit.tsv
      - results/36-eggnog-functional-annotation/chapter-audit.tsv
      - results/36-eggnog-functional-annotation/image-audit.tsv
      - results/36-eggnog-functional-annotation/validation-checks.tsv
      - results/36-eggnog-functional-annotation/validation-summary.json
      - results/36-eggnog-functional-annotation/validation.log
      - figures/36-field-coverage.pdf
      - figures/36-field-coverage.png
      - figures/36-field-coverage.tiff
      - figures/36-functional-dark-matter.pdf
      - figures/36-functional-dark-matter.png
      - figures/36-functional-dark-matter.tiff
      - figures/36-cog-category-profile.pdf
      - figures/36-cog-category-profile.png
      - figures/36-cog-category-profile.tiff
      - figures/36-go-evidence-policy.pdf
      - figures/36-go-evidence-policy.png
      - figures/36-go-evidence-policy.tiff
    method_basis:
      type: external-benchmark
      summary: >
        以 Delgado 与 Andersson 的 gene-catalog eggNOG 分析为论文锚点，使用稳定版
        eggNOG-mapper 2.1.15/eggNOG 5.0.2 重做完整目录，并把字段级 missingness、
        GO evidence sensitivity、ORF completeness 与 read-weight 影响加入当前标准审计。
    references:
      - title: Evaluating metagenomic assembly approaches for biome-specific gene catalogues
        type: method-benchmark
        url: https://doi.org/10.1186/s40168-022-01259-2
      - title: eggNOG-mapper v2 functional annotation, orthology assignments, and domain prediction at the metagenomic scale
        type: method-paper
        url: https://doi.org/10.1093/molbev/msab293
      - title: eggNOG 5.0 a hierarchical, functionally and phylogenetically annotated orthology resource
        type: database-paper
        url: https://doi.org/10.1093/nar/gky1085
      - title: eggNOG-mapper official stable release and usage documentation
        type: official-documentation
        url: https://github.com/eggnogdb/eggnog-mapper
      - title: Gene Ontology knowledgebase
        type: ontology-paper
        url: https://doi.org/10.1093/nar/gky1055
    assertions:
      - id: eggnog-validation-status
        type: text_match
        path: results/36-eggnog-functional-annotation/validation-summary.json
        pattern: '"status": "passed"'
      - id: eggnog-catalog-size
        type: metric_threshold
        path: results/36-eggnog-functional-annotation/validation-summary.json
        key: catalog_genes
        comparator: "=="
        value: 93782
      - id: eggnog-seed-ortholog-genes
