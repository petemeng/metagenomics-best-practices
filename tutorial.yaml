  - id: validate-profiler-benchmark
    title: 验证第 18 篇 MetaPhlAn、Kraken2/Bracken 与 mOTUs 横评合同
    goal: >
      复用 Meslier 71-strain MOCK1 经质控保留的 99,991 个同步 read pairs、
      第 15 篇 MetaPhlAn 4.2.5 profile、第 16–17 篇 Kraken2/Bracken profile，
      新增一次 mOTUs 4.1.0 / marker-gene database 4.1 实跑。先保留三套工具的
      原生 feature、单位、未解析量与默认/主分析参数，再通过显式
      NCBI species—MetaPhlAn SGB—mOTU crosswalk 建立 reference-aware 与
      one-to-one common comparison domain，比较检出、non-truth burden、组成一致性、
      wall time、峰值 RSS 与数据库磁盘占用。
    rationale: >
      MetaPhlAn SGB、Kraken/Bracken NCBI taxon 与 GTDB R226 mOTU 是不同的测量对象，
      mapped reads、classified fragments、marker-gene inserts 和 relative abundance
      也没有共同分母。只有先锁定数据库覆盖并排除 split/merge/ambiguous crosswalk，
      才能把“工具结果不同”拆成参考库、特征定义、算法阈值和定量尺度四类原因。
    inputs:
      - env/biobakery.yml
      - env/biobakery-linux-64.lock
      - env/kraken.yml
      - env/kraken-linux-64.lock
      - env/motus.yml
