    title: 验证第 29 篇条件关联网络、稳定性、Zi-Pi 与拓扑鲁棒性
    goal: >
      对 93 个预筛 MAG 执行 reclosure、pseudocount、CLR、环境残差化和标准化，
      用 huge graphical lasso + StARS 选择主网络；再完成 1,000 次 BroadRegion
      分层 bootstrap、Louvain/Zi-Pi、1,000 个 degree-preserving nulls、
      targeted-vs-random deletion 和八类敏感性分支，并生成五张出版图。
