    method_basis:
      type: external-benchmark
      summary: >
        Taxonomic and functional unit semantics come from actual MetaPhlAn 4.2.5,
        Kraken2/Bracken, HUMAnN 3.9 and curatedMetagenomicData outputs already frozen in
        this series. Genome-equivalent calibration is an actual MicrobeCensus v1.1.1-tag
        run on the checksum-identical MOCK1 clean reads. Routine QA recomputes all table
        identities and figures from small evidence without replaying FASTQ search.
    references:
