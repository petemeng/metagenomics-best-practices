id: metagenomics-best-practices
slug: metagenomics-best-practices
title: 宏基因组分析最佳实践 · Shotgun 系列
problem_statement: >
  面向懂生物学但尚不能独立完成宏基因组分析的科研读者，建立一套从实验设计、
  read-based profiling、基因与 contig 分析，到 MAG、菌株、病毒、代谢建模和
  跨队列验证的 77 篇中文教程。网页版是代码权威源，微信公众号文章由同一份
  QMD、真实公开数据、执行结果和原创重绘图派生。
audience:
  level: 科研初中级
  summary: >
    适合了解微生物组基本概念，但缺少 Linux、生信工作流、统计审计、MAG/菌株
    分析和发表级作图训练的生物医学、环境与微生物学研究者。
language:
  primary: zh-CN
  terminology: en
covers:
  - 宏基因组相对 16S、宏转录组、宏蛋白组和代谢组的测量边界
  - 实验设计、测序深度、污染控制、计算环境、QC 与去宿主
  - MetaPhlAn、Kraken2/Bracken 和 HUMAnN 的 read-based 分析
  - 组成型统计、差异分析、机器学习和 CRC 跨队列外部验证
  - 组装、基因目录、分箱、MAG、菌株、病毒、质粒和真核微生物
  - 代谢建模、多组学、纵向与因果证据、公共资源和工程化发表
prerequisites:
  - 能阅读基础 R 与 shell 命令
  - 理解样本、reads、物种丰度表、功能丰度表和 metadata 的基本含义
  - 下游章节使用锁定的 R 环境；重型上游章节使用独立 conda/Apptainer 环境
  - 每篇文章都从明确公开输入或已固化中间产物开始
workflow_overview:
  - 先验证 77 篇编号、标题、文件路径和两条发表闭环
  - 第 01 篇使用 Wirbel CRC 公开元数据与方法文献建立测量边界
  - 第 03 篇从同一公开元数据审计队列设计、协变量完整度与效力规划边界
  - 第 04 篇联合 CRC library-size 分布与真实 Nonpareil coverage 曲线制定深度停止规则
  - 第 05 篇用 Costea cellular mock 与 synDNA benchmark 区分提取偏差、建库偏差和定量单位
  - 第 06 篇用唾液配对宿主耗竭与痰液 saponin 剂量数据区分效率、靶标保留和隐私门
  - 第 07 篇用 Salter shotgun 稀释证据与 MUClite 对照对象区分流程污染、逐样本 burden 和 index hopping
  - 第 08 篇用同一 MOCK1 的 Illumina、历史 ONT R9 与 PacBio CCS 区分 FASTQ Q、mapped identity、read span 与 assembly outcome
  - 第 09 篇把 Windows WSL2 control plane 与 Linux execution plane 分开，并用固定 conda 环境和同一 MOCK1 真实证据做验收
  - 第 10 篇从同一 MOCK1 的 10.945 GB 压缩输入盘点出发，用确定性本地任务、checksum sentinel、Apptainer 合同和 SLURM 模板建立资源闭环
  - 第 11 篇把 bioBakery 与组装分箱拆成两个真实安装环境，以直接版本、Linux-64 explicit lock、入口测试和数据库 checksum gate 分层验收
  - 第 12 篇固定 R 4.4.1 / Bioconductor 3.19，真实取回 curatedMetagenomicData 的 EH7091 对象并验证 SHA-256 锁定离线复用
  - 第 13 篇从同一 MOCK1 的 ERR9765746 固定取前 100,000 个同步 read pairs，实际运行 FastQC、fastp 与 MultiQC，并把原始诊断、修剪决策和成对 read ledger 分开验收
  - 第 14 篇用公开人类 WGS 基准 ERR194147 与同一 MOCK1 各 20,000 个同步 read pairs，实际运行完整人类参考去宿主，并把低复杂度与重复 reads 保留为独立敏感性审计
  - 第 15 篇复用同一 MOCK1 经质控保留的 99,991 个同步 pairs，用固定 MetaPhlAn 4.2.5 与 vJan26 SGB 数据库实际生成物种/SGB 谱、unclassified 估计、marker support 与低丰度/深度敏感性账本
  - 第 17 篇复用同一 MOCK1 clean pairs 与公开人类 WGS 方法对照，在同日 Standard-8、Standard-16、PlusPF-8 数据库上分解容量、内容、confidence 与 minimum-hit-groups 对检出和非预期调用的影响
  - 第 18 篇复用同一 MOCK1 的 MetaPhlAn、Kraken2/Bracken 证据并新增 mOTUs 4.1.0 实跑，以数据库内部 crosswalk 区分 NCBI species、SGB 与 mOTU 后再比较检出、组成和资源
  - 第 19 篇从同一 MOCK1 clean reads 真实运行 HUMAnN 3.9，并把 gene family、reaction、pathway abundance、pathway coverage 与特殊行拆成可审计的 feature space
  - 第 20 篇复用第 19 篇固化功能表和 curatedMetagenomicData 的 AsnicarF_2017 HUMAnN3 pathway profiles，审计 community/levelwise、special-row denominator、coverage、prevalence、zero 与 pseudocount 敏感性
  - 第 21 篇联合第 15–20 篇 checksum-locked taxonomic/functional tables 与同一 MOCK1 的 MicrobeCensus genome-equivalent 标尺，逐列记录测量对象、校正、分母、closure、zero 和允许的下游运算
  - 第 22 篇以 AsnicarF_2017 同一 24 个 profiles 的 MetaPhlAn3 species 与 HUMAnN3 gene-family 表演示 read-based 多样性，并以 500 个美国西部温泉样本的 780-MAG abundance matrix 演示 genome-resolved 多样性；两条数据线不伪装成同队列三层比较
  - 第 23 篇把同一温泉数据的 500 个样本等权聚合为 56 个 spring-level 分析单位，以 Bray-Curtis PCoA/CAP、region-restricted PERMANOVA 和 PERMDISP 区分位置、约束轴与离散度，并对稀疏温度组别显式计算可估性与置换分辨率
  - 第 24 篇以 ZellerG_2014 的独立 CRC/对照受试者为主分析集，用 MaAsLin3 分开检验物种与 MetaCyc pathway 的 abundance/prevalence 关联，并把 ANCOM-BC2、ALDEx2 限定为 read-depth 重建 pseudo-count 的方法敏感性审计
  - 第 25 篇以 HMP_2012 的 7 个 shotgun habitats 重绘多 rank 组成与 prevalence–abundance 图，在 490 个 subject-habitat 单位上用 Wilson 区间、受试者 bootstrap 和 112 个阈值分支定义并审计 operational core
  - 第 26 篇审计 curatedMetagenomicData 3.12.0 的 732 个资源标题和 22,588 × 141 元数据快照，以 HMP、Zeller、Asnicar 三个真实队列演示 release 选择、样本主键、mergeData 与数据谱系卡
  - 第 27 篇以 ZellerG_2014 的 114 名独立 CRC/Control 受试者和 661 个 MetaPhlAn3 物种为输入，用 Random forest 与 XGBoost 演示训练折预处理、5×5/4-fold nested CV、校准、held-out importance 与置换标签泄漏负对照
  - 第 16–28 篇以 CRC 为主要叙事线完成 read-based 发表闭环
  - 第 28 篇重做为真正的 N−1 队列训练、留一队列外测
  - 第 29 篇复用 56 个温泉的 780-MAG 表，以协变量残差 CLR、graphical lasso、StARS、分层 bootstrap、Zi-Pi 与度保持零模型审计条件关联网络
  - 第 30 篇用两个真实不均一 DNA mocks 的固定 200 万同步 read-pair 子集，实跑 MEGAHIT/metaSPAdes single/co 六分支与八次 read-back mapping，并分别审计 contiguity、recruitment 和资源代价
  - 第 31 篇用同一 71-strain MOCK1 DNA 的完整历史 ONT R9 与 PacBio HiFi archives，实跑 Flye、hifiasm-meta、metaMDBG 四分支，并联合审计 contiguity、base-level read-back、circular-junction 证据和资源代价
  - 第 32 篇用同一 MOCK1 DNA 的固定一千万 Illumina pairs、完整 ONT R9 与 HiFi reads，拆分 short-read-first hybrid、long-read-first polishing、逐 reference recovery、consensus error 与资源合同
  - 第 33 篇统一审计前述 15 个真实 assemblies，以 71/87 exact references、17 条评价分支和两个确定性正控区分 N50、NA50、recovery、structural discordance 与 task-specific usability
  - 第 34 篇从第 30 篇六套真实 assemblies 预测 441,407 个 ORFs，按论文兼容的 Prodigal/MMseqs2 定义建立 individual、co 与 cascaded mix 目录，并以 87 个 exact genomes 分开审计 recovery、support、阈值和 CD-HIT 敏感性
  - 第 35 篇把 MOCK1/MOCK2 共 7,999,482 条 clean reads 回比第 34 篇 93,782-gene 目录，分开 raw mapping 与 2,784,234/2,777,443 条主 assigned reads；89,339 个基因获得 UniRef90 best hit，15,392 个基因连到 MetaCyc reaction，并审计 CPM/RPKM/TPM closure 与一对多守恒
  - 第 36 篇用 eggNOG-mapper 2.1.15、eggNOG 5.0.2 与 DIAMOND 2.0.15 全量注释同一 93,782-protein 目录；84,511 条获得 seed ortholog，50,800 条带 KO，non-electronic/all-evidence GO 分别覆盖 8,821/20,471 条，并以四态 gene/read ledger 与 COG/KO/GO fractional allocation 审计功能暗物质
  - 第 37 篇用 dbCAN 5.2.9 的 DIAMOND、family HMM 与 dbCAN-sub 实跑同一目录，以两工具共识定义 2,050 条主 CAZymes，并用 Bacteroides thetaiotaomicron 审计 117 个 CGC 与底物预测边界
  - 第 38 篇用 RGI 6.0.8 与 CARD 4.0.1 实跑 catalog、co-assembly 和双阳性对照，将 36 条 Perfect/Strict 主 ARG 与 6,763 条 Loose-only 候选分开，并保留表型证据边界
  - 第 39 篇用 ABRicate 1.4.0、BLAST+ 2.17.0 与 VFDB 2026-07-24 实跑 core/full 和 90/80、80/80 分支，将阈值敏感性、数据库敏感性与致病表型边界分开
  - 第 40 篇用 antiSMASH 8.0.4 与 GECCO 0.10.3 实跑完整/切碎 Salinispora、Nostoc 和真实 co-assembly，以坐标重叠、fragmentation recovery、MIBiG 4.0 和 gene/read ledger 审计 BGC 证据
  - 第 41 篇把 MOCK1/MOCK2 clean reads 回比同一 MEGAHIT co-assembly，以 Bowtie2/Samtools/JGI 完整坐标账本审计 mapping fate、breadth 与深度一致性
  - 第 42 篇在同一 10,203-contig 坐标实跑 MetaBAT2 single/multisample、SemiBin2、VAMB 与 TaxVAMB，并对全部 raw bins 独立运行 CheckM2/GUNC
  - 第 43 篇从五套 checksum-locked partitions 实跑 DAS Tool 与 Binette，以独立 CheckM2/GUNC 和 truth-blind 规则选择不重叠 refined candidates
  - 第 44 篇对 truth-blind selected MAGs 独立重跑 CheckM2、GUNC、CheckM1、rRNA/tRNA/CDS 与 assembly-graph 审计，并按完整 MIMAG 规则分级
  - 每篇通过 QA 后再派生网页版和本地微信公众号预览
results_check:
  - 系列目录应包含 77 篇且编号 01–77 连续
  - 第 01 篇应从 CC BY 4.0 的 CRC 元数据独立生成队列图和测量边界图
  - 第 01 篇数据审计应识别 8 个 CRC 分析队列和 768 个 CRC/对照样本
  - 第 03 篇应识别最小设计臂 24 人、年龄缺失 60 例和 BMI 缺失 71 例
  - 第 04 篇应识别 CRC library-size 中位数 24,019,758.5 reads，并重建 Lake Lanier 约 68% 的观测 coverage
  - 第 05 篇应复算 27 个 Costea profiles、10 个 mock taxa 和 H/Q/W 最大成对偏差约 2,751/56/74 倍
  - 第 05 篇 synDNA Pool 2 与预期细胞比例的 Pearson r 应高于 0.99，RMSE 应低于 1 percentage point
  - 第 06 篇应复算 6 种唾液处理，确认 untreated/lyPMA 宿主比例为 89.29%/8.53%
  - 第 06 篇应把 Longhi 的 7 个 saponin 条件明确标为单份痰液的描述性剂量系列
  - 第 07 篇应复算 1,951 个 features、569 个 samples 与 56 个 global combined 候选污染
  - 第 07 篇应保留 pooled/plate-aware sensitivity 与独立 UDI/index-pair 审计边界
  - 第 08 篇应复算 15,000 条 prefix metrics，并确认三个平台 prefix median read length 为 150、4,033.5、9,204 bp
  - 第 08 篇应保留历史 ONT R9、非随机文件前缀、platform-specific assembler 与 unequal read-budget 边界
  - 第 09 篇应锁定 Miniforge 26.3.2-2、环境 YAML SHA-256、4 个 direct package versions 与 Linux-64 explicit spec
  - 第 09 篇应在原生 Linux 证据机得到 21 个环境 PASS、1 个 Windows control NOT RUN 与 17 个真实数据 PASS
  - 第 10 篇应核对 4 个 ENA FASTQ 合计 10,944,966,814 bytes，并完成 3 个 5,000-row 本地任务
  - 第 10 篇第二次运行应校验 checksum 后跳过 3 个任务，同时把本机 SLURM 与 Apptainer 保留为 NOT RUN
  - 第 11 篇应复核 2 个环境、16 个真实工具入口和 3 个内置安装测试均通过
  - 第 11 篇数据库 manifest 应固定 MetaPhlAn vJan26、CheckM2 v3 与 GTDB R232 的官方 checksum，并对 2 个无上游 checksum 的 HUMAnN full endpoint fail-closed
  - 第 12 篇应精确核对 17 个 R 包版本、185 条 renv 记录和 ExperimentHub EH7091 的资源身份
  - 第 12 篇应恢复 298 × 24 的 TreeSummarizedExperiment，证明 15 个 subject、相对丰度单位、phyloseq 守恒与离线 QA 边界
  - 第 13 篇应核对 ERR9765746 前 100,000 个 R1/R2 records 完全同步，原始 FASTQ 与 clean FASTQ 均不进入 Git
  - 第 13 篇应由 FastQC 0.12.1、fastp 1.3.6 与 MultiQC 1.35 真实生成 before/after 报告，并以 fastp JSON 建立成对 read 数守恒账本
  - 第 14 篇应核对 ERR194147 与 ERR9765746 各 20,000 个 R1/R2 records 完全同步，人源、微生物与过滤后 FASTQ 均不进入 Git
  - 第 14 篇应以 Hostile 2.0.2、Bowtie2 2.5.4 和 human-t2t-hla 2023-07 完整索引验证人源删除率与 MOCK1 保留率均不低于 99%
  - 第 14 篇主输出不得默认启用 low-complexity filtering 或 deduplication；20%/30%/40% complexity 与 sequence-exact dedup 只能作为有账本的敏感性分支
  - 第 15 篇应精确锁定 MetaPhlAn 4.2.5 与 mpa_vJan26_CHOCOPhlAnSGB_202605，校验官方 6,014,095,360-byte tar 的 MD5 并审计全部解包文件
  - 第 15 篇应核对输入为 ERR9765746 经质控保留的 99,991 个同步 pairs，原始/清洁 FASTQ 与 Bowtie2 大文件均不进入 Git
  - 第 15 篇应保留 default unclassified estimation 与 --skip_unclassified_estimation 两种分母，分开 species、known/unknown SGB、marker support、检出与低丰度阈值语义
  - 第 15 篇应将固定 seed 的 20,000/50,000/99,991-pair 深度敏感性与全量 profile 分开，不把单一文件前缀的检出数当成普适性能
  - 第 17 篇应核对 71 个 MOCK1 assembly 真值，并把 exact assembly、same-species alternate reference 与 no same-species reference 三类数据库可检出边界分开
  - 第 17 篇应完成 3 个同日数据库、5 个 confidence、2 个方法对照的 30 个主分支，以及 Standard-16 的 minimum-hit-groups 补充分支
  - 第 17 篇应确认三库均有 63/69 个 truth species 具备 same-species reference；Standard-16、confidence 0.10、hit-groups 2 的操作性比较点恢复 55/63 个 species
  - 第 17 篇的人类方法对照必须把 Homo sapiens clade、human-lineage ancestor direct calls 与 lineage-external unsupported calls 分开；不得将其称为 extraction-blank 假阳性率，也不得把某个 confidence 写成普适阈值
  - 第 18 篇应确认三套 profiler 读取同一 99,991 个 clean pairs，并把 MetaPhlAn estimated reads、Kraken paired fragments、Bracken estimates 与 mOTUs marker-gene inserts 的分母分开
  - 第 18 篇应从 71 assemblies、69 current species 建立 NCBI species–SGB–mOTU crosswalk，确认严格共同一对一域为 52 个物种、覆盖 70.738% expected mass
  - 第 18 篇应同时报告 native/default 与 sensitivity branches；默认分支在共同域内的 Spearman rho 与 total variation 不得替代 reference-aware recovery 和 non-truth burden
  - 第 18 篇应固定 mOTUs 4.1.0、database 4.1 与 GTDB R226，并保留版本文件 124,295 与 runtime 124,300 mOTUs 的上游计数差异
  - 第 19 篇应核对同一 99,991 个 clean pairs 的 199,982-read 守恒，主 prescreen 不得绕过，并把 gene-family、regrouped reaction、pathway abundance 与 pathway coverage 的 feature space 和单位分开
  - 第 19 篇应使用 HUMAnN 3.9 内置 uniref90_rxn mapping 在 native RPK 上按 sum regroup，保留 UNGROUPED 与 protected UNMAPPED，再分别派生 reaction CPM/relative abundance
  - 第 19 篇应确认 1,402 个 ordinary reactions、0 个 reaction stratification 违例、mapping SHA-256 及大于 1 的 one-to-many expansion；不得把 expansion 解释为新增 reads
  - 第 20 篇应完成 3 个 feature spaces × 2 个 units × 2 个 modes × 2 个 special-row choices 的 24 个归一化分支，并确认 closure 违例为 0
  - 第 20 篇应保留 24 个 AsnicarF_2017 profiles、15 个 subjects 与 11,173 个原始 pathway rows，只对 unstratified ordinary pathways 做 prevalence 与 zero/pseudocount 审计
  - 第 20 篇不得归一化 pathway coverage，不得将删去 special rows 后重新闭合的 100% 写成功能解释率，也不得对单个 MOCK1 做生物组间推断
  - 第 21 篇应为每类真实表建立 data dictionary，至少区分 observed fragments、model-estimated reads、RPK、HUMAnN CoPM、relative abundance、pathway coverage、average genome size、genome equivalents 与 RPKG
  - 第 21 篇应使用同一 199,982-read MOCK1 sequence universe 实跑 MicrobeCensus v1.1.1 source tag，主分支固定 150 bp、敏感性分支固定 100 bp，并保留 upstream tag 与内部 1.1.0 version string 的差异
  - 第 21 篇不得把 MetaPhlAn estimated reads 或 Bracken estimates 当 raw counts，不得把 HUMAnN CoPM 写成 counts per million，也不得把 genome equivalents 写成 cell count、biomass 或绝对浓度
  - 第 22 篇应保留 AsnicarF_2017 的 24 profiles / 15 subjects 与温泉数据的 500 samples / 56 springs / 780 MAGs；species 与 gene-family 可按 sample ID 配对，MAG 分支必须保持独立数据谱系
  - 第 22 篇应同时报告 Hill q=0/1/2、Bray-Curtis、binary Jaccard 与适用时的 Aitchison sensitivity，并把 prevalence filter、pseudocount、catalog recruitment 和 repeated measures 写进解释边界
  - 第 22 篇只做描述性多样性与排序，不做 PERMANOVA、betadisper、组间显著性或把非独立 pairwise distances 当独立重复；正式排序检验留给第 23 篇
  - 第 23 篇应以 56 个温泉而非 500 个样本作推断单位，主模型固定 Bray-Curtis ~ broad region + standardized median pH + temperature regime，主效应用 marginal sums of squares 和 region-restricted 9,999 次唯一非原位置换
  - 第 23 篇应把 PCoA、partial CAP/dbRDA、PERMANOVA location 与 PERMDISP dispersion 分开解释；顺序 sums of squares、非限制置换、binary Jaccard、MAG prevalence filter、recruitment-weighted aggregation 和 conductivity complete-case 只作预登记敏感性审计
  - 第 23 篇的两两温度对比应先判定 region overlap 和有效标签分配数；不可估对比必须记为 not estimable，可估家族固定 Holm 校正，不得把极端温度组的置换精度伪装成连续 p 值
  - 第 24 篇主分析应保留 59 个 control 与 51 个 CRC complete cases，并校正年龄、性别、BMI 与 log10 read depth；不得把 110 个独立受试者扩写为重复测量
  - 第 24 篇应分别报告 MaAsLin3 abundance、prevalence 与 joint association，并在 species 与 pathway 两个预声明 feature universes 内独立控制 BH FDR
  - 第 24 篇的 ANCOM-BC2 与 ALDEx2 输入必须标记为由 cMD 相对丰度乘 read depth 后四舍五入得到的 pseudo-count；它们只能审计方向和方法敏感性，不能伪称原始 taxon read counts 或独立验证
  - 第 25 篇应将 phylum、genus 与 species terminal lineages 分表并各自重闭合；组均值必须来自 sample-wise closed compositions，不得先合并 reads
  - 第 25 篇主推断单位应固定为 490 个 subject-habitat representatives；不得把 buccal mucosa、tongue dorsum 与 supragingival plaque 合并成宽泛 oral cavity 后计算核心 prevalence
