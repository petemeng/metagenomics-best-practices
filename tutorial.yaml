  - id: validate-composition-core
    title: 验证第 25 篇多 rank 组成、prevalence–abundance 与 operational core 合同
    goal: >
      在 490 个独立 subject-habitat units 上计算等权 rank-specific composition、
      species prevalence、检出后中位丰度、Wilson 95% interval、主 operational core、
      1,000 次 subject bootstrap 稳定性与 112 个 detection-by-prevalence 分支，
      并输出四张英文发表图及完整审计表。
    rationale: >
      core microbiome 不是脱离 threshold、habitat 与 sampling effort 的固定名单。
      同时锁定点定义、二项区间、重抽样稳定性、阈值网格与完整 feature universe，
      可以阻止看到结果后改 detection/prevalence threshold 或手挑 taxa。
    inputs:
      - env/renv.lock
      - data/small/25-composition-core/phylum-relative-abundance.tsv.gz
      - data/small/25-composition-core/genus-relative-abundance.tsv.gz
      - data/small/25-composition-core/species-relative-abundance.tsv.gz
      - data/small/25-composition-core/sample-metadata.tsv
      - data/small/25-composition-core/sample-selection-audit.tsv
      - data/small/25-composition-core/rank-closure-audit.tsv
      - data/small/25-composition-core/analysis-contract.tsv
      - data/small/25-composition-core/resource-manifest.tsv
      - data/small/25-composition-core/file-checksums.sha256
      - data/small/25-data-NOTICE.txt
      - scripts/validate_article25_composition_core.R
      - figures/25-hmp-fig3-original.jpg
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/25-composition-core" \
        "${RUN_ROOT}/figures"
      R_LIBS_USER="${MANIFEST_DIR}/.r-lib:${HOME}/R/library" \
      Rscript "${MANIFEST_DIR}/scripts/validate_article25_composition_core.R" \
        --project-root "${MANIFEST_DIR}" \
        --input-dir "${RUN_ROOT}/data/small/25-composition-core" \
        --output-dir "${RUN_ROOT}/results/25-composition-core" \
        --figure-dir "${RUN_ROOT}/figures"
    expected_outputs:
      - results/25-composition-core/validation-summary.json
      - results/25-composition-core/rank-composition-summary.tsv
      - results/25-composition-core/carriage-summary.tsv.gz
      - results/25-composition-core/primary-core-membership.tsv
      - results/25-composition-core/bootstrap-core-stability.tsv
      - results/25-composition-core/core-threshold-sensitivity.tsv
      - results/25-composition-core/core-overlap.tsv
      - results/25-composition-core/core-display-selection.tsv
      - results/25-composition-core/sample-vs-subject-habitat-audit.tsv
      - results/25-composition-core/top-taxa-audit.tsv
      - results/25-composition-core/package-versions.tsv
      - results/25-composition-core/validation-audit.tsv
      - results/25-composition-core/validation.log
      - figures/25-multirank-mean-composition.pdf
      - figures/25-multirank-mean-composition.png
      - figures/25-multirank-mean-composition.tiff
      - figures/25-individual-stool-composition.pdf
      - figures/25-individual-stool-composition.png
      - figures/25-individual-stool-composition.tiff
      - figures/25-prevalence-abundance.pdf
      - figures/25-prevalence-abundance.png
      - figures/25-prevalence-abundance.tiff
      - figures/25-core-membership-sensitivity.pdf
      - figures/25-core-membership-sensitivity.png
      - figures/25-core-membership-sensitivity.tiff
    acceptance_checks:
      - composition 必须先逐样本、逐 rank 闭合，再在每个 habitat 对 490 个独立单位等权求均；不得 pooled-read weighting
      - 主 species detection 固定 relative abundance >=0.0001 fraction，主 core prevalence 固定 >=0.80；profile zero 只解释为 workflow-specific non-detection
      - 每个 prevalence 必须保存 Wilson 95% interval；bootstrap 固定 seed 20260725、每 habitat 1,000 次受试者重抽样，并在同一 replicate 内为所有 taxa 共用 sampling weights
      - sensitivity grid 固定四个 detection thresholds 0/1e-5/1e-4/1e-3 与四个 prevalence thresholds 0.50/0.80/0.90/1.00，在七个 habitats 中形成 112 个分支
      - 主 core counts 必须为 2/5/21/50/34/9/0，bootstrap-stable counts 必须为 2/4/20/45/30/6/0
      - 至少一个 habitat 为 core 的 species union 必须为 92，最多跨 3 个 habitats；图形展示子集固定包含全部 25 个 multi-habitat members，并按预声明 score 补足至 36 个展示 species
      - all-samples 与 subject-habitat representatives 的审计必须记录 9 次 core classification changes，最大 absolute prevalence difference 为 0.0871459694989107
      - 四张原创图全部使用英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF；原 HMP Figure 3 的 SHA-256 必须锁定
    common_failures:
      - 用每个 habitat 自己的 top taxa 与颜色，导致跨 habitat 图例不可比较
      - 把 point prevalence 刚好超过 80% 的物种写成稳定核心，而不看 Wilson interval 或 bootstrap inclusion frequency
      - 只报告一个 core list，不记录 detection threshold、prevalence threshold、rank、独立单位和未分类 taxa 规则
      - 用 core species 数代替 core community mass，或把 posterior fornix 的空 species core 解释成没有共同生态功能
      - 为图形可读性手工删 taxa 却不保留 display-selection audit 与完整 92-species table
    outputs:
      - results/25-composition-core/validation-summary.json
      - results/25-composition-core/rank-composition-summary.tsv
      - results/25-composition-core/carriage-summary.tsv.gz
      - results/25-composition-core/primary-core-membership.tsv
      - results/25-composition-core/bootstrap-core-stability.tsv
      - results/25-composition-core/core-threshold-sensitivity.tsv
      - results/25-composition-core/core-overlap.tsv
      - results/25-composition-core/core-display-selection.tsv
      - results/25-composition-core/sample-vs-subject-habitat-audit.tsv
      - results/25-composition-core/top-taxa-audit.tsv
      - results/25-composition-core/package-versions.tsv
      - results/25-composition-core/validation-audit.tsv
      - results/25-composition-core/validation.log
      - figures/25-multirank-mean-composition.pdf
      - figures/25-multirank-mean-composition.png
      - figures/25-multirank-mean-composition.tiff
      - figures/25-individual-stool-composition.pdf
      - figures/25-individual-stool-composition.png
      - figures/25-individual-stool-composition.tiff
      - figures/25-prevalence-abundance.pdf
      - figures/25-prevalence-abundance.png
      - figures/25-prevalence-abundance.tiff
      - figures/25-core-membership-sensitivity.pdf
      - figures/25-core-membership-sensitivity.png
      - figures/25-core-membership-sensitivity.tiff
    method_basis:
      type: external-benchmark
      summary: >
        HMP 2012 Figure 3a/3c 锚定七个 shotgun habitats、prevalence intensity 与
        non-zero abundance size；当前分析在 cMD 的 uniform MetaPhlAn3 profiles
        上加入 rank closure、subject-habitat 去伪重复、Wilson interval、bootstrap
        和 threshold sensitivity，不伪称复现原论文历史 taxonomy 的逐值结果。
    references:
      - title: Structure, function and diversity of the healthy human microbiome
        type: application-paper
        url: https://doi.org/10.1038/nature11234
      - title: Beyond the Venn diagram - the hunt for a core microbiome
        type: method-paper
