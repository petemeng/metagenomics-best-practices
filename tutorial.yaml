      - figures/16-kraken-classification-ledger.png
      - figures/16-kraken-classification-ledger.tiff
      - figures/16-bracken-redistribution.pdf
      - figures/16-bracken-redistribution.png
      - figures/16-bracken-redistribution.tiff
      - figures/16-bracken-parameter-sensitivity.pdf
      - figures/16-bracken-parameter-sensitivity.png
