  - id: prepare-differential-abundance-data
    title: 固化第 24 篇 ZellerG_2014 物种谱、功能谱与 pseudo-count 边界
    goal: >
      从 curatedMetagenomicData 3.12.0 的 2021-03-31 ZellerG_2014
      relative_abundance 与 pathway_abundance 对象，提取 156 名独立受试者的
      species-level MetaPhlAn profile、unstratified ordinary MetaCyc pathways、
      临床协变量和由相对丰度乘 read depth 得到的整数 pseudo-count。
    rationale: >
      MaAsLin3 可以直接分析相对丰度并分别建立 abundance/prevalence 模型；
      ANCOM-BC2 与 ALDEx2 需要 count-like 输入。把两种输入在准备阶段分开命名、
      记录公式和校验和，才能阻止 pseudo-count 在后文被误写成观测 reads。
    inputs:
      - downloads/article24/2021-03-31.ZellerG_2014.relative_abundance.rda
      - downloads/article24/2021-03-31.ZellerG_2014.pathway_abundance.rda
      - env/renv.lock
      - scripts/prepare_article24_differential_data.R
    command: |
      set -eu
      mkdir -p "${RUN_ROOT}/data/small/24-differential-abundance"
      R_LIBS_USER="${MANIFEST_DIR}/.r-lib:${HOME}/R/library" \
      Rscript "${MANIFEST_DIR}/scripts/prepare_article24_differential_data.R" \
        --species-rda "${RUN_ROOT}/downloads/article24/2021-03-31.ZellerG_2014.relative_abundance.rda" \
        --pathway-rda "${RUN_ROOT}/downloads/article24/2021-03-31.ZellerG_2014.pathway_abundance.rda" \
        --output-dir "${RUN_ROOT}/data/small/24-differential-abundance"
    expected_outputs:
      - data/small/24-differential-abundance/species-relative-abundance.tsv.gz
      - data/small/24-differential-abundance/species-pseudocounts.tsv.gz
      - data/small/24-differential-abundance/pathway-relative-abundance.tsv.gz
      - data/small/24-differential-abundance/sample-metadata.tsv
      - data/small/24-differential-abundance/analysis-contract.tsv
      - data/small/24-differential-abundance/resource-manifest.tsv
      - data/small/24-differential-abundance/file-checksums.sha256
      - data/small/24-differential-abundance/data-NOTICE.txt
    acceptance_checks:
      - 两个 source payload 的 bytes、MD5 与 SHA-256 必须分别等于 147044/a03686e5adc99d03ca1f026591bfcc84/d8e0f3fd00b2339b1aa929197ca0869c43990ff885a04fc675e70d4aff5604b2 和 4503559/43e0f9599d8ec62aec6ffa0350351e7b/bf333a90b36cf875960d584500be6ce1dabb0240981f797493fd98ff1dc60bf6
      - 156 个 sample IDs 必须在 species、pathway 与 curated sampleMetadata 中一一对应，且 subject_id 全部唯一
      - 原始 taxonomic matrix 的 7 个 rank 层级总和不得直接作为 species composition；只保留 661 个 species-level rows 后每样本总和约为 100%
      - pathway 只保留 493 个不含竖线且不属于 UNMAPPED/UNGROUPED/UNINTEGRATED 的 ordinary rows；重闭合只定义 annotated ordinary-pathway denominator
      - 主 CRC/control complete-case 集必须为 110 人（59 control、51 CRC），年龄、性别、BMI 与 number_reads 无缺失
      - species pseudo-count 固定 round(relative_fraction * number_reads)，逐单元记录为 reconstructed，不得命名为 observed count 或 raw read count
    common_failures:
      - 把 1019 个全分类级 rows 一起分析，导致每列和为 700% 并重复计算同一生物量
      - 把 stratified pathway 与 community pathway 混在同一 feature universe，或把删 special rows 后的 100% 称为完整功能解释率
      - 用全部 156 人做 CRC/control 二分类却没有明确处理 adenoma，或对 BMI 缺失者做结果驱动填补
      - 将 cMD counts convenience transformation 当成测序仪直接观测的 species reads
    outputs:
      - data/small/24-differential-abundance/species-relative-abundance.tsv.gz
      - data/small/24-differential-abundance/species-pseudocounts.tsv.gz
      - data/small/24-differential-abundance/pathway-relative-abundance.tsv.gz
      - data/small/24-differential-abundance/sample-metadata.tsv
      - data/small/24-differential-abundance/analysis-contract.tsv
      - data/small/24-differential-abundance/resource-manifest.tsv
      - data/small/24-differential-abundance/file-checksums.sha256
      - data/small/24-differential-abundance/data-NOTICE.txt
    method_basis:
      type: external-benchmark
      summary: >
        输入为 curatedMetagenomicData 3.12.0 对 ZellerG_2014 的统一
        MetaPhlAn3/HUMAnN3 重处理资源；sampleMetadata 提供独立受试者、CRC/adenoma/
        control、年龄、性别、BMI 和 read depth。准备步骤只定义分析 universe，
        不读取任何差异检验结果。
    references:
      - title: curatedMetagenomicData Bioconductor 3.19 package
        type: official-data-package
        url: https://bioconductor.org/packages/3.19/data/experiment/html/curatedMetagenomicData.html
      - title: Colorectal cancer detection from fecal microbiota
        type: application-paper
        url: https://doi.org/10.15252/msb.20145645
    assertions:
      - id: differential-input-manifest
        type: file_exists
        path: data/small/24-differential-abundance/resource-manifest.tsv
      - id: differential-input-species
        type: file_exists
        path: data/small/24-differential-abundance/species-relative-abundance.tsv.gz
      - id: differential-input-pathway
        type: file_exists
        path: data/small/24-differential-abundance/pathway-relative-abundance.tsv.gz
      - id: differential-input-pseudocount
        type: file_exists
        path: data/small/24-differential-abundance/species-pseudocounts.tsv.gz

  - id: validate-differential-abundance
    title: 验证第 24 篇 MaAsLin3、ANCOM-BC2 与 ALDEx2 差异分析合同
    goal: >
      在 110 个 ZellerG_2014 CRC/control complete cases 中，以 MaAsLin3 分开检验
      species 与 pathway 的 abundance、prevalence 和 joint association；再以
      ANCOM-BC2 与 ALDEx2 对 species pseudo-count 做方法敏感性审计，并把效应量、
      FDR、可估性、方向一致性和输入尺度边界写入独立结果表。
    rationale: >
      三种方法回答的问题、零值处理和效应尺度不同，命中集合不应被当成多数投票。
      先固定主方法、协变量、feature filter、FDR family 与 pseudo-count 限制，
      再运行模型，可以避免看到显著结果后改阈值、改分母或挑方法。
    inputs:
      - env/differential-abundance.yml
      - env/differential-abundance-linux-64.lock
      - env/install-differential-abundance-r.R
      - env/differential-abundance-r-packages.tsv
      - downloads/article24/maaslin3-3a194ece449ef249354df394b58bfe3e6f951ca3.tar.gz
      - data/small/24-differential-abundance/species-relative-abundance.tsv.gz
      - data/small/24-differential-abundance/species-pseudocounts.tsv.gz
      - data/small/24-differential-abundance/pathway-relative-abundance.tsv.gz
      - data/small/24-differential-abundance/sample-metadata.tsv
      - data/small/24-differential-abundance/analysis-contract.tsv
      - data/small/24-differential-abundance/resource-manifest.tsv
      - data/small/24-differential-abundance/file-checksums.sha256
      - data/small/24-differential-abundance/data-NOTICE.txt
      - scripts/validate_article24_differential_abundance.R
      - figures/24-zeller-fig1-original.png
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/24-differential-abundance" \
        "${RUN_ROOT}/figures"
      conda run -n metagenome-da-2026.07 \
        Rscript "${MANIFEST_DIR}/scripts/validate_article24_differential_abundance.R" \
          --project-root "${MANIFEST_DIR}" \
          --input-dir "${RUN_ROOT}/data/small/24-differential-abundance" \
          --output-dir "${RUN_ROOT}/results/24-differential-abundance" \
          --figure-dir "${RUN_ROOT}/figures" \
          --maaslin-archive "${RUN_ROOT}/downloads/article24/maaslin3-3a194ece449ef249354df394b58bfe3e6f951ca3.tar.gz"
    expected_outputs:
      - results/24-differential-abundance/validation-summary.json
      - results/24-differential-abundance/data-lineage.tsv
      - results/24-differential-abundance/design-balance.tsv
      - results/24-differential-abundance/feature-filter-audit.tsv
      - results/24-differential-abundance/original-marker-audit.tsv
      - results/24-differential-abundance/maaslin3-species.tsv.gz
      - results/24-differential-abundance/maaslin3-pathways.tsv.gz
      - results/24-differential-abundance/ancombc2-species.tsv.gz
      - results/24-differential-abundance/aldex2-species.tsv.gz
      - results/24-differential-abundance/cross-method-evidence.tsv
      - results/24-differential-abundance/sensitivity-audit.tsv
      - results/24-differential-abundance/interpretation-boundaries.tsv
      - results/24-differential-abundance/package-versions.tsv
      - results/24-differential-abundance/validation-audit.tsv
      - results/24-differential-abundance/validation.log
      - figures/24-zeller-marker-redraw.pdf
      - figures/24-zeller-marker-redraw.png
      - figures/24-zeller-marker-redraw.tiff
      - figures/24-maaslin3-two-part.pdf
      - figures/24-maaslin3-two-part.png
      - figures/24-maaslin3-two-part.tiff
      - figures/24-functional-associations.pdf
      - figures/24-functional-associations.png
      - figures/24-functional-associations.tiff
      - figures/24-method-concordance.pdf
      - figures/24-method-concordance.png
      - figures/24-method-concordance.tiff
    acceptance_checks:
      - 主分析单位固定为 110 个独立 subject；disease 参考水平固定 Control，模型同时包含 standardized age、gender、standardized BMI 与 standardized log10 reads
      - species 主 universe 固定为 relative abundance >0.0001 且 prevalence >=0.10，预期 212 features；pathway 主 universe 固定为 ordinary-closed abundance >0.00001 且 prevalence >=0.20，预期 394 features
      - MaAsLin3 固定 TSS、LOG、median_comparison_abundance TRUE、median_comparison_prevalence FALSE；abundance coefficient 必须解释为 log2 relative fold change，prevalence coefficient 必须解释为 presence log odds
      - disease-interest p 值在每个 feature space 与 model component 内单独 BH 校正；同时保留 package-reported q 值，不得选择更小者报告
      - prevalence 结论只允许进入每组至少 10 present 和 10 absent 的可估集合，预期 species 中 144 个；不满足者保留为 not estimable
      - ANCOM-BC2 固定 2.12.0、pseudo_sens TRUE、n_cl 1、BH FDR 与同一年龄/性别/BMI协变量；只读取 sensitivity-filter 后 robust disease coefficient
      - ALDEx2 固定 1.42.0、seed 20260724、128 Monte Carlo instances、all-features denominator 与 disease+age+gender+BMI model matrix；报告 CLR coefficient 与 BH FDR
      - cross-method 表必须保留各法效应尺度、方向、FDR 与 input scale；方法重叠只称 concordance，不称独立 replication 或 truth
      - 敏感性审计至少包含 MaAsLin3 median comparison off、20% species prevalence、去 BMI 的 114-sample model、三等级 ordered progression、ANCOM-BC2 no-filter 对照与 ALDEx2 denominator branch
      - 四张原创重绘图全部使用英文可见文字，同时导出 PDF、PNG 与 350 dpi LZW TIFF；所有随机过程固定 seed
    common_failures:
      - 把 prevalence association 与 non-zero abundance association 合并成一个方向，或只报告 joint q 值而隐藏两部分不一致
      - 把 MaAsLin3 median-null coefficient、ANCOM-BC2 log fold change 与 ALDEx2 CLR effect 当成同一数值尺度直接求平均
      - 对 212 个 species 与 394 个 pathways 混做一个 FDR family，或在观察结果后改变 prevalence/abundance filter
      - 把 pseudo-count 方法的显著性升级成绝对丰度证据，忽略其 total reads 来自全 metagenome 而非 taxon-assigned raw counts
      - 把 adenoma 作为 control 混入二分类主模型，或把缺失 BMI 样本静默删除而不报告 110/114 的变化
    outputs:
      - results/24-differential-abundance/validation-summary.json
      - results/24-differential-abundance/data-lineage.tsv
      - results/24-differential-abundance/design-balance.tsv
      - results/24-differential-abundance/feature-filter-audit.tsv
      - results/24-differential-abundance/original-marker-audit.tsv
      - results/24-differential-abundance/maaslin3-species.tsv.gz
      - results/24-differential-abundance/maaslin3-pathways.tsv.gz
      - results/24-differential-abundance/ancombc2-species.tsv.gz
      - results/24-differential-abundance/aldex2-species.tsv.gz
      - results/24-differential-abundance/cross-method-evidence.tsv
      - results/24-differential-abundance/sensitivity-audit.tsv
      - results/24-differential-abundance/interpretation-boundaries.tsv
      - results/24-differential-abundance/package-versions.tsv
      - results/24-differential-abundance/validation-audit.tsv
      - results/24-differential-abundance/validation.log
      - figures/24-zeller-marker-redraw.pdf
      - figures/24-zeller-marker-redraw.png
      - figures/24-zeller-marker-redraw.tiff
      - figures/24-maaslin3-two-part.pdf
      - figures/24-maaslin3-two-part.png
      - figures/24-maaslin3-two-part.tiff
      - figures/24-functional-associations.pdf
      - figures/24-functional-associations.png
      - figures/24-functional-associations.tiff
      - figures/24-method-concordance.pdf
      - figures/24-method-concordance.png
      - figures/24-method-concordance.tiff
    method_basis:
      type: external-benchmark
      summary: >
        Zeller et al. 2014 Figure 1E 与 Figure 4 锚定 CRC-associated species 的
        abundance/prevalence 变化和功能改变；当前分析使用 cMD 统一重处理后的
        MetaPhlAn3 species 与 HUMAnN3 MetaCyc pathway profiles重新估计，并以
        2026 年 MaAsLin3 两部分模型为主、ANCOM-BC2/ALDEx2 为明确受输入单位限制的
        sensitivity methods，不伪称逐值复现原论文 KEGG/CAZy pipeline。
