  - id: validate-metaphlan4-profile
    title: 验证第 15 篇 MetaPhlAn 4 marker、SGB 与丰度语义合同
    goal: >
      从 Meslier 71-strain MOCK1 run ERR9765746 经第 13 篇质控保留的
      99,991 个同步 read pairs 起步，使用 MetaPhlAn 4.2.5 与
      mpa_vJan26_CHOCOPhlAnSGB_202605 完整 marker 数据库实际生成
      mapout、relative-abundance/read-stat profile、species/SGB 表与 marker-support
      账本；另行比较 unclassified 分母、低丰度阈值与确定性深度
      敏感性，不把检出误写成绝对定量、活性或菌株证据。
    rationale: >
      MetaPhlAn 估计的是 clade-specific marker coverage 支持的相对丰度。
      MetaPhlAn 4.2 默认还会把未能由已报告 clades 解释的 reads 估为
      UNCLASSIFIED；加入 --skip_unclassified_estimation 后，数值改成已报告
      clades 内部的 100% 组成。两种分母、SGB 是否有可命名物种及
      marker breadth/depth 都必须显式保留，否则低丰度检出会被误当成
      稳定定量。
    inputs:
      - env/biobakery.yml
      - env/biobakery-linux-64.lock
      - data/small/13-source-manifest.tsv
      - data/small/13-qc-frozen/run-summary.json
      - data/small/15-source-manifest.tsv
      - data/small/15-database-manifest.tsv
      - data/small/15-metaphlan-frozen/run-summary.json
      - data/small/15-metaphlan-frozen/tool-versions.tsv
      - data/small/15-metaphlan-frozen/commands.sh
      - data/small/15-metaphlan-frozen/profile-all.tsv
      - data/small/15-metaphlan-frozen/profile-classified-only.tsv
      - data/small/15-metaphlan-frozen/species-profile.tsv
      - data/small/15-metaphlan-frozen/sgb-profile.tsv
      - data/small/15-metaphlan-frozen/marker-support.tsv
      - data/small/15-metaphlan-frozen/depth-sensitivity.tsv
      - data/small/15-metaphlan-frozen/threshold-sensitivity.tsv
      - data/small/15-metaphlan-frozen/database-files.sha256
      - data/small/15-metaphlan-frozen/file-checksums.sha256
      - data/small/15-data-NOTICE.txt
      - db/download_db.sh
      - scripts/run_article15_metaphlan4.sh
      - scripts/validate_article15_metaphlan4.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/15-metaphlan4" \
        "${RUN_ROOT}/figures"
      biobakery_prefix="${BIOBAKERY_ENV_PREFIX:-${HOME}/miniconda3/envs/metagenome-biobakery-2026.07}"
      "${biobakery_prefix}/bin/python" \
        "${MANIFEST_DIR}/scripts/validate_article15_metaphlan4.py" \
        --project-root "${MANIFEST_DIR}" \
        --environment-prefix "${biobakery_prefix}" \
        --output-dir "${RUN_ROOT}/results/15-metaphlan4" \
        --figure-dir "${RUN_ROOT}/figures"
    expected_outputs:
      - results/15-metaphlan4/validation-summary.json
      - results/15-metaphlan4/tool-audit.tsv
      - results/15-metaphlan4/source-audit.tsv
      - results/15-metaphlan4/database-audit.tsv
      - results/15-metaphlan4/profile-audit.tsv
      - results/15-metaphlan4/sgb-audit.tsv
      - results/15-metaphlan4/marker-audit.tsv
      - results/15-metaphlan4/sensitivity-audit.tsv
      - results/15-metaphlan4/validation.log
      - figures/15-metaphlan-composition.pdf
      - figures/15-metaphlan-composition.png
      - figures/15-metaphlan-composition.tiff
