      - figures/32-abundance-resource-audit.png
      - figures/32-abundance-resource-audit.tiff
    acceptance_checks:
      - 四个 ENA source archives 必须核对 bytes、MD5 与 SHA-256；Illumina 必须无放回同步抽取恰好 10000000 对并保存 pair-ID digest
      - fastp 后 R1/R2 必须逐条通过 FASTQ grammar、record/base、pair-ID hash 与 compressed SHA-256 审计，并与 fastp JSON 完全一致
      - S1、S2、作者仓库 commit、71-genome membership、9 个 taxonomy aliases 与 combined-reference sequence multiset 必须独立复核
      - 三条 SPAdes 分支必须读取同一份 fastp clean pairs；ONT/HiFi 分别通过 --nanopore/--pacbio，另保留 Flye long-only baselines
      - Polypolish 必须由 BWA-MEM -a 分别生成 R1/R2 all-per-read alignments，并同时保留 default 与 careful 分支
      - 两条 Polypolish 输出必须保留 ONT draft 的首字段 contig ID 集合及顺序，并在 FASTA 描述栏精确追加 polypolish 标记；序列变化、长度差及输出 SHA-256 必须独立复算
      - 七套 assemblies 必须统一到 >=1 kb，MetaQUAST 必须使用 71 references、500 bp minimum alignment 与 97% identity
      - --split-scaffolds 产生的 *_broken labels 必须只进入敏感性账本，七分支主表仍使用原始 assemblies
      - 每个 branch 必须有 71 行 per-genome 结果，并复算 >=90% recovery、>=99% operational full-genome threshold 与 abundance-bin medians
      - 组装、BWA、Polypolish 和 MetaQUAST 必须各有 exit 0 的 GNU time 资源记录
      - 四张图必须只含英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF
      - 验证 failed 必须为 0；结果不得写成平台单因素、普适 hybrid 赢家、抛光保证提升或完整基因组证明
    common_failures:
      - 把 short-read-first graph assembly 与 long-read-first post-polishing 混成同一种 hybrid 流程
      - 比例下采样得到接近而非恰好一千万 pairs，或 R1/R2 不同步
      - BWA 未加 -a、mates 未分别比对，导致 Polypolish repeat evidence 改变
      - 只比较 N50 或总体 genome fraction，不审计 mismatch、indel、misassembly 与低丰度成员
      - 把历史 ONT R9 的 polishing 结果外推为 R10.4.1 或 HiFi 的永久规则
      - 把 >=99% genome fraction 命名为无误差闭环 complete genome
