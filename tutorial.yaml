      - figures/35-mapping-policy-sensitivity.png
      - figures/35-mapping-policy-sensitivity.tiff
      - figures/35-unit-normalization-audit.pdf
      - figures/35-unit-normalization-audit.png
      - figures/35-unit-normalization-audit.tiff
      - figures/35-functional-aggregation.pdf
      - figures/35-functional-aggregation.png
      - figures/35-functional-aggregation.tiff
    method_basis:
      type: external-benchmark
      summary: >
        忠实保留 Delgado 与 Andersson 的 10,000-forward-read catalog mapping 逻辑，
        并在 Meslier 等 PRJEB52977 exact mocks 上增加全量双端 read ledger、显式
