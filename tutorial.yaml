      - figures/44-assembly-graph-audit.png
      - figures/44-assembly-graph-audit.tiff
      - figures/44-checkm-audit.pdf
      - figures/44-checkm-audit.png
      - figures/44-checkm-audit.tiff
    acceptance_checks:
      - 23 个 selected MAG 必须在 CheckM2、GUNC、CheckM1、domain 与 graph 表中逐一对应
      - MIMAG 必须得到 4 个 high-quality 与 19 个 medium-quality MAG
      - FASTG 节点必须通过 exact forward-sequence SHA-256 映射
      - 不得把组装图边界证据写成 circular genome 证明
      - 四张图必须同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 只用 CheckM2 完整度和污染率声明高质量 MAG
      - 忽略 GUNC、marker domain 或 rRNA/tRNA 证据
      - 把 graph adjacency 当作闭环或完整染色体证明
    outputs:
      - results/44-mag-qc-mimag-graph/validation-summary.json
      - results/44-mag-qc-mimag-graph/validation-checks.tsv
      - results/44-mag-qc-mimag-graph/validation.log
