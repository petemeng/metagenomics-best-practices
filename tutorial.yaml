      R_LIBS_USER="${MANIFEST_DIR}/.r-lib:${HOME}/R/library" \
      Rscript "${MANIFEST_DIR}/scripts/validate_article27_machine_learning.R" \
        --project-root "${RUN_ROOT}" \
        --input-dir "${RUN_ROOT}/data/small/27-machine-learning" \
        --output-dir "${RUN_ROOT}/results/27-machine-learning" \
        --figure-dir "${RUN_ROOT}/figures" \
        --chapter "${MANIFEST_DIR}/chapters/27-machine-learning-roc.qmd"
    expected_outputs:
      - results/27-machine-learning/validation-summary.json
      - results/27-machine-learning/outer-fold-assignments.tsv
      - results/27-machine-learning/outer-predictions.tsv.gz
      - results/27-machine-learning/sample-predictions.tsv
      - results/27-machine-learning/outer-fold-metrics.tsv
      - results/27-machine-learning/inner-tuning-audit.tsv.gz
      - results/27-machine-learning/preprocessing-audit.tsv
      - results/27-machine-learning/performance-summary.tsv
      - results/27-machine-learning/roc-curves.tsv
      - results/27-machine-learning/calibration-audit.tsv
      - results/27-machine-learning/model-comparison.tsv
      - results/27-machine-learning/permutation-importance-folds.tsv.gz
      - results/27-machine-learning/permutation-importance-summary.tsv
      - results/27-machine-learning/leakage-permutation-audit.tsv
      - results/27-machine-learning/leakage-permutation-summary.tsv
      - results/27-machine-learning/figure-audit.tsv
      - results/27-machine-learning/validation-checks.tsv
      - results/27-machine-learning/validation.log
      - figures/27-zeller-fig1-original.png
      - figures/27-nested-roc.pdf
      - figures/27-nested-roc.png
      - figures/27-nested-roc.tiff
      - figures/27-model-performance.pdf
      - figures/27-model-performance.png
      - figures/27-model-performance.tiff
      - figures/27-permutation-importance.pdf
      - figures/27-permutation-importance.png
      - figures/27-permutation-importance.tiff
      - figures/27-leakage-permutation-audit.pdf
      - figures/27-leakage-permutation-audit.png
      - figures/27-leakage-permutation-audit.tiff
    acceptance_checks:
      - 每名受试者每个算法必须恰有 5 个 OOF predictions；50 个外层模型均不得读取 outer-test 信息
      - prevalence、最大丰度、log transform 与全部 hyperparameter selection 必须在训练 folds 内拟合
      - 性能必须同时含 subject-level AUROC/DeLong CI、AUPRC、Brier、固定 0.5 阈值与五个 calibration bins
      - 两算法差异必须用 2,000 次 paired subject bootstrap；不得把重复 OOF rows 当独立样本
      - 重要性必须来自 outer-test feature permutation；不得用 impurity importance 代替
      - 安全置换分支 median AUROC 必须接近 0.5，故意泄漏分支必须显示由全局 label selection 造成的 null inflation
      - 四张重绘图必须使用英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 在全数据上做 feature selection、normalization 或 batch correction 后才切 folds
      - 看完 outer-test 结果再挑算法、超参数或 cutoff
      - 把 570 条重复 OOF predictions 当成 570 名独立受试者
      - 把 predictive importance 写成差异效应、机制或因果结论
      - 将单队列内部验证写成可部署的临床诊断性能
