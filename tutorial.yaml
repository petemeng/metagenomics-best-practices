  - id: validate-kraken2-database-confidence
    title: 验证第 17 篇 Kraken2 数据库、confidence 与非预期调用控制合同
    goal: >
      复用 Meslier 71-strain MOCK1 的 99,991 个 clean read pairs 与公开人类 WGS
      ERR194147 的 20,000-pair 方法对照，在同一 2026-06-26 release 的
      Standard-8、Standard-16 和 PlusPF-8 上执行固定参数矩阵。主矩阵比较
      confidence 0、0.05、0.10、0.20、0.50；补充矩阵在 Standard-16、
      confidence 0.10 下比较 minimum-hit-groups 1、2、3、4，并使用与各输入
      read length 匹配的 Bracken distribution 生成 species-level 审计。
    rationale: >
      数据库内容、hash-table cap、confidence fraction 与 minimum hit groups 是四个
      不同控制轴。MOCK 真值还必须先与实际数据库参考覆盖相交，否则数据库没有
      same-species reference 时的漏检会被错误归因于分类器；公开人类 WGS 只提供
      non-human call 的方法对照边界，不代表无菌阴性对照或实验室污染真值。
    inputs:
      - env/kraken.yml
      - env/kraken-linux-64.lock
      - data/small/13-qc-frozen/run-summary.json
      - data/small/14-host-removal-frozen/run-summary.json
