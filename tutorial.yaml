  - id: validate-gene-abundance
    title: 验证第 35 篇 reads 回比、丰度单位与一对多功能汇总合同
    goal: >
      将两个 checksum-identified clean mock metagenomes 回比第 34 篇 93,782-gene
      目录，分开 raw mapping 与 assignable reads，建立 raw count、CPM、RPKM、TPM
      以及 UniRef90-to-MetaCyc reaction 的守恒账本。
    rationale: >
      Gene abundance 的数值同时依赖 read/fragment 单位、multi-mapping、alignment
      门槛、长度校正、library denominator、数据库版本和一对多 crosswalk。只有保留
      逐层分母与 missingness buckets，才能避免把 mapping rate、TPM 或复制后的功能
      总量误写成 observed reads 或 absolute abundance。
    inputs:
      - env/gene-abundance.yml
      - env/gene-abundance-linux-64.lock
      - data/small/34-nonredundant-gene-catalog-frozen
      - data/small/35-gene-abundance-frozen
      - chapters/35-gene-abundance.qmd
      - scripts/download_article35_gene_abundance_sources.sh
      - scripts/prepare_article35_gene_abundance_inputs.py
      - scripts/parse_article35_sam.py
      - scripts/run_article35_gene_abundance.py
      - scripts/summarize_article35_gene_abundance.py
      - scripts/freeze_article35_gene_abundance.py
      - scripts/validate_article35_gene_abundance.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/35-gene-abundance" \
        "${RUN_ROOT}/figures" \
        "${RUN_ROOT}/.cache/article35-matplotlib"
      MPLCONFIGDIR="${RUN_ROOT}/.cache/article35-matplotlib" \
      PYTHONNOUSERSITE=1 \
      PYTHONPATH= \
      python3 "${MANIFEST_DIR}/scripts/validate_article35_gene_abundance.py" \
        --project-root "${MANIFEST_DIR}" \
        --frozen-dir "${MANIFEST_DIR}/data/small/35-gene-abundance-frozen" \
        --output-dir "${RUN_ROOT}/results/35-gene-abundance" \
        --figure-dir "${RUN_ROOT}/figures" \
        --chapter "${MANIFEST_DIR}/chapters/35-gene-abundance.qmd"
    expected_outputs:
      - results/35-gene-abundance/checksum-audit.tsv
      - results/35-gene-abundance/mapping-audit.tsv
      - results/35-gene-abundance/functional-audit.tsv
      - results/35-gene-abundance/chapter-audit.tsv
      - results/35-gene-abundance/image-audit.tsv
      - results/35-gene-abundance/validation-checks.tsv
      - results/35-gene-abundance/validation-summary.json
      - results/35-gene-abundance/validation.log
      - figures/35-read-to-gene-ledger.pdf
      - figures/35-read-to-gene-ledger.png
      - figures/35-read-to-gene-ledger.tiff
      - figures/35-mapping-policy-sensitivity.pdf
      - figures/35-mapping-policy-sensitivity.png
      - figures/35-mapping-policy-sensitivity.tiff
      - figures/35-unit-normalization-audit.pdf
      - figures/35-unit-normalization-audit.png
      - figures/35-unit-normalization-audit.tiff
      - figures/35-functional-aggregation.pdf
      - figures/35-functional-aggregation.png
      - figures/35-functional-aggregation.tiff
    acceptance_checks:
      - 四份 clean FASTQ 必须逐个匹配第 30 篇 frozen lineage，输入必须为 3,999,706 与 3,999,776 reads
      - nucleotide、protein 与 metadata 必须共享 93,782 个 catalog IDs，长度与第 34 篇 frozen metadata 一致
      - 论文兼容分支必须固定 seqtk -s100、10,000 forward reads、Bowtie2 local 与 HTSeq MAPQ 0 逻辑
      - 主分支必须把 R1/R2 分别作为 reads，固定 Bowtie2 --very-sensitive-local -k 2、seed 20260735、MAPQ 10、identity 95% 与 query coverage 80%
      - MOCK1/MOCK2 主分支必须分配 2,784,234/2,777,443 reads，且 input = assigned + filtered mapped + unmapped
      - Raw count 总和必须等于 assigned reads；CPM 与 TPM 必须各自闭合到 1,000,000，RPKM 不得被强制闭合或伪称 raw counts
      - DIAMOND 必须固定 2.2.4、--iterate faster --sensitive、UniRef90 v201901b、50% identity、80% query coverage、E-value 1e-5 与 deterministic best-hit policy
      - MetaCyc reaction crosswalk 必须固定 HUMAnN 3.9 mapping SHA-256；NO_UNIREF90_HIT 与 UNIREF90_NO_REACTION 必须保留
      - equal-split 主策略必须守恒；copy-full sensitivity 必须报告总量膨胀，不得解释为新增 reads
      - 四张图必须只含英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF
      - 验证 failed 必须为 0；不得把两套 mocks 当生物学重复、TPM 当 absolute abundance、同源目录校准当独立预测，或把 partial ORF hit 当作完整功能证据
    common_failures:
      - 只报 overall mapping rate，不报告 assigned denominator 与 filtered mapped reads
      - 在 paired FASTQ 上按 reads 计数，却把结果口头改称 fragments 或 read pairs
      - Bowtie2 默认只报一个位置时假定 multi-mapping 已被 HTSeq 自动解决
      - 将 RPKM/TPM 四舍五入后送入 count-based differential model
      - 删除 unannotated genes 后仍把剩余功能表称为完整 reads 分母
      - 将一个 gene 的完整 abundance 复制到多个 reactions 后忽略总量膨胀
      - 将参与 catalog construction 的两个 mocks 写成外部 validation cohort
    outputs:
