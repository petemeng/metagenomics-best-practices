  - id: validate-read-qc-fastp
    title: 验证第 13 篇 FastQC、fastp 与 MultiQC 读长质控合同
    goal: >
      从 Meslier 71-strain MOCK1 的官方 ENA paired-end run ERR9765746
      确定性取前 100,000 个同步 read pairs，先运行 FastQC，再以显式、保守的
      fastp 参数完成 adapter/quality/length filtering，随后对 clean reads
      再跑 FastQC 并用 MultiQC 汇总；原始和 clean FASTQ 留在 scratch，
      只固化报告、日志、checksum、审计表和出版图。
    rationale: >
      FastQC 的 PASS/WARN/FAIL 是诊断信号，不是自动删样本指令；fastp 的
      passed-filter 数也不能代替 R1/R2 同步、read-pair 守恒和下游敏感性检查。
      把输入谱系、原始诊断、参数、损失原因、clean 诊断和汇总报告分别验收，
      才能防止“报告变绿”取代真实的预处理决策。
    inputs:
      - env/read-qc.yml
      - env/read-qc-linux-64.lock
      - data/small/13-source-manifest.tsv
      - data/small/13-qc-frozen/run-summary.json
      - data/small/13-qc-frozen/tool-versions.tsv
      - data/small/13-qc-frozen/commands.sh
      - data/small/13-qc-frozen/file-checksums.sha256
      - data/small/13-qc-frozen/fastp/ERR9765746_fastp.json
      - data/small/13-qc-frozen/raw_fastqc/ERR9765746_prefix100k_R1_fastqc.zip
      - data/small/13-qc-frozen/raw_fastqc/ERR9765746_prefix100k_R2_fastqc.zip
      - data/small/13-qc-frozen/clean_fastqc/ERR9765746_clean_R1_fastqc.zip
      - data/small/13-qc-frozen/clean_fastqc/ERR9765746_clean_R2_fastqc.zip
      - data/small/13-qc-frozen/multiqc/13-multiqc-report.html
      - data/small/13-data-NOTICE.txt
      - scripts/build_article13_fastq_subset.py
      - scripts/run_article13_read_qc.sh
      - scripts/validate_article13_read_qc.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/13-read-qc-fastp" \
        "${RUN_ROOT}/figures"
      read_qc_prefix="${READ_QC_ENV_PREFIX:-${HOME}/miniconda3/envs/metagenome-read-qc-2026.07}"
      "${read_qc_prefix}/bin/python" \
        "${MANIFEST_DIR}/scripts/validate_article13_read_qc.py" \
        --project-root "${MANIFEST_DIR}" \
        --environment-prefix "${read_qc_prefix}" \
        --output-dir "${RUN_ROOT}/results/13-read-qc-fastp" \
        --figure-dir "${RUN_ROOT}/figures"
    expected_outputs:
      - results/13-read-qc-fastp/validation-summary.json
      - results/13-read-qc-fastp/tool-audit.tsv
      - results/13-read-qc-fastp/source-audit.tsv
      - results/13-read-qc-fastp/fastp-audit.tsv
      - results/13-read-qc-fastp/fastqc-module-audit.tsv
      - results/13-read-qc-fastp/multiqc-audit.tsv
      - results/13-read-qc-fastp/validation.log
      - figures/13-per-cycle-quality.pdf
      - figures/13-per-cycle-quality.png
      - figures/13-per-cycle-quality.tiff
      - figures/13-read-pair-fate.pdf
      - figures/13-read-pair-fate.png
      - figures/13-read-pair-fate.tiff
      - figures/13-fastqc-module-states.pdf
      - figures/13-fastqc-module-states.png
      - figures/13-fastqc-module-states.tiff
    acceptance_checks:
      - 环境入口实际报告 FastQC 0.12.1、fastp 1.3.6 与 MultiQC 1.35，完整 transaction 进入 Linux-64 explicit lock
      - source manifest 固定 PRJEB52977、SAMEA14435832、ERR9765746、两条官方 ENA URL、完整源文件 MD5 和 compressed bytes
      - 确定性子集恰含 100,000 个 R1/R2 records，normalized IDs 与顺序完全一致，并记录每端未压缩 FASTQ SHA-256
      - 原始和 clean FASTQ 不进入 Git；一次性 run 只固化工具输出、日志、checksum 和小型审计数据
      - 四个 FastQC zip 均完整、每个包含 100,000 或 retained records 的 Basic Statistics 与 11 个 module states
      - fastp 使用 paired-end、4 threads、PE adapter detection、Q20/40%、N≤5、length≥50，且不默认启用 sliding-window trimming、overlap correction、deduplication 或 low-complexity filtering
      - fastp 的 input、passed、low-quality、too-many-N、too-short 和 too-long read counts 完整守恒，clean R1/R2 仍同步
      - MultiQC 同时识别四个 FastQC reports 与一个 fastp report，且样本名不会因 before/after 冲突而覆盖
      - 所有固化文件通过 SHA-256 清单，常规 QA 不访问 ENA 网络
      - 公开 text reports 中的 project、scratch、environment 与 transient temporary paths 均规范化为可移植 placeholder
      - 三张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 只看 MultiQC 总览颜色，不打开 FastQC module 或 fastp JSON 核对原因
      - 把 100,000-pair 文件前缀当作全量 run 的随机代表样本或通用过滤阈值
      - R1/R2 分别截取却不核对 normalized read IDs 与顺序
      - 同时启用激进 5'/3' sliding-window trimming、length filter 和 correction，却不做参数敏感性分析
      - 把 FastQC duplication、GC 或 sequence-content WARN 直接解释为污染或测序失败
      - 把 fastp 的 reads 计数误写成 read pairs，或忽略一个 mate 失败导致整对剔除
      - 让 MultiQC before/after 文件使用同名 sample，导致后读入的记录覆盖先读入的记录
    outputs:
      - results/13-read-qc-fastp/validation-summary.json
      - results/13-read-qc-fastp/tool-audit.tsv
      - results/13-read-qc-fastp/source-audit.tsv
      - results/13-read-qc-fastp/fastp-audit.tsv
      - results/13-read-qc-fastp/fastqc-module-audit.tsv
      - results/13-read-qc-fastp/multiqc-audit.tsv
      - results/13-read-qc-fastp/validation.log
      - figures/13-per-cycle-quality.pdf
      - figures/13-per-cycle-quality.png
      - figures/13-per-cycle-quality.tiff
      - figures/13-read-pair-fate.pdf
      - figures/13-read-pair-fate.png
      - figures/13-read-pair-fate.tiff
      - figures/13-fastqc-module-states.pdf
      - figures/13-fastqc-module-states.png
      - figures/13-fastqc-module-states.tiff
    method_basis:
      type: external-benchmark
      summary: >
        复用 Meslier et al. 2022 的同一份 MOCK1 Illumina paired-end run；
        一次性 streaming builder 固定文件前缀并在本机实际运行三种工具，
        日常发布 QA 只检查 SHA-256 锁定的完整报告和机器可读输出。
