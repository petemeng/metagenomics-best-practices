      - 1,000 次 BroadRegion 分层 bootstrap 必须全部成功，并分别报告 0.70 与 0.80 edge-support 阈值
      - Zi-Pi 必须用 unweighted Louvain module 计算；若没有达到 Zi hub 阈值的节点，正文必须如实报告 0，而不能放宽阈值制造 hub
      - topology-priority gate 只能产生实验优先候选，不得称为 ecological keystone；候选数必须为 5
      - modularity 与 transitivity 必须和 1,000 个 degree-preserving rewires 比较；adaptive degree deletion 必须与 1,000 个随机顺序比较
      - 必须报告 pseudocount、未校正、MB OR、relaxed/strict filter 与 StARS 0.025/0.10 的敏感性结果
      - 五张重绘图必须使用英文可见文字并同时导出 PDF、PNG 与 350 dpi LZW TIFF；论文原图版权边界必须显式保留
      - 验证总数必须为 82、failed 必须为 0；输入 checksum 必须为 5 项，生成图文件必须为 15 个
    common_failures:
      - 把 graphical-lasso 条件关联写成直接微生物互作、因果边或共培养证据
      - 用同一张网络定义 hub、检验 hub 并宣称 keystone，未做稳定性和扰动审计
      - 忽略环境混杂、组成闭合、零值处理或正则化选择对边集的影响
      - 将删除模拟的拓扑碎裂外推为真实生态系统功能崩溃
