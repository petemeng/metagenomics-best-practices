  - id: validate-functional-profile-normalization
    title: 验证第 20 篇功能谱归一化、特殊行、coverage 与零值合同
    goal: >
      从第 19 篇 checksum-locked HUMAnN 3.9 native tables 出发，在 gene family、
      reaction 与 pathway abundance 三个 feature spaces 内分别复算 CPM/relative
      abundance、community/levelwise 和 special y/n 共 24 个分支；同时用
      curatedMetagenomicData 3.12.0 的 AsnicarF_2017 pathway abundance/coverage
      真实多样本对象审计 prevalence、zero 与 pseudocount 敏感性。pathway coverage
      始终保留 0–1 evidence score，不进入 abundance renormalization。
    rationale: >
      HUMAnN 的归一化分母取决于 feature space、stratification level 和是否保留
      special rows。删去 UNMAPPED、UNINTEGRATED 或 UNGROUPED 后重新闭合，只改变
      条件分母，并不能证明被删除质量已经得到功能解释。coverage、abundance 和
      taxon contribution 也回答不同问题；将它们混在一张表或先加 pseudocount 再
      任意筛选会制造不可复核的生物结论。
    inputs:
      - env/biobakery.yml
      - env/biobakery-linux-64.lock
      - env/renv.lock
      - data/small/19-humann3-frozen/run-summary.json
      - data/small/19-humann3-frozen/genefamilies-rpk.tsv
      - data/small/19-humann3-frozen/reactions-rpk.tsv
