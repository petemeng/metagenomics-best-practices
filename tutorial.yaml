  - id: validate-metagenomic-table-semantics
    title: 验证第 21 篇宏基因组表格单位、分母、零值与 genome-equivalent 合同
    goal: >
      从第 15–20 篇 checksum-locked 的 MetaPhlAn、Bracken、HUMAnN 与
      curatedMetagenomicData 表格出发，为每一列建立 measurement/feature/denominator/
      closure/zero/transformation data dictionary；再以同一 99,991-pair MOCK1 的
      MicrobeCensus 实跑结果校准 average genome size、genome equivalents 与 RPKG，
      阻止把名称相近但统计含义不同的表直接互换。
    rationale: >
      宏基因组表里的整数未必是观测 counts，百分比未必共享同一分母，coverage
      通常不需要闭合，HUMAnN CPM 是 length-corrected copies per million 而非 raw
      counts per million。genome equivalents 又是 total bp/estimated AGS 的文库覆盖
      标尺，不是细胞数。只有把测量对象和分母写进数据谱系，后续多样性、差异和
      机器学习才不会从错误输入得到看似精确的结果。
