environment:
  runtime: host
  pipeline_version: 0.1.0-pilot
  setup:
    - 第 01 篇固定使用 R 4.4.1 与 Quarto 1.9.38
    - 第 09 篇固定 metagenome-platform-smoke-2026.07，包含 Python 3.12.13、SeqKit 2.10.0、pigz 2.8 与 Matplotlib 3.10.5
    - 第 10 篇复用 metagenome-platform-smoke-2026.07 执行本地调度语义 smoke；目标 HPC 的 SLURM 与 Apptainer 版本必须另行记录
    - 第 11 篇固定 metagenome-biobakery-2026.07 与 metagenome-assembly-2026.07，并以 Linux-64 explicit locks 保存完整 transaction
    - 第 12 篇固定 R 4.4.1、Bioconductor 3.19 与 185-record env/renv.lock，并把 ExperimentHub cache 放进可写项目路径
    - 第 13 篇固定 metagenome-read-qc-2026.07，包含 FastQC 0.12.1、fastp 1.3.6 与 MultiQC 1.35
    - 第 14 篇固定独立 metagenome-host-removal-2026.07 环境，直接锁定 Hostile 2.0.2、Bowtie2 2.5.4、Samtools 1.21、fastp 1.3.6 与 SeqKit 2.10.0
    - 第 15 篇复用已实际安装的 metagenome-biobakery-2026.07，固定 MetaPhlAn 4.2.5、Bowtie2 2.5.5 与 mpa_vJan26_CHOCOPhlAnSGB_202605，并将数据库置于 conda 环境之外
    - 第 16–17 篇复用 metagenome-kraken-2026.07，固定 Kraken2 2.17.1、Bracken package 3.1p1 与 release-specific Kraken 数据库；数据库 archive/index 留在仓库外
    - 第 18 篇新增 metagenome-motus-2026.07，固定 mOTUs 4.1.0、BWA 0.7.19、VSEARCH 2.31.0 与 database 4.1；archive/index/BAM/MGC 留在仓库外
    - 第 19–21 篇复用 metagenome-biobakery-2026.07 的 Python/R 依赖与 HUMAnN 3.9；第 20–21 篇另以 R 4.4.1、Bioconductor 3.19 与 curatedMetagenomicData 3.12.0 固定真实 pathway cohort，第 21 篇一次性 MicrobeCensus 运行使用固定官方 source tag
    - 第 24 篇统计方法在 metagenome-da-2026.07 独立环境中真实执行，固定 R 4.5.2、maaslin3 1.5.3 release commit 3a194ece449ef249354df394b58bfe3e6f951ca3、ANCOMBC 2.12.0 与 ALDEx2 1.42.0；Quarto 常规渲染读取 checksum-locked 结果并重画图片
    - 第 25 篇使用 R 4.4.1 与 curatedMetagenomicData 3.12.0 准备 HMP_2012 rank-specific profiles；常规 QA 只读取 checksum-locked 小表并重算 Wilson、bootstrap、阈值网格与四张图
    - 第 26 篇使用 R 4.4.1、Bioconductor 3.19 与 curatedMetagenomicData 3.12.0 构建资源目录和真实三队列合并对象；常规 QA 读取 16 个 checksum-locked payloads 并执行 157 项检查
    - 第 27 篇使用 R 4.4.1、ranger 0.16.0、xgboost 1.7.8.1 与 pROC 1.18.5；完整模型 QA 固定单线程，网页渲染只读取 checksum-locked 输入和逐折结果
    - 第 28 篇使用 R 4.4.1、glmnet 4.1.8、metafor 4.6.0 与 pROC 1.18.5；env/cross-cohort-renv.lock 固定 51 条依赖记录，完整 QA 单线程复算 LODO、meta-analysis、bootstrap 与五张图
    - 第 29 篇使用 R 4.4.1、huge 1.5.1、igraph 2.1.2 与 ggplot2 3.5.2；env/network-renv.lock 固定依赖，完整 QA 重算网络、bootstrap、零模型、删除曲线与五张图
    - 第 30 篇使用 metagenome-assembly-2026.07 的 Python 3.10.20、MEGAHIT 1.2.9、SPAdes 4.3.0 与 Bowtie2 2.5.5，并复用 metagenome-read-qc-2026.07 的 fastp 1.3.6；一次性运行记录六次 assembly、六次 indexing、八次 mapping 与两次 QC 的 wall time/peak RSS
    - 第 31 篇使用 metagenome-long-read-2026.07 的 Python 3.10.20、Flye 2.9.6、metaMDBG 1.4、minimap2 2.31、Samtools 1.23.1、SeqKit 2.11.0 与源码锁定的 hifiasm-meta 0.3.5-r81；一次性运行记录全部 assembly、base-level mapping、junction mapping attempts 的 wall time/peak RSS
    - 第 32 篇使用 metagenome-hybrid-2026.07 的 Python 3.10.20、fastp 1.3.6、SPAdes 4.3.0、BWA 0.7.19、Polypolish 0.6.1 与 MetaQUAST 5.3.0（bundled minimap2 2.28-r1209）；一次性运行记录七分支 assembly、all-alignment polishing、71-reference evaluation 与 wall time/peak RSS
    - 第 33 篇复用 metagenome-hybrid-2026.07 的 Python 3.10.20 与 QUAST/MetaQUAST 5.3.0（bundled minimap2 2.28-r1209）；一次性运行记录 17 分支 reference-free QUAST、71/87/87-reference MetaQUAST 与 wall time/peak RSS
    - 第 34 篇使用 metagenome-gene-catalog-2026.07 的 Python 3.10.14、Prodigal 2.6.3、MMseqs2 9.d36de、CD-HIT 4.8.1、SeqKit 2.11.0 与 Linux-64 explicit lock；一次性运行记录 193 个 ORF calling、clustering、truth-search 与转换步骤的 wall time/peak RSS
    - 第 35 篇使用 metagenome-gene-abundance-2026.07 的 Python 3.10.20、Bowtie2 2.5.5、SAMtools 1.23.1、HTSeq 2.1.2、seqtk 1.5、DIAMOND 2.2.4、NumPy 2.2.6、Matplotlib 3.10.9、Pillow 12.3.0 与 Linux-64 explicit lock；一次性运行记录 index、论文兼容分支、两次全量 mapping 与 UniRef90 annotation 的 wall time/peak RSS
    - 第 36 篇使用 metagenome-eggnog-2026.07 的 Python 3.11.9、eggNOG-mapper 2.1.15、eggNOG 5.0.2、DIAMOND 2.0.15、NumPy 2.4.6、Matplotlib 3.10.1、Pillow 10.3.0 与 Linux-64 explicit lock；全量一次性运行 13:08.52，主分支峰值 RAM 7.14 GiB
    - 第 37 篇使用 metagenome-cazyme-2026.07、dbCAN 5.2.9、DIAMOND 2.2.4 与 Linux-64 explicit lock；常规 QA 只审计 checksum-locked frozen ledger 并重画四张图
    - 第 38 篇使用 metagenome-resistome-2026.07、RGI 6.0.8、CARD 4.0.1、DIAMOND 2.2.4、Prodigal 2.6.3 与 Linux-64 explicit lock；DeepARG 仅保留隔离 legacy sensitivity 边界
    - 第 39 篇使用 metagenome-virulome-2026.07、ABRicate 1.4.0、BLAST+ 2.17.0 与 Linux-64 explicit lock；VFDB core/full databases 保存在环境外并锁定序列 checksum
    - 第 40 篇分别锁定 antiSMASH 8.0.4 与 GECCO 0.10.3 环境；PFAM 35.0、MIBiG 4.0 与 MITE 1.3 数据库保存在环境外，八个真实工具分支一次性运行并保存 wall time/peak RSS
    - R 包由 env/renv.lock 固定；后续 CheckM2、GUNC、GTDB-Tk 与 dRep 使用各自隔离环境
    - 上游大型数据库与容器镜像不进入 Git，版本和 checksum 记录在 db manifest
  tools:
    - name: Rscript
      version_command: Rscript --version
    - name: python3
      version_command: python3 --version
    - name: quarto
      version_command: quarto --version
literature_review:
  summary: >
    开篇以 Quince 和 Knight 的方法边界、iHMP 的多组学证据层级，以及 Wirbel
    CRC 跨队列研究的真实队列设计为核心。DNA 层结果统一表述为分类、基因和
    代谢潜力，不把存在误写为表达、通量、致病或因果。
  papers:
    - title: Shotgun metagenomics, from sampling to analysis
      journal: Nature Biotechnology
      year: 2017
      relevance: >
        界定 shotgun metagenomics 的 mapping-based、assembly-based、功能与菌株分析能力及局限。
      url: https://doi.org/10.1038/nbt.3935
    - title: Best practices for analysing microbiomes
      journal: Nature Reviews Microbiology
      year: 2018
      relevance: >
        支持从科学问题选择测量技术，并区分标记基因推断、shotgun DNA 与多组学证据。
      url: https://doi.org/10.1038/s41579-018-0029-9
    - title: The Integrative Human Microbiome Project
      journal: Nature
      year: 2019
      relevance: >
        说明宏基因组需要与转录、蛋白、代谢和宿主层联合，才能接近动态机制解释。
      url: https://doi.org/10.1038/s41586-019-1238-8
    - title: Meta-analysis of fecal metagenomes reveals global microbial signatures that are specific for colorectal cancer
      journal: Nature Medicine
      year: 2019
      relevance: >
        提供第 01 篇真实队列元数据，并为 CRC read-based 发表闭环和 LODO 外部验证定锚。
      url: https://doi.org/10.1038/s41591-019-0406-6
    - title: Minimum information about a single amplified genome and a metagenome-assembled genome
      journal: Nature Biotechnology
      year: 2017
      relevance: >
        界定 MAG 质量与报告边界，防止把任何分箱结果直接称为高质量基因组。
      url: https://doi.org/10.1038/nbt.3893
    - title: "Nonpareil 3: Fast Estimation of Metagenomic Coverage and Sequence Diversity"
      journal: mSystems
      year: 2018
      relevance: >
        为第 04 篇提供数据库无关的 abundance-weighted coverage 定义、paired-end
        输入边界、确定性 seed 与真实 Lake Lanier 饱和数据。
      url: https://doi.org/10.1128/mSystems.00039-18
    - title: The impact of sequencing depth on the inferred taxonomic composition and AMR gene content of metagenomic samples
      journal: Environmental Microbiome
      year: 2019
      relevance: >
        证明同一批深测序样本中 taxonomy、AMR gene-family 和 AMR allele
        的深度需求相差两个数量级，不能使用通用 reads 阈值。
      url: https://doi.org/10.1186/s40793-019-0347-1
    - title: Towards standards for human fecal sample processing in metagenomic studies
      journal: Nature Biotechnology
      year: 2017
      relevance: >
        为第 05 篇提供 21 种粪便 DNA 提取方案的系统比较、Phase III
        cellular mock 设计与已知 FACS cell composition。
      url: https://doi.org/10.1038/nbt.3960
    - title: Consistent and correctable bias in metagenomic sequencing experiments
      journal: eLife
      year: 2019
      relevance: >
        定义 multiplicative relative efficiency 和 pairwise bias，并提供
        Costea H/Q/W 三种提取协议的可复算 profiles 与真值。
      url: https://doi.org/10.7554/eLife.46923
    - title: Quantitative microbiome profiling links gut community variation to microbial load
      journal: Nature
      year: 2017
      relevance: >
        证明健康人粪便 microbial load 可相差约十倍，说明 relative profile
        不能替代 cells-per-mass 的量化尺度。
      url: https://doi.org/10.1038/nature24460
    - title: synDNA - a Synthetic DNA Spike-in Method for Absolute Quantification of Shotgun Metagenomic Sequencing
      journal: mSystems
      year: 2022
      relevance: >
        为第 05 篇提供多 GC synthetic DNA calibration 与八菌商业 DNA mock
        的 cell-composition benchmark。
      url: https://doi.org/10.1128/msystems.00447-22
    - title: Improving saliva shotgun metagenomics by chemical host DNA depletion
      journal: Microbiome
      year: 2018
      relevance: >
        为第 06 篇提供 8 名受试者、每方法 3 个 aliquots 的唾液配对宿主耗竭
        benchmark，以及 wet-lab depletion 对有效测序容量的真实锚点。
      url: https://doi.org/10.1186/s40168-018-0426-3
    - title: Saponin treatment for eukaryotic DNA depletion alters the microbial DNA profiles by reducing the abundance of Gram-negative bacteria in metagenomics analyses
      journal: Microbiome Research Reports
      year: 2024
      relevance: >
        用单份痰液的剂量系列提示宿主比例最低不等于微生物组成最可信，并限定
        该结果不能外推为人群最佳 saponin 浓度。
      url: https://doi.org/10.20517/mrr.2023.02
    - title: "Hostile: accurate decontamination of microbial host sequences"
      journal: Bioinformatics
      year: 2023
      relevance: >
        支持第 06 篇当前 paired-read 计算去宿主、完整人类参考、masked index
        与 microbial-retention sensitivity 的实现边界。
      url: https://doi.org/10.1093/bioinformatics/btad728
    - title: Reconstruction of the personal information from human genome reads in gut metagenome sequencing data
      journal: Nature Microbiology
      year: 2023
      relevance: >
        证明过滤后少量残留人源 reads 仍可能暴露个体信息，因此 filtered FASTQ
        不能因宿主比例低而自动转为开放数据。
      url: https://doi.org/10.1038/s41564-023-01381-3
    - title: Reagent and laboratory contamination can critically impact sequence-based microbiome analyses
      journal: BMC Biology
      year: 2014
      relevance: >
        为第 07 篇提供真实 S. bongori shotgun dilution 与四种 extraction kits，
        证明低生物量时 reagent background 可压过目标信号且具有 kit-specific profile。
      url: https://doi.org/10.1186/s12915-014-0087-z
    - title: Simple statistical identification and removal of contaminant sequences in marker-gene and metagenomics data
      journal: Microbiome
      year: 2018
      relevance: >
        定义 decontam 的 frequency、prevalence 与 combined 证据，并提供第 07 篇
        可执行的真实 MUClite 对照对象。
      url: https://doi.org/10.1186/s40168-018-0605-2
    - title: Characterization and remediation of sample index swaps by non-redundant dual indexing on massively parallel sequencing platforms
      journal: BMC Genomics
      year: 2018
      relevance: >
        为第 07 篇提供异质 pooled runs 中 0.2–6% index swapping 的条件性实测范围，
        并支持用 unique dual indexes 与 unexpected index pairs 独立审计。
      url: https://doi.org/10.1186/s12864-018-4703-0
    - title: Benchmarking second and third-generation sequencing platforms for microbial metagenomics
      journal: Scientific Data
      year: 2022
      relevance: >
        为第 08 篇提供同一 71-strain MOCK1 的 Illumina、historical ONT R9 与
        PacBio CCS run、mapping 和 platform-specific assembly benchmark。
      url: https://doi.org/10.1038/s41597-022-01762-z
    - title: Extending and improving metagenomic taxonomic profiling with uncharacterized species using MetaPhlAn 4
      journal: Nature Biotechnology
      year: 2023
      relevance: >
        定义第 15 篇的 clade-specific marker、known/unknown species-level
        genome bins、SGB-resolved relative abundance 与未表征物种纳入边界。
      url: https://doi.org/10.1038/s41587-023-01688-w
    - title: The Sanger FASTQ file format for sequences with quality scores, and the Solexa/Illumina FASTQ variants
      journal: Nucleic Acids Research
      year: 2010
      relevance: >
        定义第 08 篇使用的 FASTQ sequence/quality 四行交换格式与历史编码边界。
      url: https://doi.org/10.1093/nar/gkp1137
    - title: Accurate circular consensus long-read sequencing improves variant detection and assembly of a human genome
      journal: Nature Biotechnology
      year: 2019
      relevance: >
        支持将 PacBio HiFi 的 circular consensus 机制与 ONT 单分子长读路线分开描述。
      url: https://doi.org/10.1038/s41587-019-0217-9
    - title: Meta-analysis of 22,710 human microbiome metagenomes defines an oral-to-gut microbial enrichment score and associations with host health and disease
      journal: Nature Communications
      year: 2026
      relevance: >
        定义 curatedMetagenomicData 3 的人群规模、统一 MetaPhlAn 3 / HUMAnN 3
        profile lineage 与跨数据集分析边界，为第 12 篇的数据资源合同定锚。
      url: https://doi.org/10.1038/s41467-025-66888-1
    - title: "TreeSummarizedExperiment: a S4 class for data with hierarchical structure"
      journal: F1000Research
      year: 2021
      relevance: >
        定义 assay、rowData、colData 与层级树共同对齐的 S4 容器，为第 12 篇
        feature × sample 方向和对象转换守恒检查提供方法依据。
      url: https://doi.org/10.12688/f1000research.26669.2
  advanced_directions:
    - title: 跨队列泛化而非单队列高 AUC
      rationale: >
        同队列交叉验证不能替代真正未见队列的外部验证；第 28 篇将固定 N−1
        队列训练与留一队列测试边界。
      references:
        - title: Meta-analysis of fecal metagenomes reveals global microbial signatures that are specific for colorectal cancer
          type: application-paper
          url: https://doi.org/10.1038/s41591-019-0406-6
    - title: DNA 潜力到活性和产物的多组学证据链
      rationale: >
        基因存在不等于转录、蛋白表达或代谢物形成；结论必须停在实际测量层。
      references:
        - title: The Integrative Human Microbiome Project
          type: application-paper
          url: https://doi.org/10.1038/s41586-019-1238-8
    - title: Genome-resolved 结论的质量与嵌合审计
      rationale: >
        MAG 功能归属只有在完整度、污染、嵌合、rRNA/tRNA 和组装图证据共同通过后才可靠。
      references:
        - title: Minimum information about a single amplified genome and a metagenome-assembled genome
          type: reporting-standard
          url: https://doi.org/10.1038/nbt.3893
steps:
  - id: prepare-intro-data
    title: 从 Wirbel CRC 元数据生成第 01 篇队列审计表
    goal: >
      从固定 Zenodo 元数据识别论文的 5 个发现队列与 3 个独立验证队列，
      只保留 CRC 和 control 样本并生成可直接作图的小表。
    rationale: >
      开篇使用真实研究设计说明为什么跨队列证据比单队列漂亮图更重要，同时避免
      下载 73.5 MB 物种表来回答一个只需要 metadata 的问题。
    inputs:
      - downloads/meta_all.tsv
      - scripts/prepare_intro_data.R
    command: |
      set -eu
      mkdir -p data/small results
      Rscript "${MANIFEST_DIR}/scripts/prepare_intro_data.R" \
        "${RUN_ROOT}/downloads/meta_all.tsv" \
        "${RUN_ROOT}/data/small/01-crc-cohort-summary.tsv" \
        "${RUN_ROOT}/results/01-data-summary.json"
    expected_outputs:
      - data/small/01-crc-cohort-summary.tsv
      - results/01-data-summary.json
    acceptance_checks:
      - 原始元数据包含 1,892 个样本和 14 个 Study 标签
      - 论文 CRC 分析集包含 8 个队列和 768 个 CRC/对照样本
      - 5 个发现队列包含 575 个样本，3 个独立验证队列包含 193 个样本
    common_failures:
      - 把 US-CRC-2 或非 CRC 疾病队列错误纳入论文的八队列分析集
      - 把 adenoma 或 non-advanced adenoma 当作 CRC/control
      - Study 或 Group 列被表格软件改写
    outputs:
      - data/small/01-crc-cohort-summary.tsv
      - results/01-data-summary.json
    method_basis:
      type: external-benchmark
      summary: 使用作者公开元数据和作者仓库定义的 reference/external study 集合重建队列设计。
    references:
      - title: Meta-analysis of fecal metagenomes reveals global microbial signatures that are specific for colorectal cancer
        type: application-paper
        url: https://doi.org/10.1038/s41591-019-0406-6
    assertions:
      - id: intro-data-summary-exists
        type: file_exists
        path: results/01-data-summary.json
      - id: intro-crc-sample-count
        type: metric_threshold
        path: results/01-data-summary.json
        key: crc_case_control_samples
        comparator: "=="
        value: 768
  - id: prepare-study-design-data
    title: 从 Wirbel CRC 元数据生成第 03 篇设计与缺失审计
    goal: >
      将八个预先指定的 CRC 队列拆成 16 个病例—对照设计臂，审计年龄、性别、
      BMI 与测序量的可用比例，并记录队列内较小设计臂。
    rationale: >
      合并后的总样本量不能替代队列内有效样本量；协变量按队列成块缺失时，
      complete-case model 还会改变目标总体。
    inputs:
      - downloads/meta_all.tsv
      - scripts/prepare_article03_data.R
    command: |
      set -eu
      mkdir -p data/small results
      Rscript "${MANIFEST_DIR}/scripts/prepare_article03_data.R" \
        "${RUN_ROOT}/downloads/meta_all.tsv" \
        "${RUN_ROOT}/data/small/03-crc-design-audit.tsv" \
        "${RUN_ROOT}/results/03-study-design-summary.json"
    expected_outputs:
      - data/small/03-crc-design-audit.tsv
      - results/03-study-design-summary.json
    acceptance_checks:
      - 8 个队列拆成 16 个 Study × outcome 设计臂
      - 最小设计臂为 24 人，队列内较小设计臂中位数为 49 人
      - 年龄与性别各缺失 60 例，BMI 缺失 71 例，Library_Size 无缺失
    common_failures:
      - 用合并后的 768 代替队列内独立样本量
      - 把缺失编码字符串当作真实协变量值
      - 在公开 metadata 缺少协变量时仍宣称完成全队列统一调整
    outputs:
      - data/small/03-crc-design-audit.tsv
      - results/03-study-design-summary.json
    method_basis:
      type: external-benchmark
      summary: >
        使用 Wirbel 作者公开 metadata 重建真实设计；效力曲线仅作为明确受限的
        prospective sensitivity analysis，不估计观察到的菌群疾病效应。
    references:
      - title: Meta-analysis of fecal metagenomes reveals global microbial signatures that are specific for colorectal cancer
        type: application-paper
        url: https://doi.org/10.1038/s41591-019-0406-6
      - title: Power and sample-size estimation for microbiome studies using pairwise distances and PERMANOVA
        type: method-paper
        url: https://doi.org/10.1093/bioinformatics/btv183
      - title: powmic - an R package for power assessment in microbiome case-control studies
        type: method-paper
        url: https://doi.org/10.1093/bioinformatics/btaa197
    assertions:
      - id: study-design-summary-exists
        type: file_exists
        path: results/03-study-design-summary.json
      - id: study-design-smallest-arm
        type: metric_threshold
        path: results/03-study-design-summary.json
        key: smallest_group_n
        comparator: "=="
        value: 24
      - id: study-design-bmi-missing
        type: metric_threshold
        path: results/03-study-design-summary.json
        key: bmi_missing
        comparator: "=="
        value: 71
  - id: prepare-sequencing-depth-data
    title: 生成第 04 篇 CRC 深度表与 Lake Lanier coverage 曲线
    goal: >
      从同一固定 Wirbel metadata 导出 768 个 CRC 样本的 reported library
      size，并从未修改的 LakeLanier.npo 重建 Nonpareil abundance-weighted
      coverage 观测曲线。
    rationale: >
      测序深度必须同时审计真实队列分布、数据库无关 sequence coverage 和
      endpoint-specific saturation，不能用一个经验 reads 数替代。
    inputs:
      - downloads/meta_all.tsv
      - data/small/04-lake-lanier.npo
      - data/small/04-depth-evidence.tsv
      - scripts/prepare_article04_data.R
    command: |
      set -eu
      mkdir -p data/small results
      Rscript "${MANIFEST_DIR}/scripts/prepare_article04_data.R" \
        "${RUN_ROOT}/downloads/meta_all.tsv" \
        "${MANIFEST_DIR}/data/small/04-lake-lanier.npo" \
        "${RUN_ROOT}/data/small/04-crc-library-size.tsv" \
        "${RUN_ROOT}/data/small/04-lake-lanier-coverage.tsv" \
        "${RUN_ROOT}/results/04-sequencing-depth-summary.json"
    expected_outputs:
      - data/small/04-crc-library-size.tsv
      - data/small/04-lake-lanier-coverage.tsv
      - results/04-sequencing-depth-summary.json
    acceptance_checks:
      - CRC 分析集包含 8 个队列、768 个样本且 Library_Size 全为正值
      - reported library size 中位数为 24,019,758.5，范围为 1,932,775–90,924,580
      - Lake Lanier 曲线包含 47 个点，终点为 13,551,190 reads、1.17 Gbp 和约 68% coverage
    common_failures:
      - 把 reported Library_Size 误称为统一阶段的 non-host microbial reads
      - 把 read pairs、single reads 与 sequenced bases 混为同一分母
      - 把 abundance-weighted coverage 误写成已观察物种比例
      - 把 Gweon 环境 AMR 研究的锚点推广成通用采购阈值
    outputs:
      - data/small/04-crc-library-size.tsv
      - data/small/04-lake-lanier-coverage.tsv
      - results/04-sequencing-depth-summary.json
    method_basis:
      type: external-benchmark
      summary: >
        CRC 分布来自 checksum-locked public metadata；coverage 变换遵循
        Nonpareil alignment-kernel overlap correction，且只展示观测范围、不做
        95% 远距离外推。
    references:
      - title: Meta-analysis of fecal metagenomes reveals global microbial signatures that are specific for colorectal cancer
        type: application-paper
        url: https://doi.org/10.1038/s41591-019-0406-6
      - title: "Nonpareil: a redundancy-based approach to assess the level of coverage in metagenomic datasets"
        type: method-paper
        url: https://doi.org/10.1093/bioinformatics/btt584
      - title: "Nonpareil 3: Fast Estimation of Metagenomic Coverage and Sequence Diversity"
        type: method-paper
        url: https://doi.org/10.1128/mSystems.00039-18
      - title: The impact of sequencing depth on the inferred taxonomic composition and AMR gene content of metagenomic samples
        type: application-paper
        url: https://doi.org/10.1186/s40793-019-0347-1
    assertions:
      - id: sequencing-depth-summary-exists
        type: file_exists
        path: results/04-sequencing-depth-summary.json
      - id: sequencing-depth-crc-samples
        type: metric_threshold
        path: results/04-sequencing-depth-summary.json
        key: crc_samples
        comparator: "=="
        value: 768
      - id: sequencing-depth-crc-median
        type: metric_threshold
        path: results/04-sequencing-depth-summary.json
        key: crc_median_library_reads
        comparator: "=="
        value: 24019758.5
      - id: sequencing-depth-lake-coverage-lower
        type: metric_threshold
        path: results/04-sequencing-depth-summary.json
        key: lake_final_coverage
        comparator: ">="
        value: 0.68
      - id: sequencing-depth-lake-coverage-upper
        type: metric_threshold
        path: results/04-sequencing-depth-summary.json
        key: lake_final_coverage
        comparator: "<="
        value: 0.69
  - id: prepare-library-prep-data
    title: 生成第 05 篇提取偏差与 synDNA 定量审计表
    goal: >
      从固定 commit 的 Costea/McLaren RDA 对象复算 10 个 mock taxa 在
      H/Q/W 三种提取协议中的 relative efficiency 和 pairwise bias，并核对
      Zaramela Table 1 的 synDNA cell-composition recovery。
    rationale: >
      DNA 提取和建库不是中性步骤；只有 truth-known cellular mock 与流程位置
      明确的 spike-in 才能分别审计 taxon recovery 和 quantitative scale。
    inputs:
      - downloads/costea2017_sample_data.rda
      - downloads/costea2017_metaphlan2_profiles.rda
      - downloads/costea2017_mock_composition.rda
      - data/small/05-syndna-mock-benchmark.tsv
      - scripts/prepare_article05_data.R
    command: |
      set -eu
      mkdir -p data/small results
      Rscript "${MANIFEST_DIR}/scripts/prepare_article05_data.R" \
        "${RUN_ROOT}/downloads/costea2017_sample_data.rda" \
        "${RUN_ROOT}/downloads/costea2017_metaphlan2_profiles.rda" \
        "${RUN_ROOT}/downloads/costea2017_mock_composition.rda" \
        "${RUN_ROOT}/data/small/05-costea-mock-profiles.tsv" \
        "${RUN_ROOT}/data/small/05-costea-bias-summary.tsv" \
        "${MANIFEST_DIR}/data/small/05-syndna-mock-benchmark.tsv" \
        "${RUN_ROOT}/results/05-library-prep-summary.json"
    expected_outputs:
      - data/small/05-costea-mock-profiles.tsv
      - data/small/05-costea-bias-summary.tsv
      - results/05-library-prep-summary.json
    acceptance_checks:
      - 27 个 profiles 来自 9 个 backgrounds × H/Q/W 三种协议
      - 10 个 mock taxa 的已知 FACS cell abundance 跨越约 446 倍
      - H/Q/W 最大成对偏差分别约为 2,751、55.8 和 74.0 倍
      - synDNA Pool 2 与预期比例的 Pearson r 高于 0.99、RMSE 低于 1 percentage point
      - 普通 relative reads 与预期比例的 Pearson r 约为 -0.749
    common_failures:
      - 把 27 个技术处理误写成 27 个独立受试者
      - 把 geometric-centered relative efficiency 误写成 DNA 回收百分比
      - 把 Protocol Q 在十菌 benchmark 中较小的偏差推广成通用最佳协议
      - 把提取后加入的 synDNA 误写成可以校正裂解与提取损失
      - 根据年份猜测 RDA 未记录的 MetaPhlAn marker database release
    outputs:
      - data/small/05-costea-mock-profiles.tsv
      - data/small/05-costea-bias-summary.tsv
      - results/05-library-prep-summary.json
    method_basis:
      type: external-benchmark
      summary: >
        relative efficiency 与 pairwise bias 遵循 McLaren et al. 的乘法偏差
        模型；synDNA 数值保持 Zaramela et al. Table 1 原值且不重归一。
    references:
      - title: Towards standards for human fecal sample processing in metagenomic studies
        type: application-paper
        url: https://doi.org/10.1038/nbt.3960
      - title: Consistent and correctable bias in metagenomic sequencing experiments
        type: method-paper
        url: https://doi.org/10.7554/eLife.46923
      - title: synDNA - a Synthetic DNA Spike-in Method for Absolute Quantification of Shotgun Metagenomic Sequencing
        type: method-paper
        url: https://doi.org/10.1128/msystems.00447-22
    assertions:
      - id: library-prep-summary-exists
