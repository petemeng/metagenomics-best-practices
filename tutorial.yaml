  - id: validate-cross-cohort-analysis
    title: 验证第 28 篇随机效应 meta-analysis、真正 LODO 与跨队列稳定性
    goal: >
      在五个预声明发现队列上计算 species-level Hedges g/REML meta-analysis，
      在三个独立队列审计方向；另执行 8 轮 N−1 LODO、训练队列内层调参、
      逐队列 DeLong CI、random-effects AUROC、2,000 次层级 bootstrap、8×8
      single-study transfer 与 coefficient stability，并生成五张出版图。
    rationale: >
      association reproducibility、单研究迁移和多队列模型的外部泛化是三个不同问题。
      分开保存逐队列 effects、predictions、tuning、coefficients 与异质性，才能避免
      用 pooled AUROC 掩盖失败队列或把预测 feature 写成因果机制。
    inputs:
      - env/renv.lock
      - env/cross-cohort-renv.lock
      - data/small/28-cross-cohort/analysis-contract.tsv
      - data/small/28-cross-cohort/cohort-summary.tsv
      - data/small/28-cross-cohort/feature-universe-audit.tsv.gz
      - data/small/28-cross-cohort/file-checksums.sha256
      - data/small/28-cross-cohort/resource-manifest.tsv
      - data/small/28-cross-cohort/sample-metadata.tsv
      - data/small/28-cross-cohort/species-relative-abundance.tsv.gz
      - data/small/28-data-NOTICE.txt
      - chapters/28-cross-cohort-validation.qmd
      - figures/28-wirbel-fig3-original.png
      - scripts/validate_article28_cross_cohort.R
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/28-cross-cohort" \
        "${RUN_ROOT}/figures"
      cp "${MANIFEST_DIR}/figures/28-wirbel-fig3-original.png" \
        "${RUN_ROOT}/figures/28-wirbel-fig3-original.png"
      R_LIBS_USER="${MANIFEST_DIR}/.r-lib:${HOME}/R/library" \
      Rscript "${MANIFEST_DIR}/scripts/validate_article28_cross_cohort.R" \
        --project-root "${RUN_ROOT}" \
        --input-dir "${RUN_ROOT}/data/small/28-cross-cohort" \
        --output-dir "${RUN_ROOT}/results/28-cross-cohort" \
        --figure-dir "${RUN_ROOT}/figures" \
        --chapter "${MANIFEST_DIR}/chapters/28-cross-cohort-validation.qmd"
    expected_outputs:
      - results/28-cross-cohort/association-cohort-effects.tsv.gz
      - results/28-cross-cohort/association-meta-analysis.tsv
      - results/28-cross-cohort/meta-signature-validation.tsv
