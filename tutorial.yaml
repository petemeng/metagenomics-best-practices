  - id: validate-host-removal-complexity-duplicates
    title: 验证第 14 篇完整参考去宿主、复杂度与重复 reads 决策合同
    goal: >
      从 Hostile 论文使用的公开人类 WGS run ERR194147 与 Meslier 71-strain
      MOCK1 run ERR9765746 分别确定性取前 20,000 个同步 read pairs，在
      human-t2t-hla 完整人类 Bowtie2 索引上实际运行 Hostile；以人源删除率和
      微生物保留率组成双控制验收，同时独立量化 transition complexity、
      sequence-exact duplicate burden 和过滤敏感性，不把低复杂度过滤或去重
      写成默认步骤。
    rationale: >
      去宿主、低复杂度与重复序列来自不同机制。只有一个 mate 命中宿主时必须
      处置整对 reads；低复杂度要看阈值与下游终点；没有 UMI 或可信定位信息时，
      相同序列既可能来自 PCR/optical duplicates，也可能来自高丰度基因组、
      多拷贝基因或保守区域。把三条账本分开，才能同时保护隐私、微生物保留与
      丰度解释。
    inputs:
      - env/host-removal.yml
      - env/host-removal-linux-64.lock
      - data/small/14-source-manifest.tsv
      - data/small/14-index-manifest.tsv
      - data/small/14-host-removal-frozen/run-summary.json
      - data/small/14-host-removal-frozen/tool-versions.tsv
      - data/small/14-host-removal-frozen/commands.sh
      - data/small/14-host-removal-frozen/hostile/human-hostile.json
      - data/small/14-host-removal-frozen/hostile/mock-hostile.json
      - data/small/14-host-removal-frozen/complexity-sensitivity.tsv
      - data/small/14-host-removal-frozen/duplicate-sensitivity.tsv
      - data/small/14-host-removal-frozen/index-files.sha256
      - data/small/14-host-removal-frozen/file-checksums.sha256
      - data/small/14-data-NOTICE.txt
      - scripts/build_article14_fastq_controls.py
      - scripts/run_article14_host_removal.sh
      - scripts/validate_article14_host_removal.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/14-host-removal-complexity-duplicates" \
        "${RUN_ROOT}/figures"
      host_removal_prefix="${HOST_REMOVAL_ENV_PREFIX:-${HOME}/miniconda3/envs/metagenome-host-removal-2026.07}"
      "${host_removal_prefix}/bin/python" \
        "${MANIFEST_DIR}/scripts/validate_article14_host_removal.py" \
        --project-root "${MANIFEST_DIR}" \
        --environment-prefix "${host_removal_prefix}" \
        --output-dir "${RUN_ROOT}/results/14-host-removal-complexity-duplicates" \
        --figure-dir "${RUN_ROOT}/figures"
    expected_outputs:
      - results/14-host-removal-complexity-duplicates/validation-summary.json
      - results/14-host-removal-complexity-duplicates/tool-audit.tsv
      - results/14-host-removal-complexity-duplicates/source-audit.tsv
      - results/14-host-removal-complexity-duplicates/index-audit.tsv
      - results/14-host-removal-complexity-duplicates/host-removal-audit.tsv
      - results/14-host-removal-complexity-duplicates/complexity-audit.tsv
      - results/14-host-removal-complexity-duplicates/duplicate-audit.tsv
      - results/14-host-removal-complexity-duplicates/privacy-audit.tsv
      - results/14-host-removal-complexity-duplicates/validation.log
      - figures/14-host-removal-recall-retention.pdf
      - figures/14-host-removal-recall-retention.png
      - figures/14-host-removal-recall-retention.tiff
      - figures/14-complexity-sensitivity.pdf
      - figures/14-complexity-sensitivity.png
      - figures/14-complexity-sensitivity.tiff
      - figures/14-duplicate-decision.pdf
      - figures/14-duplicate-decision.png
      - figures/14-duplicate-decision.tiff
    acceptance_checks:
      - 环境入口实际报告 Hostile 2.0.2、Bowtie2 2.5.4、Samtools 1.21、fastp 1.3.6 与 SeqKit 2.10.0，完整 transaction 进入 Linux-64 explicit lock
      - 人源 source manifest 固定 PRJEB3381、SAMEA1573618、ERR194147、官方 ENA R1/R2 URL、MD5 与 compressed bytes；该公开基准不用于表型或个体遗传推断
      - 微生物 source manifest 固定 PRJEB52977、SAMEA14435832、ERR9765746、官方 ENA R1/R2 URL、MD5 与 compressed bytes
      - 两个 control 均恰含 20,000 个 R1/R2 records，normalized IDs 与顺序完全一致，并记录每端未压缩 FASTQ SHA-256
      - human-t2t-hla 固定 T2T-CHM13 2.0、IPD-IMGT/HLA 3.51、release 2023-07 与官方 Bowtie2 tar SHA-256；解包后的每个索引文件另存 SHA-256
      - Hostile 使用 paired Bowtie2、--rename、--reorder 与默认 sensitive preset；主输出只保留 read 与 mate 均未比对人类参考的完整 pairs
      - ERR194147 人源 pairs 删除比例不低于 99%，ERR9765746 MOCK1 pairs 保留比例不低于 99%，两组输出均保持成对同步与账本守恒
      - 主流程不启用 low-complexity filtering；fastp transition-complexity 20%、30% 与 40% 仅作成对敏感性分支，并保存每个阈值的损失账本
      - 主流程不启用 deduplication；sequence-exact paired duplicate 由独立哈希复核，fastp --dedup 只作敏感性分支且不替代 PCR、optical、mapping-coordinate 或 UMI 判定
      - 人源、微生物、过滤后与敏感性分支 FASTQ 全部留在受控 scratch 且不进入 Git；固化日志中的绝对路径与原始 read IDs 被移除或规范化
      - 常规 QA 只读取 checksum-locked frozen evidence，不访问 ENA、Hostile object storage 或任何人源 FASTQ
      - 三张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 用不完整的单一 GRCh38 primary assembly 或未记录 release 的自建索引替代完整人类参考
      - 独立过滤 R1/R2，保留 host-mapped read 的 mate，或把 orphan 当作完整 pair 进入下游
      - 把公开人类 benchmark 的可下载性误写成临床或队列 FASTQ 可以开放共享
      - 只报告 human removal 而没有真实 microbial-retention control
      - 把低 entropy、homopolymer、adapter、低质量和 duplication 合并成同一个失败类别
      - 看到 fastp 或 FastQC duplication rate 就默认 --dedup，且不比较去重前后的丰度或功能终点
      - 把 sequence-exact duplicates 直接命名为 PCR duplicates，或在没有原始 Illumina 坐标时声称识别了 optical duplicates
      - 对 UMI 文库忽略 UMI extraction/grouping/error correction，却继续用普通 sequence-level dedup
    outputs:
      - results/14-host-removal-complexity-duplicates/validation-summary.json
      - results/14-host-removal-complexity-duplicates/tool-audit.tsv
      - results/14-host-removal-complexity-duplicates/source-audit.tsv
      - results/14-host-removal-complexity-duplicates/index-audit.tsv
      - results/14-host-removal-complexity-duplicates/host-removal-audit.tsv
      - results/14-host-removal-complexity-duplicates/complexity-audit.tsv
      - results/14-host-removal-complexity-duplicates/duplicate-audit.tsv
      - results/14-host-removal-complexity-duplicates/privacy-audit.tsv
      - results/14-host-removal-complexity-duplicates/validation.log
      - figures/14-host-removal-recall-retention.pdf
      - figures/14-host-removal-recall-retention.png
      - figures/14-host-removal-recall-retention.tiff
      - figures/14-complexity-sensitivity.pdf
      - figures/14-complexity-sensitivity.png
      - figures/14-complexity-sensitivity.tiff
      - figures/14-duplicate-decision.pdf
      - figures/14-duplicate-decision.png
      - figures/14-duplicate-decision.tiff
    method_basis:
      type: external-benchmark
      summary: >
        人源阳性控制采用 Hostile 论文明确使用的真实 NA12878 Illumina WGS
        accession ERR194147；微生物保留控制采用 Meslier 等 71-strain MOCK1 的
        真实 ERR9765746。一次性运行读取 checksum-identified 文件的固定前缀与
        完整 human-t2t-hla Bowtie2 索引，发布 QA 只审计聚合且去标识的冻结证据。
    references:
      - title: "Hostile: accurate decontamination of microbial host sequences"
        type: method-paper
        url: https://doi.org/10.1093/bioinformatics/btad728
      - title: Hostile 2.0.2 source and index manifest
        type: official-release
        url: https://github.com/bede/hostile/tree/2.0.2
      - title: ERR194147 ENA run record
        type: official-data-record
        url: https://www.ebi.ac.uk/ena/browser/view/ERR194147
      - title: Benchmarking second and third-generation sequencing platforms for microbial metagenomics
        type: data-paper
        url: https://doi.org/10.1038/s41597-022-01762-z
      - title: "fastp: an ultra-fast all-in-one FASTQ preprocessor"
        type: method-paper
        url: https://doi.org/10.1093/bioinformatics/bty560
      - title: Samtools markdup manual
        type: official-documentation
        url: https://www.htslib.org/doc/samtools-markdup.html
      - title: "UMI-tools: modeling sequencing errors in Unique Molecular Identifiers to improve quantification accuracy"
        type: method-paper
        url: https://doi.org/10.1101/gr.209601.116
    assertions:
      - id: host-removal-validation-status
        type: text_match
        path: results/14-host-removal-complexity-duplicates/validation-summary.json
        pattern: '"status": "passed"'
      - id: host-removal-human-input-pairs
