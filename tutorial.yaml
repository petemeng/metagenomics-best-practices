    acceptance_checks:
      - 实际入口继续报告 Kraken2 2.17.1、Bracken Bioconda package 3.1p1、wrapper CLI 3.0.1 与 Python 3.12.13，explicit lock 与第 16 篇一致
      - MOCK 主输入固定为第 13 篇 99,991 个 clean pairs；人类方法对照固定为 PRJEB3381/SAMEA1573618/ERR194147 前 20,000 个同步 pairs，四个压缩文件逐一通过 SHA-256
      - 71 个 MOCK1 assembly 与 expected genome percentage 来自 Meslier 2022 Supplementary Table S3；不重归一的印刷数值总和为 100.01215654459679%，原始 XLSX 与两个 NCBI snapshot 的 SHA-256 均锁定
      - NCBI Datasets 18.33.1 快照日期固定 2026-07-21；每个 assembly 均有 genome report，并把当前 taxid、paired RefSeq accession 与 sequence accessions 留在交叉表
      - 数据库均固定 release-specific 2026-06-26 URL：Standard-8 archive 为 5,946,578,575 bytes/MD5 7685f43cce057c2ca18511c925399b72，Standard-16 为 11,995,707,291 bytes/MD5 f130daa49fd0befa688330b288a623de，PlusPF-8 为 5,933,654,083 bytes/MD5 79a153b99f045bc2ae95e6d57c17a02d
      - 三个数据库解包文件逐一通过 publisher MD5；Standard-8 与 Standard-16 只改变 cap，Standard-8 与 PlusPF-8 在近似相同 cap 下改变 content，不把 PlusPF-8 写成 Standard 的严格超集性能
      - reference crosswalk 对每个 database × truth assembly 区分 exact expected assembly、same-species alternate reference 与 no same-species reference；性能分母只使用可检出的 same-species truth，并另报缺参考的预期丰度
      - 主矩阵完整包含 3 databases × 5 confidence × 2 controls 共 30 个分支，全部固定 --minimum-hit-groups 2；补充矩阵补足 Standard-16、confidence 0.10 的 hit-groups 1/2/3/4，唯一 Kraken runs 共 36 个
      - 所有 Kraken 命令显式使用 --paired、--gzip-compressed、standard six-column report，并保留 input、classified 与 unclassified fragment 守恒；每个分支均记录 wall time 与 maximum resident set size
      - Bracken 对 MOCK 使用 150 bp distribution、对 101 bp 人类 reads 使用 100 bp distribution，rank S、threshold 10 在全部对应分支保持一致；不同输入之间不直接比较 Bracken abundance accuracy
      - confidence trade-off 同时报 reference-aware expected-species recovery、non-truth species burden、classified fraction 与人类方法对照 lineage-external unsupported burden，不只优化一个指标
      - human control 的 classified fragments 必须精确分成 Homo sapiens clade、human-lineage ancestor direct calls 与 lineage-external unsupported calls；三类加 unclassified 逐分支守恒，不据此声称实验室污染、临床微生物或统计学假阳性率
      - 章节结论只给当前数据/数据库/预算下的操作性起点与敏感性报告，不把 confidence 0.10、hit-groups 2 或任一数据库写成普适最优
      - FASTQ、三个数据库 archive/index 与 per-fragment outputs 留在 ignored scratch/database；Git 只固化 standard reports、Bracken 表、交叉表、聚合审计、归一化日志和 checksum manifest
      - 常规 QA 只读取 checksum-locked frozen evidence，不访问 ENA、NCBI 或 Kraken 数据库服务器，也不要求本地大型 index
      - 四张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 用不同 release 日期比较数据库，却把 taxonomy/reference 更新误写成 database content 或 cap 效应
      - 把 Standard-8、Standard-16、PlusPF-8 的名字写出来，却不锁 URL、bytes、archive MD5 与解包文件 MD5
      - 把 expected assembly 不在库中的漏检计入算法 sensitivity，或把 same-genus wrong-species 当成正确 species recovery
      - 只看 classified fraction；更高分类率可能同时增加 non-truth species 与对照中的 non-human calls
      - 把 confidence 当作 p-value、posterior probability 或跨数据库可迁移的固定检出限
      - 把 minimum-hit-groups 与 confidence 当成同一个参数，或同时改变两者后仍声称单因素效应
      - 对 101 bp 人类 reads 使用 150 bp Bracken distribution，或用不同 threshold 比较数据库
      - 把公开人类 WGS 当成无菌 extraction blank，进而宣称所有 non-human calls 都是分类器假阳性
      - 依赖每个 confidence 分支的大型 per-fragment output 做日常 QA，导致发布必须重跑数据库
