      - figures/32-consensus-error.png
      - figures/32-consensus-error.tiff
      - figures/32-abundance-resource-audit.pdf
      - figures/32-abundance-resource-audit.png
      - figures/32-abundance-resource-audit.tiff
    method_basis:
      type: external-benchmark
      summary: >
        使用 Meslier 等同一 71-strain MOCK1 DNA 的 Illumina、历史 ONT R9 与
        PacBio HiFi 数据；忠实保留论文 short-read-first hybrid 与 truth-aware
        MetaQUAST 锚点，再增加当前版本和 long-read-first Polypolish sensitivity audit。
    references:
      - title: Benchmarking second and third-generation sequencing platforms for microbial metagenomics
        type: data-resource
