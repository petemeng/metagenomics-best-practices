    acceptance_checks:
      - R 为 4.4.1、64-bit，Bioconductor 为 3.19，env/renv.lock 可解析且记录同一 R/Bioconductor 代际
      - curatedMetagenomicData 3.12.0、ExperimentHub、SummarizedExperiment、TreeSummarizedExperiment、mia、phyloseq、vegan、DESeq2 与核心 tidy 包均可加载且精确版本进入锁文件
      - 资源 manifest 固定官方 pattern、ExperimentHub 资源标识、远端来源、下载日期、字节数和 SHA-256
      - AsnicarF_2017.relative_abundance 的完整快照为真实 TreeSummarizedExperiment，至少含一个 assay、一个样本和一个 feature
