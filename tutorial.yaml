  - id: prepare-composition-core-data
    title: 固化第 25 篇 HMP_2012 多分类级谱表与 subject-habitat 观察单位
    goal: >
      从 curatedMetagenomicData 3.12.0 的 2021-03-31 HMP_2012
      relative_abundance 对象提取 phylum、genus 与 species terminal lineages，
      在每个 rank 内独立重闭合，并为原论文 Figure 3a/3c 的七个 shotgun habitats
      建立一位受试者一个代表样本的确定性 ledger。
    rationale: >
      原始 MetaPhlAn lineage matrix 同时包含多个分类层级；混合 rank 会重复计算
      同一组成。HMP metadata 还包含同一受试者、同一 habitat 的重复样本与多个
      生态差异明显的口腔亚位点。先固定 rank denominator、habitat 与观察单位，
      才能让 composition、prevalence 和 core membership 的分母可复核。
    inputs:
      - downloads/article25/2021-03-31.HMP_2012.relative_abundance.rda
      - env/renv.lock
      - scripts/prepare_article25_composition_core.R
    command: |
      set -eu
      mkdir -p "${RUN_ROOT}/data/small/25-composition-core"
      R_LIBS_USER="${MANIFEST_DIR}/.r-lib:${HOME}/R/library" \
      Rscript "${MANIFEST_DIR}/scripts/prepare_article25_composition_core.R" \
        --source-rda "${RUN_ROOT}/downloads/article25/2021-03-31.HMP_2012.relative_abundance.rda" \
        --output-dir "${RUN_ROOT}/data/small/25-composition-core" \
