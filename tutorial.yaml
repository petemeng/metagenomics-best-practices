troubleshooting:
  - Zenodo 下载失败时先检查记录 URL、网络和 MD5，不以手工表替代
  - 队列计数变化时先核对 Study、Group 和发现/验证队列白名单
  - Quarto 无法渲染时先检查固定 Quarto、R、knitr 和 rmarkdown 版本
  - ExperimentHub 初始化失败时先检查 project-local cache 写权限，不把 dryrun 查询当作资源已经下载
  - 图中文字出现中文或字体缺失时阻止发布并修正标签
  - Methods 与实际脚本、数据库或版本不一致时以 QA 证据为准
reproducibility:
  strategy:
    - tutorial.yaml 是内容、执行和发布的唯一工作流契约
    - 下游章节真实执行并缓存；重型上游章节保存一次性完整运行证据
    - 网页与微信公众号文章由同一份 QMD、数据、结果和结论派生
    - 默认引用论文并从公开数据重绘，不复制无明确许可的论文原图
