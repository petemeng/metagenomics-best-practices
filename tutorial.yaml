    acceptance_checks:
      - 输入追溯到 ERR9765746 clean R1/R2、99,991 个同步 pairs 与 199,982 reads；两端各自的 compressed SHA-256、record 数、base 数和 PairIDHash 必须与第 13 篇一致
      - paired-end 仅按官方约定串接 reads，不把 mate 当成 fragment 合并、不做 overlap merge；串接前后 read 数和 read-ID 唯一化审计守恒
      - 主 prescreen 固定 MetaPhlAn 4.2.5 与 mpa_vJun23_CHOCOPhlAnSGB_202403，两份 archive 使用发布者 MD5 验证；profile header 必须包含 vJun23
      - 第 15 篇 vJan26 profile 只用于跨 release species 选择审计；HUMAnN 3.9 对其直接输入的预期拒绝被记录，不伪造 vJun23 header、不修改 HUMAnN 源码
      - MetaPhlAn 4.2.5 新增的 version-status 行只通过 checksum-locked wrapper 对 HUMAnN 3.9 隐藏；wrapper 仅过滤 --version 的额外行，其余调用原样委托，且不得使用会选择整个 ChocoPhlAn 的 --bypass-prescreen
      - HUMAnN 固定 3.9，Bowtie2 固定 2.5.5，DIAMOND 固定 2.2.4；search mode 固定 UniRef90、8 threads、PYTHONHASHSEED=0、MetaCyc、MinPath on、gap-fill on 与默认 coverage thresholds
      - ChocoPhlAn 固定 full v201901_v31，archive 16,502,062,909 bytes；UniRef90 固定 annotated v201901b full，archive 20,579,913,329 bytes
      - HUMAnN 两份 archive 的上游端点未发布 checksum；首次获取必须保留 HTTPS 最终 URL、HTTP Content-Length、获取时间、完整 tar/gzip 检验和本地 SHA-256，并明确标为 retrieval lock 而非 publisher checksum
      - 第一次 retrieval lock 完成后，后续下载和真实运行均 fail-closed 使用 manifest 中的 exact bytes 与 SHA-256；解包后记录文件数、installed bytes、关键文件名和逐文件 SHA-256
      - nucleotide、translated 与最终 unmapped read flow 从原始 HUMAnN log/中间结果解析，分母统一为 199,982 individual reads；任何 RPK 或 pathway special row 不反推为 read count
      - 原始 gene-family 与 pathway-abundance 表保留 RPK-like native scale；CPM/relative abundance 只由 humann_renorm_table 派生，命名、header 和 normalization denominator 必须显式记录
      - humann_regroup_table 固定 --groups uniref90_rxn、--function sum、--ungrouped Y 与 --protected Y；必须先从 native gene-family RPK regroup，再对 reaction table 单独派生 CPM/relative abundance
      - 内置 reaction mapping 固定为 57,511,575-byte metacyc_reactions_level4ec_only.uniref.bz2 与 SHA-256 8419ce78a62ca9130914f2c347a9708111cedc7de52ba274659ce51ec7de7752
      - gene-family 每个 ordinary community row 等于同 feature 的 species/unclassified strata 之和；UNMAPPED 等 special rows单独审计，不强行要求 strata
      - regroup 分支保留 1,402 个 ordinary reactions，reaction community–strata 违例为 0；UNGROUPED 和 protected UNMAPPED 必须保留，并报告 mapped/total expansion factor
      - pathway abundance 在 community 与 strata 内分别求解，不把 strata 之和冒充 community total；报告二者差值分布并保留 UNMAPPED/UNINTEGRATED 的 compression semantics
      - pathway coverage 仅接受 0–1 范围，UNMAPPED/UNINTEGRATED special rows不进入 coverage 生物学图；coverage 不重归一化、不求和、不解释为 reads 百分比
      - stratified 与 unstratified 表从同一 native output 拆分；feature ID 与 glossary 分开保存，不能先按名称合并导致 ID 冲突
      - FASTQ、两套 MetaPhlAn archives/index、两套 HUMAnN archives/databases、临时 Bowtie2 index、逐 read alignments 与 DIAMOND 中间文件均留在 ignored 工作区；Git 只固化小型表、规范化日志和 checksum manifest
      - 常规 QA 不读取 FASTQ、大型数据库或网络，只读取 checksum-locked frozen evidence
      - 四张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 把 MetaPhlAn vJan26 profile 直接喂给只识别 vJun23 的 HUMAnN 3.9，或为绕过检查手工改写 header
      - 为绕开 HUMAnN 3.9 的 MetaPhlAn version parser 使用 --bypass-prescreen，导致 supplied profile 不再筛选物种、整套 ChocoPhlAn 被合并成样本库
      - 只下载 ChocoPhlAn 或只下载 UniRef90，却把 nucleotide-only 或 translated-only 分支写成完整 HUMAnN standard workflow
      - 直接拼接压缩文件却不核对 gzip multi-member reader、read 数和 read ID，导致第二个 mate 文件被静默忽略
      - 把 RPK 写成 reads、把 CPM 写成绝对 copy number，或把相对丰度用于组间差异却不说明 compositional denominator
      - 把 UniRef90→reaction regroup 当成简单改名，在 gene-family CPM 上 regroup 后继续沿用原 denominator，或把一对多 expansion 写成新增 reads
      - 把 pathway coverage 当成 pathway abundance、完整基因比例或 0/1 presence call，再对 coverage 做 CPM 归一化
      - 对 pathway abundance 画 stacked taxon bar 并宣称 strata 必须加回 community total，忽略 community-level pathway reconstruction 的非线性
      - 删除 UNMAPPED/UNINTEGRATED 后再声称样本全部功能都已解释，或把两个 special row 当作真实 MetaCyc pathway
      - 在没有 publisher checksum 的情况下写成“官方 SHA-256 已验证”，或只凭文件名认定 37 GB archive 完整
      - 用 10 万 read pairs 工业 mock 的 pathway 排名外推人体疾病机制、活性或代谢通量
