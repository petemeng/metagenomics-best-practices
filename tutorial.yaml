      - 第 34 篇以 eval false 读取 checksum-locked gene catalog、truth audit 与敏感性证据，并载入四张命名主图
      - 第 35 篇以 eval false 读取 checksum-locked gene abundance、normalization 与 functional aggregation 账本，并载入四张命名主图
      - 第 36 篇以 eval false 读取 checksum-locked eggNOG annotations、字段覆盖、功能暗物质、COG fractional profile 与 GO evidence sensitivity，并载入四张命名主图
      - 第 37 篇以 eval false 读取 checksum-locked dbCAN 三工具、family/class、substrate 与 CGC 证据，并载入四张命名主图
      - 第 38 篇以 eval false 读取 checksum-locked CARD-RGI tier、quality、drug class 与正控证据，并载入四张命名主图
      - 第 39 篇以 eval false 读取 checksum-locked VFDB threshold/database sensitivity、quality、VFC 与 context 证据，并载入四张命名主图
      - 第 40 篇以 eval false 读取 checksum-locked antiSMASH/GECCO、fragmentation、BGC type 与 MIBiG 证据，并载入四张命名主图
      - 第 41 篇以 eval false 读取 checksum-locked mapping/depth 证据，并载入三张命名主图
      - 第 42 篇以 eval false 读取 checksum-locked 五分支 binning、独立 QC 与 truth audit，并载入四张命名主图
      - 第 43 篇以 eval false 读取 checksum-locked refinement、独立 QC 与 truth-blind selection，并载入四张命名主图
      - 第 44 篇以 eval false 读取 checksum-locked MIMAG、marker-domain 与 assembly-graph 审计，并载入四张命名主图
    common_failures:
      - Quarto 不在 PATH
      - knitr、rmarkdown 或 R 包版本漂移
      - 正文读取了未复制进隔离工作区的文件
      - 执行代码块自动打印重复图，导致公众号派生检测到未声明 image
