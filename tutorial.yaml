  - id: prepare-machine-learning-data
    title: 固化第 27 篇 ZellerG_2014 机器学习输入与无泄漏分析合同
    goal: >
      从 checksum-locked ZellerG_2014 MetaPhlAn3 物种谱和样本表筛出 114 名
      独立 CRC/Control 受试者，完整保留 661 个物种，并固定阳性类、subject-level
      fold、嵌套交叉验证、训练折预处理、指标、bootstrap 与置换审计合同。
    rationale: >
      在切分前筛选 feature、重标 adenoma 或丢失 subject identity 都会改变预测任务。
      冻结原始 feature universe 与逐项合同，才能证明后续性能属于未见样本而不是
      测试折信息泄漏。
    inputs:
      - data/small/24-differential-abundance/species-relative-abundance.tsv.gz
      - data/small/24-differential-abundance/sample-metadata.tsv
      - scripts/prepare_article27_machine_learning.R
    command: |
      set -eu
      mkdir -p "${RUN_ROOT}/data/small/27-machine-learning"
      R_LIBS_USER="${MANIFEST_DIR}/.r-lib:${HOME}/R/library" \
      Rscript "${MANIFEST_DIR}/scripts/prepare_article27_machine_learning.R" \
        --source-species "${RUN_ROOT}/data/small/24-differential-abundance/species-relative-abundance.tsv.gz" \
        --source-metadata "${RUN_ROOT}/data/small/24-differential-abundance/sample-metadata.tsv" \
        --output-dir "${RUN_ROOT}/data/small/27-machine-learning" \
        --notice "${RUN_ROOT}/data/small/27-data-NOTICE.txt"
    expected_outputs:
      - data/small/27-machine-learning/analysis-contract.tsv
      - data/small/27-machine-learning/feature-universe-audit.tsv
      - data/small/27-machine-learning/file-checksums.sha256
      - data/small/27-machine-learning/resource-manifest.tsv
      - data/small/27-machine-learning/sample-metadata.tsv
      - data/small/27-machine-learning/species-relative-abundance.tsv.gz
      - data/small/27-data-NOTICE.txt
    acceptance_checks:
      - 必须保留 114 名独立受试者、61 名 Control、53 名 CRC 与全部 661 个 species features
      - adenoma 必须排除而非重标为 Control，positive class 必须固定为 CRC
      - 输入谱必须闭合为 fraction，并记录 curatedMetagenomicData 3.12.0、MetaPhlAn 3 与 CHOCOPhlAn 201901
      - 分析合同必须固定 5 次 5 折外层、4 折内层、subject_id fold unit、seed 20260727 与训练折内 feature filtering
      - checksum manifest 必须完整覆盖 5 个 payloads
    common_failures:
      - 在全数据上先筛差异或 prevalence，再保存训练矩阵
      - 把 adenoma 并入健康对照，或把同一人的重复样本分到不同 folds
      - 把统一重处理 MetaPhlAn3 谱误写成原论文历史输入
    outputs:
      - data/small/27-machine-learning/analysis-contract.tsv
      - data/small/27-machine-learning/feature-universe-audit.tsv
      - data/small/27-machine-learning/file-checksums.sha256
      - data/small/27-machine-learning/resource-manifest.tsv
      - data/small/27-machine-learning/sample-metadata.tsv
      - data/small/27-machine-learning/species-relative-abundance.tsv.gz
      - data/small/27-data-NOTICE.txt
    method_basis:
      type: external-benchmark
      summary: >
        Zeller 2014 提供 CRC 粪便宏基因组分类器与嵌套验证锚点；SIAMCAT 的
        跨研究基准支持把队列结构、预处理和外部验证作为模型性能的一部分。
    references:
      - title: Potential of fecal microbiota for early-stage detection of colorectal cancer
        type: method-paper
        url: https://doi.org/10.15252/msb.20145645
      - title: Microbiome meta-analysis and cross-disease comparison enabled by SIAMCAT
        type: method-paper
        url: https://doi.org/10.1186/s13059-021-02306-1
    assertions:
      - id: machine-learning-input-contract
        type: file_exists
        path: data/small/27-machine-learning/analysis-contract.tsv
      - id: machine-learning-input-profile
        type: file_exists
        path: data/small/27-machine-learning/species-relative-abundance.tsv.gz
      - id: machine-learning-input-metadata
        type: file_exists
        path: data/small/27-machine-learning/sample-metadata.tsv
      - id: machine-learning-input-notice
        type: file_exists
        path: data/small/27-data-NOTICE.txt

  - id: validate-machine-learning
    title: 验证第 27 篇嵌套交叉验证、性能、校准、重要性与泄漏负对照
    goal: >
      对 Random forest 与 XGBoost 执行 5×5 外层、4 折内层的 subject-level
      nested cross-validation，聚合每名受试者的 OOF 概率，报告 AUROC、AUPRC、
      Brier、校准、paired bootstrap、outer-test permutation importance，并以
      50 次置换标签对照证明全局 label selection 会制造虚假信号。
    rationale: >
      单次 train/test split、训练集重要性或未嵌套的特征筛选都可能过度乐观。
      同时保存 folds、tuning、predictions、importance 与 null audit，才能审计
      模型的每一条性能声明。
    inputs:
      - env/renv.lock
      - env/machine-learning-renv.lock
      - data/small/27-machine-learning/analysis-contract.tsv
      - data/small/27-machine-learning/feature-universe-audit.tsv
      - data/small/27-machine-learning/file-checksums.sha256
      - data/small/27-machine-learning/resource-manifest.tsv
      - data/small/27-machine-learning/sample-metadata.tsv
      - data/small/27-machine-learning/species-relative-abundance.tsv.gz
      - data/small/27-data-NOTICE.txt
      - chapters/27-machine-learning-roc.qmd
