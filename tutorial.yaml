  - id: validate-kraken2-bracken
    title: 验证第 16 篇 Kraken2 paired-fragment 分类与 Bracken rank-level 重估合同
    goal: >
      从 Meslier 71-strain MOCK1 run ERR9765746 经第 13 篇质控保留的
      99,991 个同步 read pairs 起步，使用 Kraken2 2.17.1 与 checksum-locked
      Standard-8 2026-06-26 数据库实际生成 standard report，再用 Bracken
      package 3.1p1 在 species 150 bp/threshold 10 主模型及 threshold、read-length、
      rank 敏感性分支中重估丰度；全程区分 mates、paired fragments、direct counts、
      clade counts、unclassified 与 rank-resolved estimates。
    rationale: >
      Kraken2 给每个 paired fragment 一个 taxonomy-tree placement，Bracken 则利用
      数据库内固定 read length 的 assignment distribution 把兼容的高层级 fragments
      重新分配到请求 rank。若不保存 standard report、数据库 cap、计数单位、
      Bracken threshold 和未分配质量，就会把分类树计数误当成物种丰度，或把
      within-rank fraction 误写成全部 FASTQ 的比例。
    inputs:
      - env/kraken.yml
      - env/kraken-linux-64.lock
      - data/small/13-qc-frozen/run-summary.json
      - data/small/16-source-manifest.tsv
      - data/small/16-database-manifest.tsv
      - data/small/16-standard8-files.md5
      - data/small/16-data-NOTICE.txt
      - data/small/16-kraken-bracken-frozen/run-summary.json
      - data/small/16-kraken-bracken-frozen/tool-versions.tsv
      - data/small/16-kraken-bracken-frozen/commands.sh
      - data/small/16-kraken-bracken-frozen/database-inspect.txt
      - data/small/16-kraken-bracken-frozen/database-files.md5
      - data/small/16-kraken-bracken-frozen/kraken-report.tsv
      - data/small/16-kraken-bracken-frozen/bracken-species-r150-t10.tsv
      - data/small/16-kraken-bracken-frozen/bracken-species-r150-t0.tsv
      - data/small/16-kraken-bracken-frozen/bracken-species-r100-t10.tsv
      - data/small/16-kraken-bracken-frozen/bracken-genus-r150-t10.tsv
      - data/small/16-kraken-bracken-frozen/classification-ledger.tsv
      - data/small/16-kraken-bracken-frozen/rank-assignment.tsv
      - data/small/16-kraken-bracken-frozen/redistribution-audit.tsv
      - data/small/16-kraken-bracken-frozen/parameter-sensitivity.tsv
      - data/small/16-kraken-bracken-frozen/initialization-audit.tsv
      - data/small/16-kraken-bracken-frozen/file-checksums.sha256
      - db/download_db.sh
      - scripts/run_article16_kraken2_bracken.sh
      - scripts/validate_article16_kraken2_bracken.py
    command: |
      set -eu
      mkdir -p \
        "${RUN_ROOT}/results/16-kraken2-bracken" \
        "${RUN_ROOT}/figures"
      kraken_prefix="${KRAKEN_ENV_PREFIX:-${HOME}/miniconda3/envs/metagenome-kraken-2026.07}"
      "${kraken_prefix}/bin/python" \
        "${MANIFEST_DIR}/scripts/validate_article16_kraken2_bracken.py" \
        --project-root "${MANIFEST_DIR}" \
        --environment-prefix "${kraken_prefix}" \
        --frozen-dir "${MANIFEST_DIR}/data/small/16-kraken-bracken-frozen" \
        --output-dir "${RUN_ROOT}/results/16-kraken2-bracken" \
        --figure-dir "${RUN_ROOT}/figures"
    expected_outputs:
      - results/16-kraken2-bracken/validation-summary.json
      - results/16-kraken2-bracken/tool-audit.tsv
      - results/16-kraken2-bracken/source-audit.tsv
      - results/16-kraken2-bracken/database-audit.tsv
      - results/16-kraken2-bracken/classification-audit.tsv
      - results/16-kraken2-bracken/redistribution-audit.tsv
      - results/16-kraken2-bracken/sensitivity-audit.tsv
      - results/16-kraken2-bracken/validation-audit.tsv
      - results/16-kraken2-bracken/validation.log
      - figures/16-kraken-classification-ledger.pdf
      - figures/16-kraken-classification-ledger.png
      - figures/16-kraken-classification-ledger.tiff
      - figures/16-bracken-redistribution.pdf
      - figures/16-bracken-redistribution.png
      - figures/16-bracken-redistribution.tiff
      - figures/16-bracken-parameter-sensitivity.pdf
      - figures/16-bracken-parameter-sensitivity.png
      - figures/16-bracken-parameter-sensitivity.tiff
    acceptance_checks:
      - 实际入口报告 Kraken2 2.17.1、Bracken Bioconda package 3.1p1、wrapper CLI 3.0.1 与 Python 3.12.13，且 explicit lock 含同一精确 package builds
      - source manifest 固定 PRJEB52977、SAMEA14435832、ERR9765746、99,991 个 clean pairs、199,982 条 mates、per-mate bases 与 compressed SHA-256
      - R1/R2 normalized pair IDs 和顺序完全一致，paired-ID SHA-256 与第 13 篇 clean ledger 相同；不得把 ENA record suffix `.1` 误删为 mate suffix
      - 数据库固定 release-specific Standard-8 2026-06-26 URL，不使用 latest；archive 恰为 5,946,578,575 bytes、publisher MD5 为 7685f43cce057c2ca18511c925399b72、本地 SHA-256 为 b17d05ca1459564b49b63d014c4b2ee6ebe1ca0143e6c184e0dfd6d940a55981
      - 解包后的 17 个文件逐一通过 publisher MD5；总字节数为 8,638,898,739，并含 50/75/100/150/200/250/300 bp Bracken distributions
      - 数据库合同明确披露 8 GB cap、RefSeq archaea/bacteria/viral/plasmid、human、UniVec_Core 组成及 sensitivity/accuracy 折中，不将它冒充 full Standard 或 core_nt
      - Kraken2 主命令显式使用 --paired、--gzip-compressed、--confidence 0.0 与 --minimum-hit-groups 2，保留 standard six-column report，不使用 MPA-style report 作为 Bracken 输入
      - per-fragment output 恰有 99,991 行且一 pair 一行；paired length/hit separators 和 paired-ID hash 均通过，原始 output 不进入公开 bundle
      - Kraken report 与 per-fragment output 一致给出 86,373 classified、13,618 unclassified，并证明 direct assignments 加 unclassified 总计 99,991
      - rank audit 分开记录 clade 与 direct counts；Other rank 被解释为 extended/intermediate/subspecies/strain codes，而非未知 taxonomy
      - Bracken 主模型固定 species、150 bp、threshold 10，保留 65 个 taxa、59,991 个 Kraken species-clade fragments、24,156 个最终整数化 added fragments 与 84,147 个 estimated fragments
      - Bracken fractions 只在 reported rank-level estimates 内解释；13,618 unclassified 与 2,226 threshold/unresolved/rounding mass 单独保留
      - threshold 0 报告 214 species，100 bp/threshold 10 报告 65 species且相对主模型 total variation 为 0.00134，genus 150 bp/threshold 10 报告 54 taxa
      - read length 使用单端 nominal/trimmed length 而非两端相加或 insert size；R1/R2 平均长度与 50–150 bp 范围均从真实 clean FASTQ ledger 推导
      - FASTQ、数据库 archive/index 与 per-fragment output 留在 ignored scratch/database；Git 只固化可发布 reports、聚合小表、路径归一化日志和 checksum manifest
      - 常规 QA 只读取 33-entry checksum-locked frozen evidence，不访问 ENA 或数据库服务器，不需要本地 5.54 GiB archive/8.64 GB index
      - 三张英文证据图同时导出 PDF、PNG 与 350 dpi LZW TIFF
    common_failures:
      - 把 99,991 paired fragments 写成 99,991 reads，或用 199,982 作为 Kraken report 分母
      - 把 standard report 第二列沿整棵 taxonomy tree 相加，重复计算 descendants
      - 给 Bracken 输入 --use-mpa-style report，或只保留 Bracken 表而删除原始 standard report
      - 把 `-r 150` 误写成 300 bp paired length或 265 bp insert-size peak
      - 把 `-t 10` 宣称为普适生物学检出限，忽略 214 vs 65 species 的参数敏感性
      - 把 `fraction_total_reads` 当作全部 FASTQ 分母，丢掉 unclassified、threshold-discarded 与 unresolved fragments
      - 只写 Standard database，不记录 release date、8 GB cap、URL、bytes 和 checksum
      - 把低计数 human row 直接升级为隐私/宿主污染结论，未结合 host-removal、controls、confidence 与 database sensitivity
    outputs:
      - results/16-kraken2-bracken/validation-summary.json
      - results/16-kraken2-bracken/tool-audit.tsv
      - results/16-kraken2-bracken/source-audit.tsv
