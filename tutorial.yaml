      - adenoma、术后史及无标签 profiles 必须排除而非重标为 Control；每名 subject 只保留一个 stool profile
      - 所有队列必须来自同一 2021-03-31 MetaPhlAn3/CHOCOPhlAn 201901 lineage，8 份原始 RDA 的 SHA-256 必须逐一匹配
