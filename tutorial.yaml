      - figures/44-mimag-requirements.pdf
      - figures/44-assembly-graph-audit.pdf
      - figures/44-checkm-audit.pdf
    method_basis:
      type: community-consensus
      summary: MIMAG 最低信息标准结合 CheckM2、GUNC、CheckM1 与 marker/graph 冻结证据。
    references:
      - title: Minimum information about a single amplified genome and a metagenome-assembled genome
        type: standards-paper
        url: https://doi.org/10.1038/nbt.3893
    assertions:
      - {id: mag-qc-validation-status, type: text_match, path: results/44-mag-qc-mimag-graph/validation-summary.json, pattern: '"status": "passed"'}
      - {id: mag-qc-selected, type: metric_threshold, path: results/44-mag-qc-mimag-graph/validation-summary.json, key: selected_bins, comparator: "==", value: 23}
      - {id: mag-qc-checks-failed, type: metric_threshold, path: results/44-mag-qc-mimag-graph/validation-summary.json, key: checks_failed, comparator: "==", value: 0}
      - {id: mag-qc-graph-figure, type: file_exists, path: figures/44-assembly-graph-audit.pdf}

