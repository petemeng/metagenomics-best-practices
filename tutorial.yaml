    acceptance_checks:
      - 第 19 篇输入目录的 34 个 frozen payload checksums 必须先通过，native gene-family、reaction 与 pathway abundance tables 不得被覆盖
      - 三个 feature spaces 各自从 native RPK-like table 建 denominator；不得将 gene-family、reaction 或 pathway totals 互相继承
      - 每个 feature space 完成 cpm/relab、community/levelwise、special y/n 共 8 个分支，总计 24 个；独立复算结果必须与 HUMAnN 3.9 算法一致
      - community mode 的 stratified levels 沿用 unstratified denominator；levelwise mode 为每个 delimiter level 单独闭合，两者不得混名
      - special n 删除 special base rows 及其 strata 后重新计算 denominator；输出中的 100% 只能解释为 retained ordinary feature space 内的条件组成
      - CPM 必须闭合到 1,000,000、relative abundance 必须闭合到 1；数值只代表相对尺度，不解释为 absolute copies、reads 或 metabolic flux
      - 一次性实际运行 HUMAnN 3.9 humann_renorm_table 的 pathway relab 四个 mode/special 分支，并由常规 QA 与独立复算逐单元格交叉验证
      - pathway coverage 只接受 0–1，既不做 CPM/relative abundance，也不与 pathway abundance 相加或用作分母
      - pathway taxon contribution 只在已有 stratified evidence 内归一；另报 strata sum/community ratio，不强迫非加和 pathway reconstruction 满足 community closure
      - UNMAPPED、UNINTEGRATED、UNGROUPED 与 unclassified taxon 保留各自语义；special feature 不等同于 unclassified organism
      - AsnicarF_2017 资源固定 curatedMetagenomicData 3.12.0、24 个 profiles、15 个 subjects 与 11,173 个原始 pathway rows，样本 ID 必须在 abundance、coverage 和 metadata 间完全一致
      - prevalence 只对 unstratified ordinary pathways比较 abundance > 0、coverage > 0 和 coverage >= 0.5，并展示 10%、25%、50% 三个阈值而非宣称单一最佳阈值
      - zero 表示该 profile 中未检出；pseudocount 固定为 1e-6、1e-5、1e-4，只展示 log-ratio 对选择的敏感性，不把零写成生物学绝对缺失
      - MOCK1 仅用于方法和分母示范，AsnicarF_2017 仅用于多样本 prevalence/zero 审计；不执行疾病、母婴或其他生物组间显著性检验
      - 常规 QA 不访问网络、不载入 FASTQ 或大型数据库，只读取 checksum-locked small evidence
      - 四张图全部使用英文可见文字，并同时导出 PDF、PNG 和 350 dpi LZW TIFF
    common_failures:
      - 在 gene-family CPM 上 regroup 后沿用旧 denominator，或把 reaction expansion 当成新增 reads
      - 用 levelwise 结果冒充 community normalization，导致 strata 图看似闭合却回答了另一个问题
      - 删除 special rows 后将 ordinary rows 的 100% 写成“全部 reads 已注释”
      - 对 coverage 再做 CPM、求和或当作 pathway copy number
      - 用 stratified pathway abundance 强行加回 community abundance，忽略两个层级分别重建 pathway 的非加和性
      - 把 unclassified taxon 与 UNMAPPED/UNINTEGRATED/UNGROUPED 合并成一个“未知”类别
      - 在 prevalence filtering 前后偷偷改变 zero 定义，或只报告一个 pseudocount 下的显著结果
      - 用 1 个 MOCK1 或 15 个重复测量 subject 做未经设计的组间推断
