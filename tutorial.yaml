      同一个 study 或 assay 名可能解析到多个日期资源；sample_id 也不保证跨研究
      唯一。只有同时保存 release、profile lineage、数据库、单位、独立观察单位和
      文件 checksum，跨队列合并才是可复核的数据操作。
