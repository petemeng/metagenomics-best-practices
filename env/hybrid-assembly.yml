name: metagenome-hybrid-2026.07
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - setuptools<81
  - openpyxl=3.1.5
  - numpy=2.2.6
  - matplotlib-base=3.10.9
  - pillow=12.3.0
  - fastp=1.3.6
  - spades=4.3.0
  - polypolish=0.6.1
  - bwa=0.7.19
  - quast=5.3.0
  - minimap2=2.31
  - samtools=1.22.1
  - seqkit=2.11.0
  - pigz=2.8
variables:
  PYTHONHASHSEED: "0"
  PYTHONNOUSERSITE: "1"
