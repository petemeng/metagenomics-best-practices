name: metagenome-deeparg-legacy
channels:
  - conda-forge
  - bioconda
dependencies:
  # DeepARG 1.0.4 is retained only as an isolated sensitivity branch.
  # Its Bioconda recipe still declares Python 2.7 and is not co-installed
  # with the supported RGI environment.
  - python=2.7
  - deeparg=1.0.4

