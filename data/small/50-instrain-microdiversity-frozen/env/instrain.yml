name: metagenome-instrain-2026.07
channels:
  - conda-forge
  - bioconda
channel_priority: strict
dependencies:
  - python=3.8.20
  - instrain=1.10.0
  - biopython=1.74
  - numpy=1.24.4
  - pandas=2.0.3
  - scipy=1.10.1
  - pysam=0.22.1
  - samtools=1.23.1
  - prodigal=2.6.3

# inStrain 1.10.0 constrains Biopython to <=1.74; Python 3.8 is therefore
# pinned deliberately instead of silently resolving against a newer runtime.
