name: metagenome-drep-2026.07
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.5
  - seaborn=0.13
  - biopython=1.84
  - networkx=3.3
  - tqdm=4.66
  - pytest=8.3
  - mash=2.3
  - fastani=1.34
  - mummer4=4.0.1
  - prodigal=2.6.3
  - pip
