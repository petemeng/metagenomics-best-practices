# Scientific choices: review this file in the analysis plan and keep it under version control.
input: samplesheet.csv
outdir: results/nfcore-mag-5.5.0

# One assembly and one coverage model per biological sample.
coassemble_group: false
binning_map_mode: own

# Short-read assembly and deterministic binning.
skip_spades: true
skip_spadeshybrid: true
skip_megahit: false
skip_binning: false
skip_metabat2: false
skip_maxbin2: true
skip_concoct: true
skip_comebin: true
skip_metabinner: true
skip_semibin: true
metabat_rng_seed: 1
semibin_rng_seed: 1

# Publication QC: nf-core/mag defaults do not enable both CheckM2 and GUNC.
skip_binqc: false
run_busco: false
run_checkm: false
run_checkm2: true
checkm2_db: /shared/db/checkm2/zenodo-14897628/checkm2_db_v14897628.dmnd
run_gunc: true
gunc_database_type: progenomes
gunc_db: /shared/db/gunc/progenomes2.1/gunc_db_progenomes2.1.dmnd
skip_gtdbtk: false
gtdb_db: /shared/db/gtdb/release232/gtdbtk_r232_data.tar.gz

# Keep raw-bin and downstream acceptance decisions separable.
refine_bins_dastool: false
generate_bigmag_file: false
monochrome_logs: true
