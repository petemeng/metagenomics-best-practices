[db_dna]
program_name = /workspace/miniconda3/envs/metagenome-biobakery-2026.07/bin/makeblastdb
params = -parse_seqids -dbtype nucl
input = -in
output = -out
version = -version
command_line = #program_name# #params# #input# #output#

[map_dna]
program_name = /workspace/miniconda3/envs/metagenome-biobakery-2026.07/bin/blastn
params = -outfmt 6 -evalue 0.1 -max_target_seqs 1000000 -perc_identity 75
input = -query
database = -db
output = -out
version = -version
command_line = #program_name# #params# #input# #database# #output#

[msa]
program_name = /workspace/miniconda3/envs/metagenome-biobakery-2026.07/bin/mafft
params = --quiet --anysymbol --thread 1 --auto
version = --version
command_line = #program_name# #params# #input# > #output#

[tree1]
program_name = /workspace/miniconda3/envs/metagenome-biobakery-2026.07/bin/raxmlHPC-PTHREADS-SSE3
params = -p 20260751 -m GTRCAT
input = -s
output_path = -w
output = -n
version = -v
command_line = #program_name# #params# #threads# #output_path# #input# #output#
threads = -T

